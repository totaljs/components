<!-- Example: a data-source with descriptions, the callback is linked from the configuration and the label is the content of the tag -->
<ui-component name="radiolist" path="*form.plan" config="datasource:*form.plans;change:onplanchange;required:true">Plan</ui-component>

<!-- Example: the items are in the configuration (text|value, separated by a comma) -->
<ui-component name="radiolist" path="*form.size" config="items:Small|s,Medium|m,Large|l">Size</ui-component>

<!-- Example: a disabled instance -->
<ui-component name="radiolist" path="*form.locked" config="items:One|1,Two|2;disabled:true">Disabled</ui-component>

<script>

	SET('*form.plans', [
		{ id: 'free', name: 'Free', description: 'For personal projects' },
		{ id: 'pro', name: 'Pro', description: 'Everything in Free, and more' },
		{ id: 'team', name: 'Team', description: 'Collaboration for teams' }
	]);

	SET('*form.plan', 'pro');
	SET('*form.size', 'm');
	SET('*form.locked', '2');

	// A global function linked from "config" (change:onplanchange)
	function onplanchange(value, component) {
		// A reaction to the change made by the user
	}

</script>
