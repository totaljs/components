<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>

		.ui-radiolist { position: relative; margin-bottom: var(--margin); font: 17px/22px -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
		.ui-radiolist-label { padding: 0 16px 6px; font-size: 13px; line-height: 18px; text-transform: uppercase; color: #6D6D72; }
		.ui-radiolist-required .ui-radiolist-label:after { content: ' *'; color: #FF3B30; }

		/* Grouped list */
		.ui-radiolist-list { background: #F2F2F7; border-radius: 10px; overflow: hidden; }
		.ui-radiolist-item { position: relative; display: flex; align-items: center; min-height: 44px; padding: 0 16px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; outline: 0; }
		.ui-radiolist-item + .ui-radiolist-item:before { content: ''; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: #C6C6C8; transform: scaleY(0.5); transform-origin: top; }
		.ui-radiolist-item:active { background: #E5E5EA; }
		.ui-radiolist-item:focus-visible { box-shadow: inset 0 0 0 2px rgba(var(--rgb), 0.6); }

		.ui-radiolist-text { flex: 1; min-width: 0; padding: 11px 0; }
		.ui-radiolist-text span { display: block; color: #000; }
		.ui-radiolist-text small { display: block; margin-top: 1px; font-size: 15px; line-height: 20px; color: #8E8E93; }
		.ui-radiolist-check { width: 24px; margin-left: 12px; text-align: right; font-size: 18px; color: var(--color); opacity: 0; transition: opacity 0.15s; }
		.ui-radiolist-selected .ui-radiolist-check { opacity: 1; }

		@media (hover: hover) {
			.ui-radiolist:not(.ui-disabled) .ui-radiolist-item:hover { background: #ECECF0; }
		}

		/* States */
		.ui-radiolist.ui-disabled { opacity: 0.5; }
		.ui-radiolist.ui-disabled .ui-radiolist-item { cursor: not-allowed; }
		.ui-radiolist-invalid .ui-radiolist-list { box-shadow: inset 0 0 0 1px #FF3B30; }

		@media (prefers-reduced-motion: reduce) {
			.ui-radiolist-check { transition: none; }
		}

		/* Dark mode */
		.ui-dark .ui-radiolist-label { color: #98989F; }
		.ui-dark .ui-radiolist-list { background: #1C1C1E; }
		.ui-dark .ui-radiolist-item + .ui-radiolist-item:before { background: #38383A; }
		.ui-dark .ui-radiolist-item:active { background: #2C2C2E; }
		.ui-dark .ui-radiolist-text span { color: #FFF; }
		.ui-dark .ui-radiolist-text small { color: #98989F; }
		@media (hover: hover) {
			.ui-dark .ui-radiolist:not(.ui-disabled) .ui-radiolist-item:hover { background: #242426; }
		}

	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('radiolist', 'text:name;value:id;description:description;disabled:false;required:false', function(self, config, cls) {

			var cls2 = '.' + cls;
			var items = [];

			// Parses "text|value|description,text|value" (a comma in the text is written as \,)
			var parse = function(str) {
				var arr = [];
				(str || '').replace(/\\,/g, '\0').split(',').forEach(function(item) {
					item = item.replace(/\0/g, ',').split('|');
					var text = (item[0] || '').trim();
					if (text)
						arr.push({ text: text, value: item[1] == null ? text : item[1].trim(), description: (item[2] || '').trim() });
				});
				return arr;
			};

			// Normalizes the array of the data-source according to the "text", "value" and "description" keys
			var normalize = function(arr) {
				var output = [];
				(arr || []).forEach(function(item) {
					if (item != null && typeof(item) === 'object')
						output.push({ text: item[config.text], value: item[config.value], description: item[config.description] || '' });
					else
						output.push({ text: item, value: item, description: '' });
				});
				return output;
			};

			var same = function(a, b) {
				return a != null && b != null && (a + '') === (b + '');
			};

			var render = function() {

				var list = self.find(cls2 + '-list').empty();

				items.forEach(function(item, index) {
					var el = $('<div class="{0}-item" role="radio" aria-checked="false" tabindex="-1"></div>'.format(cls));
					var text = $('<div class="{0}-text"><span></span></div>'.format(cls));
					text.find('span').text(item.text);
					item.description && text.append($('<small></small>').text(item.description));
					el.attr('data-index', index).append(text).append('<i class="ti ti-check {0}-check"></i>'.format(cls));
					list.append(el);
				});

				self.setter(self.get());
			};

			// A user interaction: normalize -> self.modify() -> setter. The callback is executed once per change.
			var select = function(index) {

				var item = items[index];

				if (config.disabled || !item || same(item.value, self.get()))
					return;

				self.modify(item.value);
				config.change && self.EXEC(config.change, item.value, self);
			};

			var focus = function(index) {
				var el = self.find(cls2 + '-item').eq(index);
				el.length && el.focus();
				select(index);
			};

			self.make = function() {

				var label = config.label || $.trim(self.element.text());

				self.aclass(cls);
				self.html('<div class="{0}-label" id="{1}"></div><div class="{0}-list" role="radiogroup"></div>'.format(cls, self.ID + '-label'));
				self.find(cls2 + '-label').text(label).tclass('hidden', !label);
				self.find(cls2 + '-list').attr('aria-labelledby', self.ID + '-label');

				self.tclass('ui-disabled', !!config.disabled);
				self.tclass(cls + '-required', !!config.required);

				if (config.datasource)
					self.datasource(config.datasource, onsource);
				else if (config.items)
					items = parse(config.items);

				self.event('click', cls2 + '-item', function() {
					select(+$(this).attr('data-index'));
				});

				self.event('keydown', cls2 + '-item', function(e) {

					var index = +$(this).attr('data-index');
					var count = items.length;

					switch (e.which) {
						case 40: // down
						case 39: // right
							focus((index + 1) % count);
							break;
						case 38: // up
						case 37: // left
							focus((index - 1 + count) % count);
							break;
						case 32: // space
						case 13: // enter
							select(index);
							break;
						default:
							return;
					}

					e.preventDefault();
				});

				render();
			};

			// In jComponent v20 the first argument of the data-source callback is the value
			var onsource = function(value) {
				items = normalize(value);
				render();
			};

			// The model changed: only render (checkmark, ARIA state, the roving tabindex)
			self.setter = function(value) {

				var els = self.find(cls2 + '-item');
				var selected = -1;

				items.forEach(function(item, index) {
					if (selected === -1 && same(item.value, value))
						selected = index;
				});

				els.each(function(index) {
					var is = index === selected;
					$(this).tclass(cls + '-selected', is).attr({ 'aria-checked': is ? 'true' : 'false', tabindex: !config.disabled && (is || (selected === -1 && index === 0)) ? '0' : '-1', 'aria-disabled': config.disabled ? 'true' : 'false' });
				});
			};

			self.validate = function(value) {
				return (config.disabled || !config.required) ? true : (value != null && value !== '');
			};

			self.state = function(type) {
				if (type) {
					var invalid = config.required ? self.isInvalid() : false;
					self.tclass(cls + '-invalid', invalid);
					self.find(cls2 + '-list').attr('aria-invalid', invalid ? 'true' : 'false');
				}
			};

			self.configure = function(key, value, init) {

				if (init)
					return;

				switch (key) {
					case 'items':
						items = parse(value);
						render();
						break;
					case 'datasource':
						self.datasource(value, onsource);
						break;
					case 'text':
					case 'value':
					case 'description':
						config.datasource && onsource(GET(self.makepath(config.datasource)));
						break;
					case 'label':
						self.find(cls2 + '-label').text(value).tclass('hidden', !value);
						break;
					case 'disabled':
						self.tclass('ui-disabled', !!value);
						self.setter(self.get());
						break;
					case 'required':
						self.tclass(cls + '-required', !!value);
						self.state(1);
						break;
				}
			};

		});

	</script>

	<!-- Example: a data-source with descriptions, the callback is linked from the configuration -->
	<ui-component name="radiolist" path="*form.plan" config="label:Plan;datasource:*form.plans;change:onplanchange;required:true"></ui-component>

	<!-- Example: the items are in the configuration (text|value, separated by a comma) -->
	<ui-component name="radiolist" path="*form.size" config="label:Size;items:Small|s,Medium|m,Large|l"></ui-component>

	<!-- Example: a disabled instance -->
	<ui-component name="radiolist" path="*form.locked" config="label:Disabled;items:One|1,Two|2;disabled:true"></ui-component>

	<script>

		SET('*form.plans', [
			{ id: 'free', name: 'Free', description: 'For personal projects' },
			{ id: 'pro', name: 'Pro', description: 'Everything in Free, and more' },
			{ id: 'team', name: 'Team', description: 'Collaboration for teams' }
		]);

		SET('*form.plan', 'pro');
		SET('*form.size', 'm');
		SET('*form.locked', '2');

		// A global function linked from "config" (change:onplanchange)
		function onplanchange(value, component) {
			// A reaction to the change made by the user
		}

	</script>

</body>
</html>
