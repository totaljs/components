<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-drawer { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background-color: rgba(100,100,100,0.5); z-index: 10; transition: 0.2s all; opacity: 0; }
		.ui-drawer-nav { height: 100%; background-color: #FFF; box-shadow: 15px 0 20px rgba(0,0,0,0.05); padding: 10px 0; position: absolute; transition: 0.3s all; }
		.ui-drawer-aleft .ui-drawer-nav { left: -300px; }
		.ui-drawer-aright .ui-drawer-nav { right: -300px; }
		.ui-drawer-atop .ui-drawer-nav { left: 0; right: 0; height: auto; width: auto; top: -1000px; }
		.ui-drawer-abottom .ui-drawer-nav { left: 0; right: 0; bottom: -1000px; width: auto; height: auto; }
		.ui-drawer-visible { opacity: 1; }
		.ui-drawer-visible.ui-drawer-aleft .ui-drawer-nav { left: 0; }
		.ui-drawer-visible.ui-drawer-aright .ui-drawer-nav { right: 0; }
		.ui-drawer-visible.ui-drawer-atop .ui-drawer-nav { top: 0; }
		.ui-drawer-visible.ui-drawer-abottom .ui-drawer-nav { bottom: 0; }
		.ui-drawer-nav button, .ui-drawer-nav a { display: block; width: 100%; text-align: left; padding: 0 10px 0; height: 40px; text-decoration: none; border: 0; background-color: transparent; font-size: 16px; color: #606060; outline: 0; }
		.ui-drawer-nav a { padding-top: 11px; }
		.ui-drawer-nav hr { margin: 10px 0; }
		.ui-drawer-nav button:hover, .ui-drawer-nav a:hover { background-color: rgba(0,0,0,0.05); text-decoration: none; color: #000; }
		.ui-drawer .selected { background-color: rgba(0,0,0,0.07); color: #000; }
		.ui-drawer-nav .ti, .ui-drawer-nav .ti { width: 25px; margin: 0 10px; }

		.ui-dark .ui-drawer { background-color: rgba(0,0,0,0.5); }
		.ui-dark .ui-drawer-nav { background-color: #303030; }
		.ui-dark .ui-drawer-nav button, .ui-dark .ui-drawer-nav a { color: #C0C0C0; }
		.ui-dark .ui-drawer-nav button:hover, .ui-dark .ui-drawer-nav a:hover { background-color: rgba(100,100,100,0.15); color: #FFF; }
		.ui-dark .ui-drawer .selected { background-color: rgba(0,0,0,0.2); color: #FFF; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('drawer', 'align:left;width:250', function(self, config, cls) {

			var container;
			var old;

			self.readonly();

			self.make = function() {
				self.aclass(cls + ' ' + cls + '-a' + config.align);
				self.element.wrapInner('<div class="' + cls + '-nav"></div>');
				container = self.find('.' + cls + '-nav');

				self.event('click', function() {
					self.set('');
				});

				// Moves drawer under <body
				if (self.dom.parentNode.tagName !== 'BODY')
					document.body.appendChild(self.dom);

				self.on('resize2', self.resize);
				self.resize();
			};

			self.resize = function() {
				var d = WIDTH();
				var w = config[d] || config.width;
				if (w !== old) {
					old = w;
					container.css('width', w);
				}
			};

			self.setter = function(value) {
				var c = cls + '-visible';
				if (value === config.if) {
					self.rclass('hidden');
					self.aclass(c, 100);
				} else
					self.rclass(c).aclass('hidden', 800);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="drawer" path="common.menu" config="if:main;align:left" class="hidden">
		<button><i class="ti ti-inbox"></i>Inbox</button>
		<button class="selected"><i class="ti ti-star"></i>Starred</button>
		<button><i class="ti ti-envelope"></i>Send mail</button>
		<hr />
		<a href="#"><i class="ti ti-trash"></i>Trash</a>
	</ui-component>

	<script>
		var common = { menu: 'main' };
	</script>

</body>
</html>
