<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-rating { color: #A0A0A0; font-size: 12px; text-align: center; }
		.ui-rating > div { margin-top: 8px; }
		.ui-rating i { margin-left: 5px; cursor: pointer; font-size: 20px; }
		.ui-rating i:first-child { margin-left: 0; }
		.ui-rating-selected { color: #FFB715; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('rating', function(self, config, cls) {

			var iok = 'ti-star-alt';
			var ino = 'ti-star-alt';

			self.readonly();

			self.make = function() {
				var builder = [];
				for (var i = 0; i < 5; i++)
					builder.push('<i class="ti {0}"></i>'.format(ino));
				self.aclass(cls);
				self.html('{0}<div>{1}</div>'.format(self.html(), builder.join('')));
				self.event('click', 'i', function() {
					!config.disabled && self.bind('@touched @modified @setter', $(this).index() + 1);
				});
			};

			self.setter = function(value) {
				var index = (value > 0 ? value >> 0 : 0);
				self.find('i').each(function(counter) {
					var el = $(this);
					var is = counter < index;
					if (is)
						el.rclass(ino).aclass(iok);
					else
						el.rclass(iok).aclass(ino);
					el.tclass(cls + '-selected', is);
				});
			};
		});

	</script>

	<!-- Example -->
	<br />
		<ui-component name="rating" path="rating" config="null" default="3">Please rate our products and services:</ui-component>
	<br />

</body>
</html>
