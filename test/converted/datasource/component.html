<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-datasource {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('datasource', 'delay:0', function(self, config) {

			var fn = null;

			self.readonly();

			self.make = function() {
				var scr = self.find('scr' + 'ipt');
				if (scr.length)
					fn = new Function('value', scr.html());
			};

			self.reload = function(url) {
				if (!url.includes(' '))
					url = 'GET ' + url;
				AJAX(url, response => SET(self.makepath(config.path), fn ? fn(response) : response));
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'url':
						if (config.delay)
							setTimeout2(self.ID, () => self.reload(value), config.delay);
						else
							self.reload(value);
						break;
				}
			};

			self.setter = function(value) {
				if (value) {
					if (config.delay)
						setTimeout2(self.ID, () => self.reload(value), config.delay);
					else
						self.reload(value);
				}
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="datasource" config="url:https://www.totaljs.com/dashboard.json;path:#mycodelist">
		<script type="text/plain">
			return value.children;
		</script>
	</ui-component>

	<ui-bind path="#mycodelist" config="html pre:JSON.stringify(value, null, '  ')" class="block">
		<pre></pre>
	</ui-bind>

</body>
</html>
