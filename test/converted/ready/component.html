<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-ready {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('ready', 'delay:800', function(self, config) {

			self.readonly();
			self.blind();

			self.make = function() {
				config.rclass && self.rclass(config.rclass, config.adelay || config.delay);
				config.aclass && self.aclass(config.aclass, config.rdelay || config.delay);
				self.rclass('invisible', config.adelay || config.delay);
				config.focus && setTimeout(function() {
					self.autofocus(config.focus === true || config.focus === 1 ? null : config.focus).focus();
				}, config.fdelay || (config.delay + 5));
			};

		});

	</script>

	<!-- Example -->
	<style>
		.ready { width: 200px; height: 200px; border: 2px solid red; padding: 20px; }
	</style>

	<ui-component name="ready" config="aclass:ready" class="invisible">
		Hello World!
	</ui-component>

</body>
</html>
