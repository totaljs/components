<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.listmenu a { display: block; padding: 2px 5px; }
		.listmenu .selected { background-color: #F0F0F0; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('listmenu', 'class:selected;selector:a;property:id;click:true', function(self, config) {

			var old, oldvalue;

			self.readonly();

			self.make = function() {
				var scr = self.find('script');
				self.template = Tangular.compile(scr.html());
				scr.remove();
			};

			self.configure = function(name, value) {
				switch (name) {
					case 'datasource':
						self.datasource(value, self.rebind);
						break;
				}
			};

			self.rebind = function(path, value) {

				if (!value || !value.length) {
					self.empty();
					return;
				}

				var builder = [];
				var opt = { length: value.length };
				for (var i = 0; i < opt.length; i++) {
					var item = value[i];
					opt.index = i;
					builder.push(self.template(item, opt));
				}

				oldvalue = null;
				self.html(builder.join(''));

				config.click && self.find(config.selector).on('click', function() {
					var arr = self.find(config.selector).toArray();
					var index = arr.indexOf(this);
					if (index !== -1) {
						var item = self.finditem(self.get(self.makepath(config.datasource)), index);
						item && self.set(item[config.property]);
					}
				});

				self.refresh();
			};

			self.finditem = function(arr, index) {
				var j = 0;
				for (var i = 0; i < arr.length; i++) {
					var item = arr[i];
					var id = item[config.property];
					if (id && id != '-') {
						if (index === j)
							return item;
						j++;
					}
				}
			};

			self.findindex = function(arr, value) {
				var j = 0;
				for (var i = 0; i < arr.length; i++) {
					var item = arr[i];
					var id = item[config.property];
					if (id && id != '-') {
						if (id === value)
							return j;
						j++;
					}
				}
			};

			self.setter = function(value) {
				var arr = GET(self.makepath(config.datasource));
				if (arr && arr.length) {
					if (value === oldvalue)
						return;

					oldvalue = value;
					old && old.rclass(config.class);
					var index = self.findindex(arr, value);
					if (value)
						old = self.find(config.selector).eq(index).aclass(config.class);
				}
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="listmenu" path="listmenu.selected" config="datasource:listmenu.datasource" class="listmenu">
		<script type="text/html">
			{{ if id && id !== '-' }}
				<a href="#">{{ name }}</a>
			{{ else }}
				<hr />
			{{ fi }}
		</script>
	</ui-component>

	<script>

		var listmenu = {};

		// Default selected item
		listmenu.selected = 4;

		// Data-Source
		listmenu.datasource = [];
		listmenu.datasource.push({ id: 1, name: 'List Item 1' });
		listmenu.datasource.push({ id: '-' });
		listmenu.datasource.push({ id: 2, name: 'List Item 2' });
		listmenu.datasource.push({ id: 3, name: 'List Item 3' });
		listmenu.datasource.push({ id: 4, name: 'List Item 4' });
		listmenu.datasource.push({ id: 5, name: 'List Item 5' });
		listmenu.datasource.push({});
		listmenu.datasource.push({ id: 6, name: 'List Item 6' });
		listmenu.datasource.push({});
		listmenu.datasource.push({ id: 7, name: 'List Item 7' });
		listmenu.datasource.push({ id: 8, name: 'List Item 8' });
		listmenu.datasource.push({ id: 9, name: 'List Item 9' });
		listmenu.datasource.push({ id: 0, name: 'List Item 0' });

	</script>

</body>
</html>
