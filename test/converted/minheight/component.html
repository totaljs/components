<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-minheight {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('minheight', 'parent:auto;margin:0;attr:min-height', function(self, config, cls) {

			var timeout;
			var init = false;

			self.readonly();

			self.make = function() {
				self.aclass(cls);
				self.on('resize2', self.resize);
				self.resizeforce();
			};

			self.resize = function() {
				timeout && clearTimeout(timeout);
				timeout = setTimeout(self.resizeforce, 200);
			};

			self.resizeforce = function() {

				if (config['disabled' + WIDTH()]) {
					self.css(config.attr, config.minheight || '');
					return;
				}

				var parent = self.parent(config.parent);
				var h = parent.height() - config.margin;

				if (config.topoffset)
					h -= self.element.offset().top;

				if (config.topposition)
					h -= self.element.position().top;

				if (config.minheight && h < config.minheight)
					h = config.minheight;

				self.css(config.attr, h);

				if (!init) {
					init = true;
					self.rclass('invisible hidden');
				}

			};

		});

	</script>

	<!-- Example -->
	<style>body{margin:0;padding:0}</style>
	<ui-component name="minheight" path="datasource" config="parent:window" style="border:1px solid red"></ui-component>

</body>
</html>
