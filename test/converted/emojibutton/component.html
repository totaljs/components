<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-emojibutton.ui-disabled { cursor: not-allowed !important; opacity: 0.6; border-color: #E0E0E0 !important; }
		.ui-emojibutton { border: 1px solid #E0E0E0; height: 32px; border-radius: var(--radius); cursor: pointer; background-color: #FFF; color: #000; }
		.ui-emojibutton-icon { height: 24px; margin: 0 32px 0 0; line-height: 32px; font-size: 20px; text-align: center; }
		.ui-emojibutton:hover { border-color: #D0D0D0; }
		.ui-emojibutton-arrow { width: 32px; float: right; display: block; text-align: center; line-height: 31px; height: 31px; border-left: 1px solid #E0E0E0; }

		.ui-dark .ui-emojibutton.ui-disabled { border-color: #404040 !important; }
		.ui-dark .ui-emojibutton { border-color: #404040; background-color: #303030; color: #FFF; }
		.ui-dark .ui-emojibutton-arrow { border-left-color: #404040; }
		.ui-dark .ui-emojibutton:hover { border-color: #505050; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('emojibutton', 'default:#FFFFFF;align:left;position:top', function(self, config) {

			var cls = 'ui-emojibutton';
			var icon;

			self.make = function() {
				self.aclass(cls);
				self.append('<span class="{0}-arrow"><i class="ti ti-angle-down"></i></span><div class="{0}-icon"></div>'.format(cls));
				icon = self.find('.' + cls + '-icon');

				self.event('click', function() {
					if (config.disabled)
						return;
					var opt = {};
					opt.align = config.align;
					opt.position = config.position;
					opt.offsetX = config.offsetX;
					opt.offsetY = config.offsetY;
					opt.element = self.element;
					opt.callback = function(color) {
						self.set(color.toUpperCase());
						self.change(true);
					};
					SETTER('emoji', 'show', opt);
				});
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'disabled':
						self.tclass('ui-disabled', !!value);
						break;
				}
			};

			self.setter = function(value) {
				icon.html(value);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="emoji"></ui-component>

	<div class="row">
		<div class="col-xs-4">
			<ui-component name="emojibutton" path="icon"></ui-component>
		</div>
	</div>

	<script>
		var icon = '☠';
	</script>

</body>
</html>
