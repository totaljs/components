<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-tooltip { position: absolute; z-index: 80; pointer-events: none; z-index: 1000; transition: opacity 0.2s; opacity: 0; }
		.ui-tooltip-visible { opacity: 1; }
		.ui-tooltip-body { padding: 5px 10px; font-size: 11px; background:rgba(0,0,0,0.9); color: #FFF; border-radius: var(--radius); }
		.ui-tooltip-body::before { content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); border-width: 5px 7px 0 7px; border-style: solid; border-color: rgba(0,0,0,0.9) transparent transparent transparent; z-index: 1000; }
		.ui-tooltip-arrow-left::before { left: 100%; top: 50%; margin-left: -5px; transform: translatey(-50%) rotate(-90deg); }
		.ui-tooltip-arrow-top::before { left: 50%; top: 100%; }
		.ui-tooltip-arrow-bottom::before { top: -8px; margin-top: 8px; transform: translateX(-50%) translatey(-100%) rotate(-180deg); }
		.ui-tooltip-arrow-right::before { left: -9px; top: 50%; transform: translatey(-50%) rotate(90deg); }

		.ui-dark .ui-tooltip-body { background:rgba(255,255,255,0.9); color: #000000; }
		.ui-dark .ui-tooltip-body::before { border-color: rgba(255,255,255,0.9) transparent transparent transparent; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('tooltip', function(self, config, cls) {

			var is = false;
			var can = true;
			var prev;

			self.singleton();
			self.readonly();
			self.blind();

			self.enable = function() {
				can = true;
			};

			var prevcleaner = function() {
				prev = null;
			};

			self.hideforce = function() {
				prev = self.opt.element[0];
				self.aclass('hidden');
				self.rclass(cls + '-visible');
				is = false;
				setTimeout2(self.ID + 'prev', prevcleaner, 1000);
			};

			self.make = function() {
				self.aclass(cls + ' hidden');
				self.on('scroll + resize + reflow + resize2', function() {
					self.hide(true);
					can = false;
					setTimeout2(self.ID + 'can', self.enable, 1000);
				});

				$(document).on('click', function() {
					self.hide(true);
				});
			};

			self.hide = function(force) {
				is && setTimeout2(self.ID, self.hideforce, force ? 1 : 200);
			};

			self.show = function(opt) {

				if (!can)
					return;

				var tmp = opt.element ? opt.element instanceof jQuery ? opt.element[0] : opt.element.element ? opt.element.dom : opt.element : null;

				if (prev === tmp)
					return;

				if (is && tmp && self.target === tmp) {
					self.hide();
					return;
				}

				clearTimeout2(self.ID);

				self.target = tmp;
				self.opt = opt;
				self.html('<div class="' + cls + '-body">' + opt.html + '</div>');

				var b = self.find('.' + cls + '-body');
				b.rclass2(cls + '-arrow-');
				b.aclass(cls + '-arrow-' + opt.align);

				var css = {};

				if (is) {
					css.left = 0;
					css.top = 0;
					self.element.css(css);
				} else {
					self.rclass('hidden');
					self.aclass(cls + '-visible', 100);
					is = true;
				}

				var target = $(opt.element);
				var w = self.width();
				var h = self.height();
				var offset = target.offset();

				switch (opt.align) {
					case 'left':
					case 'right':
						css.top = offset.top + (opt.center ? (h / 2 >> 0) : 0);
						css.left = opt.align === 'left' ? (offset.left - w - 10) : (offset.left + target.innerWidth() + 10);
						break;
					default:
						css.left = Math.ceil((offset.left - w / 2) + (target.innerWidth() / 2));
						css.top = opt.align === 'bottom' ? (offset.top + target.innerHeight() + 10) : (offset.top - h - 10);
						break;
				}

				if (opt.offsetX)
					css.left += opt.offsetX;

				if (opt.offsetY)
					css.top += opt.offsetY;

				opt.timeout && setTimeout2(self.ID, self.hide, opt.timeout - 200);
				self.element.css(css);
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="tooltip"></ui-component>

	<div style="padding:50px">
		<div class="tooltip" data-title="Lorem ipsum dolor sit amet 1." style="text-align:center;background-color:#F0F0F0;padding:10px 0;">HOVER ME 1</div>
		<br />
		<br />
		<div class="tooltip" data-title="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Voluptas, expedita." style="text-align:center;background-color:#F0F0F0;padding:10px 0;">HOVER ME 2</div>
	</div>

	<script>
		$(document).on('mouseenter mouseleave', '.tooltip', function(e) {
			if (e.type === 'mouseenter') {
				var el = $(this);
				var opt = {};
				opt.element = el;
				opt.html = el.attrd('title');
				opt.align = 'bottom';
				opt.timeout = 3000;
				SETTER('tooltip', 'show', opt);
			} else
				SETTER('tooltip', 'hide');
		});
	</script>

</body>
</html>
