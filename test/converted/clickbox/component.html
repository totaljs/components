<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-clickbox { position: relative; width: 100%; display: block; min-height: 32px; }
		.ui-clickbox > a { display: none; }
		.ui-clickbox div { height: 32px; background-color: #FFF; font-size: 14px; border-radius: var(--radius); border: 1px solid #D0D0D0; padding: 5px 8px 0; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
		.ui-clickbox div .ti { float: right; margin: 3px 3px 0 0; }
		.ui-clickbox div span { display: block; margin-right: 15px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; font-weight: bold; color: #000; }
		.ui-clickbox nav a { display: block; border-top: 1px solid #E0E0E0; font-size: 12px; padding: 3px 8px; }
		.ui-clickbox nav a:first-child { border-top: 0; }
		.ui-clickbox nav { position: absolute; z-index: 2; background-color: #FFF; box-shadow: 0 5px 10px rgba(0,0,0,0.05); width: 100%; border-radius: 0 0 4px 4px; border: 1px solid #E0E0E0; display: none; margin-top: -3px; max-height: 200px; overflow: auto; overflow-scrolling: touch; }
		.ui-clickbox-visible nav { display: block; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('clickbox', function(self, config, cls) {

			var cls2 = '.' + cls;

			self.readonly();
			self.blind();

			self.init = function() {
				$(document).on('click', function() {
					$(cls2 + '-visible').rclass(cls + '-visible');
				});
			};

			self.make = function() {

				self.aclass(cls);

				var el = self.element;

				el.wrapInner('<nav></nav>');
				el.prepend('<div><i class="ti ti-caret-down"></i><span></span></div>');
				self.event('click', function() {

					var c = cls + '-visible';

					if (self.hclass(c)) {
						self.rclass(c);
						return;
					}

					self.aclass(c, 50);
				});

				self.refresh();
			};

			self.refresh = function() {

				var query = NAV.query;
				var value = query[config.param] || '';
				var all = self.find('a');

				if (!value)
					all = all.eq(0);

				all.each(function() {
					var t = this;
					if (t.href.indexOf(config.param + '=' + value) !== -1) {
						var el = $(t).aclass('selected');
						self.find('span').html(el.text());
					}
				});
			};
		});

	</script>

	<!-- Example -->
	<div style="padding:50px;width:300px">
		<ui-component name="clickbox" config="param:manufacturer">
			<a href="?manufacturer=">All manufacturers</a>
			<a href="?manufacturer=apple">Apple</a>
			<a href="?manufacturer=google">Google</a>
			<a href="?manufacturer=microsoft">Microsoft</a>
			<a href="?manufacturer=ibm">IBM</a>
			<a href="?manufacturer=dell">Dell</a>
			<a href="?manufacturer=toshiba">Toshiba</a>
		</ui-component>
	</div>

</body>
</html>
