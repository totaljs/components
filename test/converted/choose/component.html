<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-choose {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('choose', 'limit:1;attr:id;key:id;selector:.selection;event:click;class:selected;type:string;uncheck:false', function(self, config, cls) {

			var convert = function(val) {
				switch (config.type) {
					case 'number':
						return val ? val.parseInt() : null;
					default:
						return val;
				}
			};

			self.getter = null;
			self.validate = function(value) {
				if (config.disabled || !config.required)
					return true;
				return config.limit === 1 ? value != null : value && value.length > 0;
			};

			self.make = function() {

				self.aclass(cls);

				self.event(config.event, config.selector, function(e) {
					e.preventDefault();
					e.stopPropagation();
					self.toggle($(this));
				});

			};

			self.toggle = function(id) {

				if (config.disabled)
					return;

				id = convert(ATTRD(id, config.attr));

				var model = self.get();
				var tmp;

				if (model == null) {
					self.rewrite(model);
					tmp = config.limit === 1 ? id : [id];
					self.set(tmp);
					config.click && self.EXEC(config.click, tmp);
				} else {
					if (config.limit === 1) {
						if (model === id) {
							if (config.uncheck) {
								self.bind('@modified @touched @setter', null);
								config.click && self.EXEC(config.click, null);
							}
						} else {
							self.bind('@modified @touched @setter', id);
							config.click && self.EXEC(config.click, id);
						}
					} else {
						var index = model.indexOf(id);
						if (index === -1) {
							if (config.limit <= model.length)
								model.pop();
							model.push(id);
						} else
							model.splice(index, 1);
						config.click && self.EXEC(config.click, model);
						self.bind('@modified @touched @setter', model);
					}
				}
				self.change(true);
			};

			self.recalc = function() {

				let arr = self.find(config.selector);
				let model = self.get();

				for (let i = 0; i < arr.length; i++) {

					let el = $(arr[i]);
					let is = false;
					let index = -1;

					if (config.limit === 1) {
						is = model == null ? false : model === convert(el.attrd(config.attr));
					} else {
						index = model && model instanceof Array && model.length ? model.indexOf(el.attrd(config.attr)) : -1;
						is = index != -1;
					}

					if ((!config.limit || config.limit > 1) && config.indexer)
						el.find(config.indexer).text(is ? (index + 1) : '');

					el.tclass(config.class, is);
				}
			};

			var datasource = function() {
				self.update();
			};

			self.configure = function(key, value) {
				if (key === 'datasource')
					self.datasource(value, datasource);
			};

			self.setter = function() {
				setTimeout2(self.ID, self.recalc, 10);
			};

		});

	</script>

	<!-- Example -->
	<style>
		.iconmenu { height: 60px; text-align: center; }
		.iconmenu i { font-size: 20px; display: block; padding: 10px 0 0; }
		.iconmenu span { font-size: 12px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 3px 5px 0; color: #777; }
		.iconmenu > div.selected { background-color: rgba(0,0,0,0.07); }
		.iconmenu > div { height: 60px; width: 75px; border: 1px solid #E0E0E0; border-left-width: 0; float: left; cursor: pointer; }
		.iconmenu > div:first-child { border-left-width: 1px; border-top-left-radius: var(--radius); border-bottom-left-radius: var(--radius); }
		.iconmenu > div:last-child { border-top-right-radius: var(--radius); border-bottom-right-radius: var(--radius); }
	</style>

	<ui-component name="choose" path="myselectionsingle" config="selector:div;limit:1" class="iconmenu m">
		<div data-id="male">
			<i class="ti ti-male"></i>
			<span>Male</span>
		</div>
		<div data-id="female">
			<i class="ti ti-female"></i>
			<span>Female</span>
		</div>
	</ui-component>

	<ui-component name="choose" path="myselectionmultiple" config="selector:div;limit:2;indexer:b" class="iconmenu m">
		<div data-id="male">
			<i class="ti ti-male"></i>
			<span>Male</span><b></b>
		</div>
		<div data-id="female">
			<i class="ti ti-female"></i>
			<span>Female</span><b></b>
		</div>
		<div data-id="unknown">
			<i class="ti ti-question-circle"></i>
			<span>Unknown</span><b></b>
		</div>
	</ui-component>

	<div>Output single: <code><ui-bind path="myselectionsingle" config="text:JSON.stringify(value)"></ui-bind></code></div>
	<div>Output multiple: <code><ui-bind path="myselectionmultiple" config="text:JSON.stringify(value)"></ui-bind></code></div>

</body>
</html>
