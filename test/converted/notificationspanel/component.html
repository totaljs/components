<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-notificationspanel { position: fixed; right: 0; width: 300px; top: 0; background-color: rgba(255,255,255,0.9); border-left: 1px solid #E0E0E0; box-shadow: -10px 0 10px rgba(0,0,0,0.05); z-index: 5; }
		.ui-notificationspanel-header { height: 30px; border-bottom: 1px solid #E0E0E0; font-size: 12px; line-height: 29px; padding: 0 0 0 10px; color: gray; }
		.ui-notificationspanel-clear { float: right; cursor: pointer; line-height: 27px; color: #A0A0A0; margin-right: 10px; font-size: 11px; }
		.ui-notificationspanel-clear:hover { color: #e73323 !important; }
		.ui-notificationspanel-close { float: right; cursor: pointer; line-height: 29px; color: #e73323; border-left: 1px solid #E0E0E0; text-align: center; width: 29px; }
		.ui-notificationspanel-close:hover { background-color: red; color: #FFF; }

		.ui-dark .ui-notificationspanel-header { border-bottom-color: #303030; }
		.ui-dark .ui-notificationspanel-clear { color: #505050; }
		.ui-dark .ui-notificationspanel-close { border-left-color: #303030; }
		.ui-dark .ui-notificationspanel { background-color: rgba(20,20,20,0.9); border-left-color: #303030; box-shadow: -10px 0 10px rgba(0,0,0,0.1); }

		@media(max-width: 767px) {
			.ui-notificationspanel { width: 100%; border-left: 0; }
		}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('notificationspanel', 'top:0;visibleY:1;title:Notifications;autoremove:1', function(self, config, cls) {

			var cls2 = '.' + cls;
			var container, scrollbar, elclear, items;

			self.singleton();

			self.make = function() {
				var scr = self.find('script');
				self.aclass(cls + ' hidden');
				self.template = Tangular.compile('<div class="{0}-item" data-index="{{ index }}">{1}</div>'.format(cls, scr.html().trim()));
				self.html('<div class="{0}-header"><span class="{0}-close"><i class="ti ti-caret-square-down"></i></span><i class="ti ti-trash {0}-clear"></i><span>{1}</span></div><div class="{0}-container"><div class="{0}-items"></div></div>'.format(cls, config.title));
				scrollbar = SCROLLBAR(self.find(cls2 + '-container'), { visibleY: config.visibleY, parent: self.element });
				container = self.find('.ui-scrollbar-body');
				self.scrolltop = scrollbar.scrollTop;
				self.scrollbottom = scrollbar.scrollBottom;
				elclear = self.find(cls2 + '-clear');
				elclear.on('click', self.clear);
				self.event('click', cls2 + '-item', function() {
					var el = $(this);
					config.click && self.EXEC(config.click, items[+el.attrd('index')], el);
					if (config.autoremove) {
						el.remove();
						elclear.tclass('hidden', !container.find(cls2 + '-item').length);
					}
				});

				self.event('click', cls2 + '-close', function() {
					self.set(!self.get());
				});

				self.on('resize2', self.resize);
				self.resize();
			};

			self.resizeforce = function() {
				var css = {};
				css.height = WH;
				css.top = config.top;
				self.css(css);
				delete css.top;
				var content = self.find(cls2 + '-container');
				css.height = css.height - content.offset().top;
				content.css(css);
				scrollbar.resize();
			};

			self.resize = function() {
				setTimeout2(self.ID, self.resizeforce, 300);
			};

			self.render = function(value) {

				if (!value)
					value = EMPTYARRAY;

				items = value;
				var builder = [];
				for (var i = 0; i < value.length; i++) {
					var item = value[i];
					item.index = i;
					builder.push(self.template(item));
				}

				container.html(builder.join(''));
				elclear.tclass('hidden', !builder.length);
				builder.length && self.resize();
			};

			self.clear = function() {
				container.empty();
				elclear.aclass('hidden');
			};

			self.setter = function(value) {
				if (value) {
					self.EXEC(config.exec, function(value) {
						self.rclass('hidden');
						self.render(value);
					});
				} else
					self.aclass('hidden');
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="notificationspanel" path="shownotifications" config="exec:loadnotifications;click:clicknotificiation">
		<script type="text/html">
			<h2>{{ name }}</h2>
			<p>{{ body }}</p>
			<hr />
		</script>
	</ui-component>

	<script>

		var shownotifications = false;

		// Shows notifications panel after 2 seconds
		SET('shownotifications', true, 2000);

		// The method will be executed automatically before the notifications panel will be visible
		function loadnotifications(render) {
			var arr = [];
			arr.push({ name: 'Name of notifications 1', body: 'Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos, architecto!' });
			arr.push({ name: 'Name of notifications 2', body: 'Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos, architecto!' });
			arr.push({ name: 'Name of notifications 3', body: 'Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quos, architecto!' });

			// IMPORTANT:
			// This renders notifications onto notifications panel
			render(arr);
		}

		function clicknotificiation(obj) {
			console.log('CLICK', obj);
		}

	</script>

</body>
</html>
