<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-backtotop { visibility: hidden; position: fixed; right: 25px; bottom: 20px; transform: translate3d(55px, 0, 0); transition: transform 0.65s, visibility 0.65s cubic-bezier(0, 0, 0, 1); z-index: 50; cursor: pointer; }
		.ui-backtotop.active { visibility: visible; transform: translate3d(0,0,0); transition: transform 0.65s; }
		.ui-backtotop span { color: #bbb; font-size: 30px; transition: color 0.8s; }
		.ui-backtotop span:hover { color: #888; transition: color 0.8s; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('backtotop', 'icon:ti ti-arrow-circle-up', function(self, config, cls) {

			var visible = false;
			var timeout = null;
			var $W;

			self.singleton();

			self.onscroll = function() {
				timeout = null;
				var position = $W.scrollTop();
				if (position > WH) {
					if (visible)
						return;
					visible = true;
				} else {
					if (!visible)
						return;
					visible = false;
				}
				self.tclass('active', visible);
			};

			self.make = function() {

				self.aclass(cls);
				self.html('<span><i class="{0}"></i></span>'.format(self.icon(config.icon)));

				self.event('click', function() {
					document.body.scrollTop = 0;
					document.documentElement.scrollTop = 0;
				});

				$W = $(W);
				$W.on('scroll', function() {
					timeout && clearTimeout(timeout);
					timeout = setTimeout(self.onscroll, 200);
				});
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="backtotop"></ui-component>

	<div style="height:1500px"></div>

</body>
</html>
