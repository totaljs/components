<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-extend {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('extend', function(self, config, cls) {
			self.readonly();
			self.make = function() {
				self.aclass(cls);
				var opt = {};
				opt.name = config.name;
				opt.type = config.type;
				opt.element = self.element;
				opt.dom = self.dom;
				opt.component = self;
				opt.path = self.path;
				opt.name && EMIT('extend_' + opt.name, opt);
				EMIT('extend', opt);
			};
		});

	</script>

	<!-- Example -->
	<div style="width:300px">
		<ui-plugin path="form">
			<ui-component name="extend" config="name:test"></ui-component>
		</ui-plugin>
	</div>

	<script>
		ON('extend_test', function(opt) {
			// Here you can use IMPORT() method
			opt.element.append(`
				<div class="m">Extended:</div>
				<ui-component name="input" path="?.name" config="required:1">Label</ui-component>
			`);
		});
	</script>

</body>
</html>
