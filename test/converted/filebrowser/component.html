<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-filebrowser {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('filebrowser', function(self) {

			var input;

			self.singleton();
			self.readonly();

			self.open = self.show = self.browse = function(opt, callback) {

				// opt.callback {Function(files, event)}
				// opt.multiple {Boolean}
				// opt.accept {String}

				if (!opt.callback && callback)
					opt.callback = callback;

				self.opt = opt;
				self.find('input').attr('accept', opt.accept || '*/*').prop('multiple', !!opt.multiple);
				input[0].value = '';
				input.click();
			};

			self.make = function() {
				self.aclass('hidden');
				self.append('<input type="file" multiple />');
				self.event('change', 'input', function(e) {
					self.opt.callback(e.target.files, e);
					this.value = '';
				});
				input = self.find('input');
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="filebrowser"></ui-component>
	<a href="javascript:fopen()">OPEN FILE</a>

	<script>
		function fopen() {
			var opt = {};
			opt.multiple = true;
			// opt.accept = 'image/*';
			opt.callback = function(files, e) {
				console.log(files, e);
			};
			SETTER('filebrowser/show', opt);
		}
	</script>

</body>
</html>
