<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-contentslider { overflow: hidden; width: 100%; position: relative; display: block; }
		.ui-contentslider-item { position: absolute; opacity: 0; transition: all 0.5s; transform: scale(0.8) rotateX(90deg); width: 100%; }
		.ui-contentslider-item-visible { opacity: 1 !important; transform: scale(1) rotateX(0deg) !important; }
		.ui-contentslider-pagination { text-align: center; }
		.ui-contentslider-pagination .ti { margin: 2px 3px; color: #A0A0A0; cursor: pointer; font-size: 9px; }
		.ui-contentslider-pagination-selected { color: #000 !important; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('contentslider', 'interval:3000;selector:a', function(self, config, cls) {

			var cssv = cls + '-item-visible';
			var cssi = cls + '-item';
			var cssp = cls + '-pagination';
			var css = { 'min-height': 0 };
			var container;
			var length = 0;
			var cacheid;
			var interval;

			self.readonly();
			self.blind();

			self.make = function() {

				self.aclass(cls);
				self.element.wrapInner('<div class="ui-contentslider-items" />');
				self.find(config.selector).wrap('<div class="{0}" />'.format(cssi));
				self.append('<div class="{0}" />'.format(cssp));
				self.refresh();
				container = self.find('.ui-contentslider-items');

				var id = config.cache;
				var indexer = 0;

				if (id) {
					cacheid = 'contentslider' + id;
					indexer = CACHE(cacheid) || 0;
				}

				self.rclass('hidden');
				self.show(indexer++);

				self.event('click', '.ti', function() {
					clearInterval(interval);
					self.show($(this).attrd('index').parseInt());
				});

				interval = setInterval(function() {
					if (!document.hasFocus())
						return;
					self.show(indexer++);
					if (indexer > length)
						indexer = 0;
				}, config.interval);
			};

			self.refresh = function(noredraw) {
				length = self.find('.' + cssi).length;
				var builder = '';
				for (var i = 0; i < length; i++)
					builder += '<i class="ti ti-circle" data-index="{0}"></i>'.format(i);
				noredraw !== true && self.find('.' + cssp).empty().html(builder);
			};

			self.show = function(index) {

				if (index >= length)
					index = 0;
				else if (index < 0)
					index = 0;

				var current = self.find('.' + cssv);
				var next = self.find('.' + cssi).eq(index);
				current.rclass(cssv);
				next.aclass(cssv);
				css['min-height'] = next.height();
				container.css(css);
				self.find('.' + cssp + '-selected').rclass(cssp + '-selected');
				self.find('.' + cssp).find('i').eq(index).aclass(cssp + '-selected');
				cacheid && CACHE(cacheid, index, '1 day');
			};
		});

	</script>

	<!-- Example -->
	<div class="row">
		<div class="col-md-4 col-md-offset-4">
			<ui-component name="contentslider" config="cache:id-for-caching-latest-state" class="hidden">
				<a href="javascript:void(0)" style="background-color:red;height:50px;display:block;color:white">A</a>
				<a href="javascript:void(0)" style="background-color:blue;height:50px;display:block;color:white">B</a>
				<a href="javascript:void(0)" style="background-color:green;height:50px;display:block;color:white">C</a>
				<a href="javascript:void(0)" style="background-color:gray;height:50px;display:block;color:white">D</a>
				<a href="javascript:void(0)" style="background-color:black;height:50px;display:block;color:white">E</a>
			</ui-component>
		</div>
	</div>

</body>
</html>
