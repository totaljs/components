<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-banners { position: relative; }
		.ui-banners > div > div { position: absolute; left: 0; top: 0; opacity: 1; transition: all 0.3s; }
		.ui-banners > img { visibility: hidden; }
		.ui-banners ul { margin: 15px 0; padding: 0; list-style-type: none; text-align: center; display: block; font-size: 16px; color: #A0A0A0; }
		.ui-banners li { position: relative; display: inline-block; margin: 5px; cursor: pointer; }
		.ui-banners li.selected { color: var(--color); }
		.ui-banners-hidden { opacity: 0 !important; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('banners', 'class:ui-banners-hidden;interval:3000;icon:ti ti-circle', function(self, config, cls) {

			var divs, nav, interval, indexer = 0;

			self.readonly();

			self.destroy = function() {
				interval && clearInterval(interval);
				interval = null;
			};

			self.make = function() {

				self.element.wrapInner('<div />');
				self.aclass(cls);

				interval = setInterval(self.show, config.interval);

				divs = self.find('div > div');
				divs.aclass(config.class);
				divs.eq(0).rclass(config.class);

				var builder = [];
				for (var i = 0, length = divs.length; i < length; i++)
					builder.push('<li><i class="' + config.icon + '"></i></li>');

				self.append('<img src="{0}" class="img-responsive" alt="" /><ul>{1}</ul>'.format(config.empty, builder.join('')));
				nav = self.find('li');
				self.button(indexer);

				self.event('click', 'li', function() {
					self.show($(this).index());
				});

				self.rclass('invisible hidden', 500);
			};

			self.show = function(index) {
				if (index != null && interval)
					clearInterval(interval);
				else if (index == null) {
					indexer++;
					if (indexer >= divs.length)
						indexer = 0;
					index = indexer;
				}

				divs.filter(':visible').aclass(config.class);
				divs.eq(index).rclass(config.class);
				self.button(index);
			};

			self.button = function(index) {
				nav.filter('.selected').rclass('selected');
				nav.eq(index).aclass('selected');
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="banners" config="interval:3000;empty:/static/banners-empty.gif" class="invisible">
		<div><img src="/static/banners-1.jpg" alt="A" class="img-responsive" border="0" /></div>
		<div class="ui-banners-hidden"><img src="/static/banners-2.jpg" alt="B" class="img-responsive" border="0" /></div>
		<div class="ui-banners-hidden"><img src="/static/banners-3.jpg" alt="C" class="img-responsive" border="0" /></div>
		<div class="ui-banners-hidden"><img src="/static/banners-4.jpg" alt="D" class="img-responsive" border="0" /></div>
		<div class="ui-banners-hidden"><img src="/static/banners-5.jpg" alt="E" class="img-responsive" border="0" /></div>
	</ui-component>

</body>
</html>
