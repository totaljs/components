<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-recaptcha {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('recaptcha', function(self, config) {

			self.getter = null;

			self.validate = function(value) {
				return config.disabled || !config.required ? true : (value && value.length > 300);
			};

			self.make = function() {
				WAIT(function() {
					return window.grecaptcha && window.grecaptcha.render;
				}, function(err, again) {
					if (err)
						return again(100);
					grecaptcha.render(self.element[0], { sitekey: config.key, theme: config.theme || 'light', callback: function(response) {
						self.set(response);
						self.change(true);
					}});
				});
			};

		}, ['https://www.google.com/recaptcha/api.js']);

	</script>

	<!-- Example -->
	<ui-component name="recaptcha" path="form.recaptcha" config="key:6Ldreg4UAAAAABGC2PK9RmKupaPCiCmbifZrUXc6"></ui-component>

	<script>
		var form = {};
	</script>

</body>
</html>
