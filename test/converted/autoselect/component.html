<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-autoselect {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('autoselect', 'selector:.autoselect a;class:selected', function(self, config) {

			self.singleton();
			self.readonly();

			self.refresh = function() {
				var url = NAV.url || location.pathname;
				$(config.selector).each(function() {
					var el = $(this);
					var href = el.attr('href');
					el.tclass(config.class, url === href || (href !== '/' && url.includes(href)));
				});
			};

			self.make = self.refresh;
			self.setter = self.refresh;

		});

	</script>

	<!-- Example -->
	<style>
		.links a { display: block; border: 0; text-align: left; color: gray; font-size: 14px; border-radius: 2px; padding: 2px 10px; margin-bottom: 1px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; position: relative; }
		.links a i { width: 14px; text-align: center; font-size: 12px; margin-right: 7px; color: #4285F4; }
		.links .selected { font-weight: bold; color: white !important; background-color: #4285F4; }
		.links .selected i { color: white !important }
		.links a:hover { text-decoration: none; color: black; }
	</style>

	<ui-component name="autoselect" path="NAV.url"></ui-component>

	<div class="links autoselect">
		<div class="m">Menu 1</div>
		<a href="/"><i class="ti ti-users"></i>Users</a>
		<a href="/products/"><i class="ti ti-box"></i>Products</a>
		<a href="/settings/"><i class="ti ti-cog"></i>Settings</a>
	</div>
	<br />
	<div class="links autoselect">
		<div class="m">Menu 2</div>
		<a href="/"><i class="ti ti-users"></i>Users</a>
		<a href="/products/"><i class="ti ti-box"></i>Products</a>
		<a href="/settings/"><i class="ti ti-cog"></i>Settings</a>
	</div>

	<script>

		var arr = ['/', '/products/', '/settings/'];

		setInterval(function() {
			REDIRECT(arr[(Math.random() * arr.length) >> 0]);
		}, 1500);

	</script>

</body>
</html>
