<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-checkboxlistexpert { color: #000; font-size: 14px; vertical-align: baseline; position: relative; }
		.ui-checkboxlistexpert-label { margin-bottom: 5px; font-size: 12px; text-align: left; }
		.ui-checkboxlistexpert-label-required:before { color: red; content: '*'; margin-right: 5px; }
		.ui-large .ui-checkboxlistexpert-label { font-size: 14px; }
		.ui-checkboxlistexpert-container { }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('checkboxlistexpert', function(self, config, cls) {

			var cls2 = '.' + cls;
			var recompile = false;
			var datasource;
			var reg = /\$(index|path)/g;

			self.nocompile();

			self.configure = function(key, value, init) {

				if (init)
					return;

				switch (key) {
					case 'disabled':
						self.tclass('ui-disabled', value);
						break;
					case 'required':
						self.find(cls2 + '-label').tclass(cls + '-label-required', value);
						break;
					case 'type':
						self.type = config.type;
						break;
					case 'label':
						self.find(cls2 + '-label').html(value);
						break;
					case 'datasource':
						if (value.indexOf(',') === -1)
							self.datasource(value, self.bind);
						else
							self.bind('', self.parsesource(value));
						break;
				}
			};

			self.make = function() {

				var el = self.find('script');

				if (!el.length && !config.selector)
					return;

				var html;
				if (config.selector) {
					var customselector = $(document).find(config.selector);
					html = customselector.html();
					self.html(html);
				} else {
					html = el.html();
					el.remove();
				}

				self.template = Tangular.compile(html.replace('>', ' data-index="$index" data-disabled="{{ {0} }}">'.format(config.disabledkey || 'disabled')));
				recompile = html.COMPILABLE();

				config.label && self.html('<div class="' + cls + '-label{1}">{0}</div>'.format(config.label, config.required ? (' ' + cls + '-label-required') : ''));
				config.datasource && self.reconfigure('datasource:' + config.datasource);
				config.type && (self.type = config.type);
				config.disabled && self.aclass('ui-disabled');

				self.event('click', '[data-index]', function() {
					var el = $(this);

					if (config.disabled || +el.attrd('disabled'))
						return;

					var key = config.value || 'id';
					var index = +el.attrd('index');
					var data = self.get() || [];
					var val = datasource[index] ? datasource[index][key] : null;
					var valindex = data.indexOf(val);

					if (valindex === -1) {
						data.push(val);
						self.set(data);
					} else {
						data.splice(valindex, 1);
						self.set(data);
					}

					self.change(true);
				});
			};

			self.validate = function(value) {
				return config.disabled || !config.required ? true : !!value;
			};

			self.setter = function(value) {

				var key = config.value || 'id';

				if (value && !(value instanceof Array)) {
					self.set([value]);
					return;
				}

				self.find('[data-index]').each(function() {
					var el = $(this);
					var index = +el.attrd('index');
					var selected = false;
					if (value && value.length) {
						var val = datasource[index][key];
						selected = value.indexOf(val) !== -1;
					}
					el.tclass('selected', selected);
				});
			};

			self.bind = function(path, arr) {

				if (M.is20)
					arr = path;

				if (!arr)
					arr = EMPTYARRAY;

				var builder = [];
				datasource = [];

				var disabledkey = config.disabledkey || 'disabled';

				for (var i = 0; i < arr.length; i++) {
					var item = arr[i];
					item[disabledkey] = +item[disabledkey] || 0;
					datasource.push(item);
					builder.push(self.template(item).replace(reg, text => text.substring(0, 2) === '$i' ? i.toString() : self.path.toString() + '[' + i + ']'));
				}

				self.find(cls2 + '-container').remove();
				self.append('<div class="{0}-container{1}">{2}</div>'.format(cls, config.class ? ' ' + config.class : '', builder.join('')));
				self.refresh();
				recompile && self.compile && self.compile();
			};
		});

	</script>

	<!-- Example -->
	<style>
		.my-button { display: inline-block; padding: 20px 40px; margin-right: 10px; margin-bottom: 10px; border: 1px solid gray; cursor: pointer; border-radius: 2px; position: relative; user-select: none; }
		.my-button .checkbox { position: absolute; top: 10px; left: 10px; }
		.my-button.selected .checkbox i:before { content: "\f14a"; font-weight: 900; }
		.my-button:hover { border-color: #4285F4; }
		.my-button.selected { color: white; background: #4285F4; border-color: rgba(0, 0, 0, 0.2); }
		.my-button[data-disabled="1"] { background-color: #dcdcdc; color: gray; border-color: #dcdcdc; cursor: not-allowed; }
		.ui-disabled .my-button .checkbox { color: #c3c3c3; }
		.ui-disabled .my-button { background-color: #dcdcdc; color: gray; border-color: #dcdcdc; cursor: not-allowed; }
		.ui-disabled .my-button:hover { background-color: #dcdcdc; color: gray; border-color: #dcdcdc; }
		.ui-disabled .my-button.selected { border-color: gray; background: #efefef; color: #5a5a5a; }

		.ui-dark .my-button { border-color: 1px solid #404040; color: #adadad; }
		.ui-dark .my-button.selected { color: white; }
		.ui-dark .my-button[data-disabled="1"] { background-color: #525252; color: gray; border-color: #525252; }
		.ui-dark .ui-disabled .my-button { background-color: #525252; color: gray; border-color: #525252; }
		.ui-dark .ui-disabled .my-button:hover { background-color: #525252; color: gray; border-color: #525252; }
		.ui-dark .ui-disabled .my-button.selected { border-color: rgba(0, 0, 0, 0.2); background: #969696; color: #ffffff; }
		.ui-large .my-button { font-size: 16px; }
	</style>

	<ui-component name="checkboxlistexpert" path="model.framework" config="datasource:list;disabled:1;required:true;label:Your favorite frameworks;type:number" default="2">
		<script type="text/html">
			<div class="my-button">
				<div>{{ name }}</div>
			</div>
		</script>
	</ui-component>
	<hr>
	<ui-component name="checkboxlistexpert" path="model.framework2" config="selector:#mybutton;datasource:list;required:true;label:Your favorite frameworks;type:number" default="0"></ui-component>
	<script type="text/html" id="mybutton">
		<div class="my-button">
			<div class="checkbox"><i class="ti ti-square"></i></div>
			<div>{{ name }}</div>
		</div>
	</script>

	<script>
		var list = [{ name: 'Total.js', id: 1 }, { name: 'express', id: 2 }, { name: 'Hapi', id: 3, disabled: false }, { name: 'Koa', id: 4, disabled: true }, { name: 'Sails', id: 5 }, { name: 'Meteor', id: 6 }, { name: 'Adonis', id: 7 }, { name: 'Nest', id: 8 }];
	</script>

</body>
</html>
