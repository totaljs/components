<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-navigation-item > div { display: none; }
		.ui-navigation-item span { display: block; width: 96%; border: 0; text-align: left; padding: 2px 5px; background-color: transparent; color: #000; outline: 0; text-decoration: none; margin: 0 auto 2px; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
		.ui-navigation-item span .ti { width: 20px; text-align: center; margin-right: 5px; }
		.ui-navigation-item span .ti:before { content: '\e995'; }
		.ui-navigation-item span b { float: right; font-size: 10px; margin: 2px 0 0; display: none; }
		.ui-navigation-item span:hover b { display: block; }
		.ui-navigation-item .ui-navigation-children .ti:before { content: '\eab7'; font-weight: 900; }
		.ui-navigation-selected { background-color: #F0F0F0; }
		.ui-navigation-show > div { display: block; }
		.ui-navigation-show > span { font-weight: bold; }
		.ui-navigation-show > span .ti:before { content: '\eab8' !important; }
		.ui-navigation-level-1 .ui-navigation-link { padding-left: 20px; }
		.ui-navigation-level-2 .ui-navigation-link { padding-left: 40px; }
		.ui-navigation-level-3 .ui-navigation-link { padding-left: 60px; }
		.ui-navigation-level-4 .ui-navigation-link { padding-left: 80px; }
		.ui-navigation-level-5 .ui-navigation-link { padding-left: 100px; }

		.ui-dark .ui-navigation-item span { color: #A0A0A0; }
		.ui-dark .ui-navigation-selected { background-color: #353535; }
		.ui-dark .ui-navigation-selected span { color: #FFF; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('navigation', 'pk:id', function(self, config, cls) {

			var cls2 = '.' + cls;
			var current, items, open = {};

			self.readonly();

			self.make = function() {
				self.aclass(cls);

				self.event('click', 'b', function(e) {
					var el = $(this);
					config.options && self.EXEC(config.options, items[el.closest(cls2 + '-item').attrd('id')], el);
					e.preventDefault();
					e.stopPropagation();
				});

				self.event('click', cls2 + '-link', function() {
					var el = $(this);
					var parent = el.parent();
					var index = parent.attrd('id');

					if (el.hclass(cls + '-children')) {
						if (parent.hclass(cls + '-selected')) {
							parent.tclass(cls + '-show');
							current && current.rclass(cls + '-selected');
							current = parent;
						} else if (!parent.hclass(cls + '-show'))
							parent.aclass(cls + '-show');

						if (parent.hclass(cls + '-show')) {
							parent.aclass(cls + '-selected');
							current && current.rclass(cls + '-selected');
							current = parent;
							self.EXEC(config.exec, items[index]);
							if (config.pk)
								open.selected = items[index][config.pk];
						}

					} else {
						current && current.rclass(cls + '-selected');
						current = parent;
						parent.aclass(cls + '-selected');
						self.EXEC(config.exec, items[index]);
						if (config.pk)
							open.selected = items[index][config.pk];
					}

					if (config.pk)
						open[items[index][config.pk]] = parent.hclass(cls + '-selected');
				});
			};

			self.setter = function(value) {

				if (!value || !value.length)
					return;

				var indexer = 0;
				var selectedindex = -1;

				items = {};

				var render = function(children, level) {

					var builder = [];

					for (var i = 0; i < children.length; i++) {

						indexer++;

						var item = children[i];
						var childs = item.children && item.children.length;

						if (config.pk) {
							if (open.selected && item[config.pk] === open.selected)
								selectedindex = indexer;
							if (item.collapsed && open[item[config.pk]])
								item.collapsed = false;
						}

						var o = '<div class="ui-navigation-item ui-navigation-level-{0}{1}" title="{2}" data-id="{3}">'.format(level, childs && !item.collapsed ? ' ' + cls + '-show' : '', item.title, indexer);
						o += '<span class="ui-navigation-link{1}">{2}<i class="ti"></i>{0}</span>'.format(item.name, childs ? ' ui-navigation-children' : '', item.options ? '<b><i class="ti ti-ellipsis-h"></i></b>' : '');

						items[indexer] = item;

						if (childs) {
							item.children.quicksort('treeorder');
							o += '<div class="' + cls + '-level">';
							o += render(item.children, level + 1);
							o += '</div>';
						}

						o += '</div>';
						builder.push(o);
					}

					return builder.join('');
				};

				current = null;
				self.html(render(value, 0));

				if (selectedindex !== -1)
					self.find(cls2 + '-item[data-id="{0}"]'.format(selectedindex)).aclass(cls + '-selected');
				else if (config.autoselect)
					self.find(cls2 + '-item:first-child').eq(0).find(cls2 + '-link').trigger('click');
			};
		});

	</script>

	<!-- Example -->
	<div class="row">
		<div class="col-xs-6">
			<div style="border: 1px solid #E0E0E0">
				<ui-component name="navigation" path="items" config="exec:navclick"></ui-component>
			</div>
		</div>
	</div>

	<script>
		var items = [];
		items.push({ name: 'Home' });
		items.push({ name: 'Admin', collapsed: true, children: [{ name: 'Users' }, { name: 'Products' }] });
		items.push({ name: 'Settings' });

		function navclick(item) {
			console.log(item);
		}
	</script>

</body>
</html>
