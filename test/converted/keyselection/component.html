<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-keyselection {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('keyselection', 'selector:input;class:selected;autoselect:true;selectoritem:.item;autoscroll:true;delay:100', function(self, config) {

			var TYPE = { '38': 'up', '40': 'down', '13': 'enter' };
			var selected = { index: -1, element: null };

			var onkeydown = function(e) {
				var c = e.keyCode;
				switch (c) {
					case 13: // enter
					case 38: // up
					case 40: // down
						self.keydown(TYPE[c + ''], e);
						return;
				}

				if (c > 47 || c === 8) {
					selected.index = config.autoselect ? 0 : -1;
					if (selected.index !== -1)
						self.select();
				}
			};

			self.readonly();

			self.assign = function() {
				if (!self.removed) {
					var target = self.find(config.selector);
					if (target.length)
						target.on('keydown', onkeydown);
					else
						setTimeout(self.assign, 500);
				}
			};

			self.select = function() {

				if (selected.element) {
					selected.element.parentNode && selected.element.classList.remove(config.class);
					selected.element = null;
				}

				var arr = self.find(config.selectoritem);
				var max = arr.length - 1;

				if (selected.index < 0)
					selected.index = 0;
				else if (selected.index > max)
					selected.index = max;

				if (arr[selected.index]) {
					arr[selected.index].classList.add(config.class);
					selected.element = arr[selected.index];
					if (config.autoscroll) {
						var el = arr[selected.index - 1];
						el && el.scrollIntoView(true);
					}
				} else
					selected.element = null;
			};

			self.keydown = function(key, e) {
				if (key === 'up') {
					e.preventDefault();
					selected.index--;
					self.select();
				} else if (key === 'down') {
					e.preventDefault();
					selected.index++;
					self.select();
				} else if (key === 'enter' && selected.element) {
					var el = $(selected.element);
					if (config.exec)
						self.EXEC(config.exec, el);
					else
						el.trigger('click');
				}
			};

			self.autoselect = function() {
				setTimeout2(self.ID, () => self.refresh(), config.delay);
			};

			self.make = function() {
				self.assign();
				self.autoselect();
				config.datasource && self.datasource(config.datasource, self.autoselect);
			};

			self.setter = function() {
				selected.index = config.autoselect ? 0 : -1;
				if (selected.index === -1) {
					if (selected.element)
						selected.element.classList.remove(config.class);
				} else
					self.select();
			};

		});

	</script>

	<!-- Example -->
	<style>
		.selected { background: #F0F0F0; }
		.item { line-height: 24px; padding: 0 10px; border-top: 1px solid #E0E0E0; font-size: 12px; }
	</style>

	<ui-component name="keyselection" config="exec:confirmselection">
		<div class="m"><input type="text" placeholder="Press UP or DOWN key" style="width:300px" /></div>
		<div class="items">
			<div class="item" data-id="1">1</div>
			<div class="item" data-id="1">2</div>
			<div class="item" data-id="1">3</div>
			<div class="item" data-id="1">4</div>
			<div class="item" data-id="1">5</div>
		</div>
	</ui-component>

	<script>

		function confirmselection(el) {
			console.log('selected', el);
		}

	</script>

</body>
</html>
