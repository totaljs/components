<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-checkbox { position: relative; font-size: 13px; margin-bottom: 5px; }
		.ui-checkbox * { height: 25px; cursor: pointer; }
		.ui-checkbox span { width: 20px; height: 20px; line-height: 19px; font-size: 11px; margin: 0 7px 0 0; text-align: center; float: left; border: 1px solid #D0D0D0; border-radius: var(--radius); background: #FFF; }
		.ui-checkbox span i { display: none; }
		.ui-checkbox.ui-checkbox-checked span i { display: inline-block; }
		.ui-checkbox label { line-height: 19px; }

		.ui-checkbox.ui-disabled * { cursor: not-allowed; }
		.ui-checkbox.ui-disabled { color: #A0A0A0; }
		.ui-checkbox.ui-disabled span { background-color: #F0F0F0; color: #B0B0B0; border-color: #E0E0E0; }

		.ui-dark .ui-checkbox span { border-color: #404040; background: #252525; }
		.ui-dark .ui-checkbox.ui-disabled span { background-color: #282828; color: #999; border-color: #303003; }
		.ui-dark .ui-checkbox.ui-disabled { color: #666; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('checkbox', function(self, config, cls) {

			self.nocompile && self.nocompile();

			self.validate = function(value) {
				return (config.disabled || !config.required) ? true : (value === true || value === 'true' || value === 'on');
			};

			self.configure = function(key, value, init) {
				if (init)
					return;
				switch (key) {
					case 'label':
						self.find('span').html(value);
						break;
					case 'required':
						self.find('span').tclass(cls + '-label-required', value);
						break;
					case 'disabled':
						self.tclass('ui-disabled', value);
						break;
					case 'checkicon':
						self.find('i').rclass2('ti-').aclass('ti-' + value);
						break;
				}
			};

			self.make = function() {
				self.aclass(cls);
				self.html('<span><i class="ti ti-{2}"></i></span><label{1}>{0}</label>'.format(config.label || self.html(), config.required ? (' class="' + cls + '-label-required"') : '', config.checkicon || 'check'));
				config.disabled && self.aclass('ui-disabled');
				self.event('click', function() {
					if (!config.disabled) {
						self.dirty(false);
						self.getter(!self.get());
					}
				});
			};

			self.setter = function(value) {
				var is = config.reverse ? !value : !!value;
				self.tclass(cls + '-checked', is);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="checkbox" path="form.newsletter">I want to receive a newsletter</ui-component>
	<ui-component name="checkbox" path="form.terms">I agree with terms and conditions</ui-component>

	<script>
		var form = {};
		form.terms = false;
		form.newsletter = true;
	</script>

</body>
</html>
