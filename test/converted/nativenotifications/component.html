<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-nativenotifications {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('nativenotifications', 'timeout:8000', function(self, config) {

			var autoclosing;
			var system = false;
			var N = W.Notification;

			self.singleton();
			self.readonly();
			self.items = [];

			self.make = function() {
				if (!N)
					return;
				system = N.permission === 'granted';
				!system && N.requestPermission(function(permission) {
					system = permission === 'granted';
				});
			};

			self.show = self.append = function(title, message, callback, img) {

				if (!system)
					return;

				var obj = { id: Math.floor(Math.random() * 100000), date: new Date(), callback: callback };
				var options = {};

				options.body = message.replace(/(<([^>]+)>)/ig, '');
				self.items.push(obj);

				self.autoclose();

				if (img === undefined)
					options.icon = config.icon || '/icon.png';
				else if (img != null)
					options.icon = img;

				obj.system = new N(title, options);
				obj.system.onclick = function() {

					W.focus();
					self.items = self.items.remove('id', obj.id);

					if (obj.callback) {
						obj.callback();
						obj.callback = null;
					}

					obj.system.close();
					obj.system.onclick = null;
					obj.system = null;
				};
			};

			self.autoclose = function() {

				if (autoclosing)
					return self;

				autoclosing = setTimeout(function() {
					clearTimeout(autoclosing);
					autoclosing = null;
					var obj = self.items.shift();
					if (obj) {
						obj.system.onclick = null;
						obj.system.close();
						obj.system = null;
					}
					self.items.length && self.autoclose();
				}, config.timeout);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="nativenotifications" path="allowNotifications"></ui-component>

	<script>
		var allowNotifications = true;

		setTimeout(function() {
			SETTER('nativenotifications/append', 'Hello!', 'jComponent is a great solution for everyone.', null, 'https://messenger.totaljs.com/icon.png');
		}, 3000);
	</script>

</body>
</html>
