<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-sounds {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('sounds', 'url:https://cdn.componentator.com/sounds/;volume:50', function(self, config) {

			var volume = 0;
			var can = false;
			var muted = false;

			self.items = [];
			self.readonly();
			self.singleton();
			self.nocompile && self.nocompile();

			self.make = function() {
				var audio = document.createElement('audio');
				if (audio.canPlayType && audio.canPlayType('audio/mpeg').replace(/no/, ''))
					can = true;
			};

			self.setter = function(value) {
				volume = value || 0;
			};

			self.play = function(type) {
				self.playurl(config.url + type + '.mp3');
			};

			self.success = function() {
				self.play('success');
			};

			self.error = self.fail = function() {
				self.play('fail');
			};

			self.message = function() {
				self.play('message');
			};

			self.notify = self.notifications = function() {
				self.play('notifications');
			};

			self.badge = self.badges = function() {
				self.play('badges');
			};

			self.confirm = function() {
				self.play('confirm');
			};

			self.beep = function() {
				self.play('beep');
			};

			self.drum = function() {
				self.play('drum');
			};

			self.warning = function() {
				self.play('warning');
			};

			self.alert = function() {
				self.play('alert');
			};

			self.playurl = function(url) {

				if (!can || !volume || muted)
					return;

				var audio = new W.Audio();

				audio.src = url;
				audio.volume = volume;
				audio.play();

				audio.onended = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				audio.onerror = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				audio.onabort = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				self.items.push(audio);
				return self;
			};

			self.cleaner = function() {
				var index = 0;
				while (true) {
					var item = self.items[index++];
					if (item === undefined)
						return self;
					if (!item.$destroy)
						continue;
					item.pause();
					item.onended = null;
					item.onerror = null;
					item.onsuspend = null;
					item.onabort = null;
					item = null;
					index--;
					self.items.splice(index, 1);
				}
			};

			self.stop = function(url) {

				if (!url) {
					for (var i = 0; i < self.items.length; i++)
						self.items[i].$destroy = true;
					return self.cleaner();
				}

				var index = self.items.findIndex('src', url);
				if (index === -1)
					return self;

				self.items[index].$destroy = true;
				return self.cleaner();
			};

			self.setter = function(value) {

				if (typeof(value) === 'boolean') {
					volume = config.volume / 100;
					muted = value === false;
					return;
				}

				if (value == null)
					value = config.volume / 100;
				else
					value = (value / 100);

				if (value > 1)
					value = 1;
				else if (value < 0)
					value = 0;

				volume = value ? +value : 0;
				for (var i = 0, length = self.items.length; i < length; i++) {
					var a = self.items[i];
					if (!a.$destroy)
						a.volume = value;
				}
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="sounds" path="volume"></ui-component>

	<script>
		var volume = 80;

		setTimeout(function() {
			SETTER('sounds/play', 'beep');
		}, 1000);

		setTimeout(function() {
			SETTER('sounds/play', 'drum');
		}, 3000);

		setTimeout(function() {
			SETTER('sounds/play', 'fail');
		}, 7000);

	</script>

</body>
</html>
