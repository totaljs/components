<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-audio {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('audio', function(self) {

			var can = false;
			var volume = 0.5;

			self.items = [];
			self.readonly();
			self.singleton();

			self.make = function() {
				var audio = document.createElement('audio');
				if (audio.canPlayType && audio.canPlayType('audio/mpeg').replace(/no/, ''))
					can = true;
			};

			self.play = function(url) {

				if (!can)
					return;

				var audio = new window.Audio();

				audio.src = url;
				audio.volume = volume;
				audio.play();

				audio.onended = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				audio.onerror = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				audio.onabort = function() {
					audio.$destroy = true;
					self.cleaner();
				};

				self.items.push(audio);
				return self;
			};

			self.cleaner = function() {
				var index = 0;
				while (true) {
					var item = self.items[index++];
					if (item === undefined)
						return self;
					if (!item.$destroy)
						continue;
					item.pause();
					item.onended = null;
					item.onerror = null;
					item.onsuspend = null;
					item.onabort = null;
					item = null;
					index--;
					self.items.splice(index, 1);
				}
			};

			self.stop = function(url) {

				if (!url) {
					self.items.forEach(function(item) {
						item.$destroy = true;
					});
					return self.cleaner();
				}

				var index = self.items.findIndex('src', url);
				if (index === -1)
					return self;
				self.items[index].$destroy = true;
				return self.cleaner();
			};

			self.setter = function(value) {

				if (value === undefined)
					value = 0.5;
				else
					value = (value / 100);

				if (value > 1)
					value = 1;
				else if (value < 0)
					value = 0;

				volume = value ? +value : 0;
				for (var i = 0, length = self.items.length; i < length; i++) {
					var a = self.items[i];
					if (!a.$destroy)
						a.volume = value;
				}
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="audio" path="volume"></ui-component>

	<script>
		var volume = 50; // 50%
		if (jComponent.is20)
			SETTER('audio/play @important', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
		else
			SETTER(true, 'audio/play', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
	</script>

</body>
</html>
