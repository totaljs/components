<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-colorpickerbutton.ui-disabled { cursor: not-allowed !important; color: #A0A0A0 !important; }
		.ui-colorpickerbutton { border: 1px solid #E0E0E0; height: 32px; border-radius: var(--radius); cursor: pointer; background-color: #FFF; color: #000; }
		.ui-colorpickerbutton:hover { border-color: #D0D0D0; }
		.ui-colorpickerbutton-color { height: 24px; margin: 3px 35px 0 3px; border-radius: 2px 0 0 2px; }
		.ui-colorpickerbutton-arrow { width: 32px; float: right; display: block; text-align: center; line-height: 31px; height: 31px; border-left: 1px solid #E0E0E0; }

		.ui-dark .ui-colorpickerbutton { border-color: #404040; background-color: #303030; color: #FFF; }
		.ui-dark .ui-colorpickerbutton-arrow { border-left-color: #404040; }
		.ui-dark .ui-colorpickerbutton:hover { border-color: #505050; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('colorpickerbutton', 'default:#FFFFFF;align:left;position:top', function(self, config, cls) {

			var cls2 = '.' + cls;

			self.make = function() {
				self.aclass(cls);
				self.append('<span class="{0}-arrow"><i class="ti ti-angle-down"></i></span><div class="{0}-color"></div>'.format(cls));
				self.event('click', function() {
					if (config.disabled)
						return;
					var opt = {};
					opt.align = config.align;
					opt.position = config.position;
					opt.offsetX = config.offsetX;
					opt.offsetY = config.offsetY;
					opt.element = self.element;
					opt.callback = function(color) {
						self.set(color.toUpperCase());
						self.change(true);
					};
					SETTER('colorpicker/show', opt);
				});
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'disabled':
						self.tclass('ui-disabled', !!value);
						break;
				}
			};

			self.setter = function(value) {
				self.find(cls2 + '-color').css('background-color', value || config.default);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="colorpicker"></ui-component>

	<div class="row">
		<div class="col-xs-4">
			<ui-component name="colorpickerbutton" path="color"></ui-component>
		</div>
	</div>

	<script>
		var color = '#4F69FF';
	</script>

</body>
</html>
