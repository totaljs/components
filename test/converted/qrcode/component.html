<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-qrcode {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('qrcode', 'size:200', function(self, config) {

			var url = 'https://api.qrserver.com/v1/create-qr-code/?color=000000&bgcolor=FFFFFF&data={0}&qzone=0&margin=0&size={1}x{1}&ecc=L';
			var img = null;

			self.readonly();

			self.setter = function(value) {

				var src = url;

				if (value) {
					value = value.toString();
				} else {
					src = 'data:image/gif;base64,R0lGODlhAQABAIAAAP7//wAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
					value = '';
				}

				var text = encodeURIComponent(value);
				if (img) {
					img.attr('src', src.format(text, config.size));
				} else {
					self.html('<img src="{0}" alt="QR Code" border="0" style="max-width:100%;height:auto" />'.format(src.format(text, config.size)));
					img = self.find('img');
				}
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="qrcode" path="mytext"></ui-component>

	<script>
		var mytext = 'https://www.componentator.com';
	</script>

</body>
</html>
