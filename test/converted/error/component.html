<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-error { margin: 0 0 15px; padding: 0; list-style-type: none; border: 2px solid #BE3A48; border-left-width: 0; border-right-width: 0; padding: 10px 0; color: #BE3A48; font-family: Arial; font-size: 14px }
		.ui-error i { width: 16px; margin-right: 5px; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('error', 'icon:ti ti-warning', function(self, config, cls) {

			self.readonly();

			self.make = function() {
				self.aclass(cls + ' hidden');
			};

			self.setter = function(value) {

				if (!(value instanceof Array) || !value.length) {
					self.tclass('hidden', true);
					return;
				}

				var builder = [];
				for (var i = 0, length = value.length; i < length; i++)
					builder.push('<div><i class="{1}"></i>{0}</div>'.format(value[i].error, self.icon(config.icon)));

				self.html(builder.join(''));
				self.tclass('hidden', false);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="error" path="mycustomerror"></ui-component>

	<script>
		var mycustomerror = [{ error: 'Invalid Email Address' }, { error: 'Password is too short' }];
	</script>

</body>
</html>
