<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-hashchange {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('hashchange', function(self, config) {

			let prev = null;
			let isready = false;

			self.singleton();
			self.readonly();

			self.ee = function() {
				EMIT('hash', prev);
			};

			self.handler = function() {

				if (!isready)
					return;

				let hash = location.hash.substring(1);
				if (prev !== hash) {
					prev = hash;
					if (config.delay)
						setTimeout2(self.ID, self.ee, config.delay);
					else
						self.ee();
				}
			};

			self.on('location', function() {
				let hash = location.hash;
				if (hash !== prev)
					self.handler();
			});

			self.make = function() {
				$(W).on('hashchange', self.handler);
				if (config.middleware) {
					MIDDLEWARE(config.middleware.split(',').trim(), function() {
						isready = true;
						self.handler();
					});
				} else {
					isready = true;
					self.on('ready', self.handler);
				}
			};

			self.destroy = () => $(W).off('hashchange', self.handler);

		});

	</script>

	<!-- Example -->
	<ui-component name="hashchange"></ui-component>

	<ui-bind path="currenthash" config="text"></ui-bind>

	<script>

		setInterval(() => location.hash = GUID(10), 1000);

		ON('hash', function(hash) {
			SET('currenthash', hash);
		});

	</script>

</body>
</html>
