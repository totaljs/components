<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-paste {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('paste', function(self) {

			self.readonly();
			self.singleton();
			self.blind();

			self.make = function() {
				$(W).on('paste', function(e) {
					var text = (e.originalEvent.clipboardData || W.clipboardData).getData('text') || '';
					text && EMIT('paste', text, e);
				});
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="paste"></ui-component>

	<script>
	    ON('paste', function(text, e) {
	        alert(text);
	    });
	</script>

</body>
</html>
