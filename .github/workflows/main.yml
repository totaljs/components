name: Upload to KeyCDN

on: workflow_dispatch

jobs:
  ftp-upload:
    name: 🎉 Upload
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v2
      
    - uses: actions/setup-node@v3
      with:
        node-version: '26'

    - name: Generating components
      run: |
        npm install total5
        cd tools
        node componentator.js
        
    - name: FTP Deployer
      uses: sand4rt/ftp-deployer@v1.3
      with:
        host: ${{ secrets.KEYCDN_SERVER }}
        username: ${{ secrets.KEYCDN_USERNAME }}
        password: ${{ secrets.KEYCDN_PASSWORD }}
        remote_folder: /
        local_folder: cdn/ # optional, local path, default is: dist
