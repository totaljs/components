<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-movable {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('movable', 'move:true', function(self, config) {

			var events = {};
			var draggable;
			var check;

			self.readonly();

			self.make = function() {
				var target = config.global ? $(document) : config.parent ? self.parent(config.parent) : self.element;
				target.on('dragenter dragover dragexit drop dragleave dragstart', config.selector, events.ondrag).on('mousedown', config.selector, events.ondown);
			};

			self.configure = function(key, value) {
				if (key === 'check')
					check = value ? GET(self.makepath(value)) : null;
			};

			events.ondrag = function(e) {

				if (config.disabled || !draggable) {
					e.preventDefault();
					return;
				}

				if (e.type !== 'dragstart') {
					e.stopPropagation();
					e.preventDefault();
				}

				switch (e.type) {
					case 'drop':

						var parent = config.container ? $(draggable).closest(config.container)[0] : draggable.parentNode;

						var a = draggable;
						var b = e.target;
						var ai = -1;
						var bi = -1;
						var is = false;

						draggable = null;

						while (true) {

							if (b.parentNode === parent) {
								is = true;
								break;
							}

							b = b.parentNode;
							if (b == null || b.tagName === 'HTML')
								break;
						}

						if (a === b || !is)
							return;

						for (var i = 0; i < parent.children.length; i++) {
							var child = parent.children[i];
							if (a === child)
								ai = i;
							else if (b === child)
								bi = i;
							if (bi !== -1 && ai !== -1)
								break;
						}

						var children;

						var $b = $(e.target);
						b = $b.filter(config.selector);

						if (!b.length)
							b = $b.closest(config.selector);

						if (b.length)
							b = b[0];
						else
							return;

						if (config.move) {
							if (ai > bi)
								parent.insertBefore(a, b);
							else
								parent.insertBefore(a, b.nextSibling);

							children = $(parent).find(config.selector).toArray();

						} else {

							children = $(parent).find(config.selector);

							var tmp = [];
							for (var i = 0; i < children.length; i++) {
								var item = children[i];
								if (item === a)
									tmp.push(b);
								else if (item === b)
									tmp.push(a);
								else
									tmp.push(item);
							}
							children = tmp;
						}

						config.exec && self.EXEC(config.exec, children, a, b);
						self.path && self.change(true);
						break;

					case 'dragstart':
						var eo = e.originalEvent;
						eo.dataTransfer && eo.dataTransfer.setData('text', '1');
						break;
					case 'dragenter':
					case 'dragover':
					case 'dragexit':
					case 'dragleave':
						break;
				}
			};

			events.ondown = function(e) {

				if (config.disabled)
					return;

				if (e.target.nodeName === 'INPUT' || e.target.nodeName === 'TEXTAREA')
					draggable = null;
				else
					draggable = !check || check($(this)) ? this : null;
			};

			self.destroy = function() {
				$(document).off('dragenter dragover dragexit drop dragleave dragstart', config.selector, events.ondrag).off('mousedown', config.selector, events.ondown);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="movable" config="selector:.dragme;exec:moved">
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#F0F0F0;text-align:center;position:relative;display:inline-block;margin:10px">A</div>
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#E0E0E0;text-align:center;position:relative;display:inline-block;margin:10px">B</div>
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#D0D0D0;text-align:center;position:relative;display:inline-block;margin:10px">C</div>
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#C0C0C0;text-align:center;position:relative;display:inline-block;margin:10px">D</div>
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#B0B0B0;text-align:center;position:relative;display:inline-block;margin:10px">E</div>
		<div class="dragme" draggable="true" style="width:50px;line-height:50px;background-color:#A0A0A0;text-align:center;position:relative;display:inline-block;margin:10px">F</div>
	</ui-component>

	<script>
		function moved(list) {
			console.log(list);
		}
	</script>

</body>
</html>
