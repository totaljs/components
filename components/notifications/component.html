<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-notification-container { position: fixed; right: 0; top: 0; width: 280px; z-index: 100; padding: 0 20px 0 0; }
		.ui-notification { background-color: #FFF; box-shadow: 0 3px 20px rgba(0,0,0,0.2); border-radius: var(--radius); border: 1px solid #D0D0D0; border-left-width: 5px; border-left-color: #000; font-size: 12px; padding: 15px 15px 15px 10px; margin-top: 20px; position: relative; display: block; transition: 0.5s all; }
		.ui-notification > i { position: absolute; right: 12px; top: 10px; color: #DB2724; font-size: 14px; cursor: pointer; }
		.ui-notification > i:active { top: 11px; }
		.ui-notification > i:hover { color: #DB2724; }
		.ui-notification-icon { float: left; font-size: 11px; color: #AAB2BD; margin-right: 5px; }
		.ui-notification-message { margin: 1px 0 0 10px; color: gray; max-height: 150px; line-height: 16px; }
		.ui-notification-datetime { font-size: 11px; color: #A0A0A0; margin-bottom: 4px; }
		.ui-notification-hide { opacity: 0; margin-top: -50px; }

		@media(max-width: 767px) {
		  .ui-notification-container { width: auto; left: 0; padding-left: 20px; }
		}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('notifications', 'timeout:8000', function(self, config) {

			var autoclosing;
			var system = false;
			var N = window.Notification;

			self.singleton();
			self.readonly();
			self.nocompile && self.nocompile();
			self.template = Tangular.compile('<div class="ui-notification" data-id="{{ id }}" style="border-left-color:{{ color }}{{ if callback }};cursor:pointer{{ fi }}"><i class="ti ti-times-circle"></i><div class="ui-notification-message"><div class="ui-notification-icon"><i class="ti {{ icon }}" style="color:{{ color }}"></i></div><div class="ui-notification-datetime">{{ date | format(\'{0}\') }}</div>{{ message | raw }}</div></div>'.format(config.date || 'yyyy-MM-dd HH:mm'));
			self.items = {};

			self.make = function() {

				self.aclass('ui-notification-container');

				self.event('click', '.ti-times-circle', function() {
					var el = $(this).closest('.ui-notification');
					self.close(+el.attr('data-id'));
					clearTimeout(autoclosing);
					autoclosing = null;
					self.autoclose();
				});

				self.event('click', 'a,button', function(e) {
					e.stopPropagation();
				});

				self.event('click', '.ui-notification', function() {
					var el = $(this);
					var id = +el.attr('data-id');
					var obj = self.items[id];
					if (!obj || !obj.callback)
						return;
					obj.callback();
					self.close(id);
				});

				if (config.native === true && N) {
					system = N.permission === 'granted';
					!system && N.requestPermission(function (permission) {
						system = permission === 'granted';
					});
				}
			};

			self.close = function(id) {
				var obj = self.items[id];
				if (!obj)
					return;
				obj.callback = null;

				if (obj.system) {
					obj.system.onclick = null;
					obj.system.close();
					obj.system = null;
				}

				delete self.items[id];
				var item = self.find('div[data-id="{0}"]'.format(id));
				item.addClass('ui-notification-hide');
				setTimeout(function() {
					item.remove();
				}, 600);
			};

			self.append = function(icon, message, date, callback, color) {
				if (icon && icon.substring(0, 3) !== 'ti-')
					icon = 'ti-' + icon;

				if (typeof(date) === 'function') {
					color = callback;
					callback = date;
					date = null;
				}

				var obj = { id: Math.floor(Math.random() * 100000), icon: icon || 'ti-info-circle', message: message, date: date || new Date(), callback: callback, color: color || 'black' };
				var focus = document.hasFocus();

				self.items[obj.id] = obj;

				if (!system || focus)
					self.element.append(self.template(obj));

				self.autoclose();

				if (!system || focus)
					return;

				obj.system = new N(message.replace(/(<([^>]+)>)/ig, ''));
				obj.system.onclick = function() {

					if (obj.callback) {
						obj.callback();
						obj.callback = null;
					}

					obj.system.close();
					obj.system.onclick = null;
					obj.system = null;
				};
			};

			self.autoclose = function() {

				if (autoclosing)
					return self;

				autoclosing = setTimeout(function() {
					clearTimeout(autoclosing);
					autoclosing = null;
					var el = self.find('.ui-notification');
					el.length > 1 && self.autoclose();
					el.length && self.close(+el.eq(0).attr('data-id'));
				}, config.timeout);
			};
		});

	</script>

	<!-- Example -->
	<style>
		body { font-family: Arial; background-color: #F5F5F5; }
	</style>

	<ui-component name="notifications" config="date:dd.MM.yyyy HH:mm;native:true"></ui-component>

	<script>

		FIND('notifications', function(component) {
			component.append('ti-lightbulb', 'This is a new notification component.');
		});

		setTimeout(function() {
			FIND('notifications').append('ti-calendar', 'You have a meeting in the Central Park.', function() {
				alert('You clicked on the notification');
			}, 'red');
		}, 3000);

		setTimeout(function() {
			FIND('notifications').append('ti-github', 'Please support <a href="https://github.com/petersirka/jComponent" target="_blank">jComponent on GitHub</a>.');
		}, 6000);

		setTimeout(function() {
			FIND('notifications').append('ti-link', 'Total.js is node.js web application framework, please support it on social networks.');
		}, 10000);

	</script>

</body>
</html>
