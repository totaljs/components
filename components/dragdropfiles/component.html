<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-dragdropfiles { background-color: #F0F0F0; padding: 3.6em 0; text-align: center; cursor: pointer; border-radius: var(--radius); border: 0.15em solid #F0F0F0; }
		.ui-dragdropfiles span { color: #a5a5a5; position: relative; top: 50%; transform: translate(-50%, -50%); font-size: 1.5em; }
		.ui-dragdropfiles.over { background-color: #e5e5e5 !important; border: 0.15em dashed #000; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('dragdropfiles', 'click:true;class:ui-dragdropfiles;accept:*/*;', function(self, config) {

			var file;

			self.readonly();
			self.nocompile && self.nocompile();

			self.destroy = function() {
				file.off('*').remove();
			};

			self.make = function() {

				var has = false;
				var id = 'file' + self.ID;

				self.aclass(config.class);

				$(document.body).append('<input type="file" id="{0}" class="hidden" accept="{1}" multiple />'.format(id, config.accept));

				file = $('#' + id);

				self.event('click', function() {
					config.click && file.trigger('click');
				});

				file.on('change', function(e) {
					var self2 = this;
					self.EXEC(config.exec, this.files, e);
					setTimeout(function() {
						self2.value = '';
					}, 1000);
				});

				self.event('dragenter dragover dragexit drop dragleave', function (e) {

					e.stopPropagation();
					e.preventDefault();

					switch (e.type) {
						case 'drop':
							config.class && has && self.rclass('over');
							break;
						case 'dragenter':
						case 'dragover':
							config.class && !has && self.aclass('over');
							has = true;
							return;
						case 'dragleave':
						case 'dragexit':
						default:
							setTimeout2(self.id, function() {
								config.class && has && self.rclass('over');
								has = false;
							}, 100);
							return;
					}

					self.EXEC(config.exec, e.originalEvent.dataTransfer.files, e);
				});
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="dragdropfiles" path="null" config="exec:dragdropfiles_files;accept:application/pdf;">
		<span>Drag &amp; Drop files here</span>
	</ui-component>

</body>
</html>
