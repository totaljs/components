<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-pages { overflow: hidden; position: relative; }
		.ui-pages > section { position: absolute; left: 0; right: 0; top: 0; overflow: hidden; will-change: transform, opacity; }
		.ui-pages-visible { display: block; }
		.ui-pages-hide-left { transform: translate(-100%, 0); }
		.ui-pages-hide-top { transform: translate(0, -100%); }
		.ui-pages-hide-right { transform: translate(100%, 0); }
		.ui-pages-hide-bottom { transform: translate(0, 100%); }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('pages', 'margin:0;delay:220;margintype:offset;scrollbar:1', function(self, config, cls) {

			var cls2 = '.' + cls;
			var init = false;

			self.readonly();

			self.configure = function(key, value, init) {
				switch (key) {
					case 'minheight':
					case 'margin':
					case 'marginxs':
					case 'marginsm':
					case 'marginmd':
					case 'marginlg':
						!init && self.resize();
						break;
					case 'selector': // backward compatibility
						config.parent = value;
						self.resize();
						break;
				}
			};

			self.make = function() {
				self.aclass(cls);
				self.element.find('> section').aclass('{0}-section'.format(cls));
				self.aclass('{0} {0}-hidden'.format(cls));
				self.on('resize + resize2', self.resize);
			};

			self.released = function(is) {
				!is && self.resize();
			};

			self.resize = function() {
				setTimeout2(self.ID, self.resizeforce, 50);
			};

			var oldh;
			var oldw;

			self.resizeforce = function() {

				var el = self.parent(config.parent);
				var h = el.height();
				var w = el.width();

				var margin = config.margin;

				if (margin === 'auto')
					margin = self.element[config.margintype]().top;

				if (h === 0 || w === 0) {
					self.$waiting && clearTimeout(self.$waiting);
					self.$waiting = setTimeout(self.resize, 234);
					return;
				}

				if (margin)
					h -= margin;

				if (w === oldw && h === oldh)
					return;

				oldw = w;
				oldh = h;

				var css = {};
				css.height = h;
				css.width = self.element.width();

				var sections = self.find(cls2 + '-section');
				sections.css(css);

				css.width = undefined;
				self.css(css);

				setTimeout2(self.ID + 'scrollbars', function(sections) {
					for (var tmp of sections)
						tmp.$config && tmp.$config.scroller && tmp.$config.scroller.resize();
				}, 500, null, sections);

				var c = cls + '-hidden';

				self.hclass(c) && self.rclass(c, 100);

				if (!init) {
					self.rclass('invisible', 250);
					init = true;
				}

				self.element.SETTER('*/resize');
			};

			var replace = function(cfg, value) {
				return value.replace(/\?/g, cfg.path || cfg.if);
			};

			self.setter = function(value) {

				var hide = null;
				var show = null;
				var cfg;

				var arr = self.find('> section');
				for (var el of arr) {

					if (!el.$config)
						el.$config = el.getAttribute('data-config').parseConfig();

					cfg = el.$config;

					if (value == cfg.if)
						show = $(el);

					if (el.classList.contains(cls + '-visible'))
						hide = $(el);
				}

				if (hide && show && hide[0] === show[0]) {
					cfg = show[0].$config;
					cfg.reload && self.EXEC(replace(cfg, cfg.reload), show);
					return;
				}

				var anim;
				var hfn = null;
				var sfn = null;
				var animdelay = ((config.delay * 2) / 1000);

				if (hide) {
					cfg = hide[0].$config;
					anim = cfg.anim || 'left';
					(function(cfg, anim) {
						hfn = function() {
							hide.rclass(cls + '-visible').css({ transition: 'all ' + animdelay + 's' }).aclass('{0}-hide-{1}'.format(cls, anim), 2);
							cfg.hide && self.EXEC(replace(cfg, cfg.hide), hide);
						};
					})(cfg, anim);
				}

				if (show) {

					cfg = show[0].$config;
					var prev = anim;
					anim = cfg.anim || 'left';
					var delay = anim === prev ? config.delay * 2 : config.delay;

					if (!cfg.init) {

						if (cfg.scrollbar == null)
							cfg.scrollbar = 1;

						if (cfg.scrolltop == null)
							cfg.scrolltop = 1;

						cfg.init = true;

						if (cfg.scrollbar) {
							show.wrapInner('<div class="{0}-scrollbar"></div>'.format(cls));
							cfg.scroller = SCROLLBAR(show.find(cls2 + '-scrollbar'), { parent: show, orientation: 'y', shadow: cfg.scrollbarshadow || config.scrollbarshadow });
						}
					}

					(function(cfg, anim) {
						sfn = function() {
							show.aclass('{0}-hide-{1}'.format(cls, anim));
							cfg.scroller && cfg.scrolltop && cfg.scroller.scrollTop(0);
							setTimeout(function() {
								show.css({ transition: 'all ' + animdelay + 's' }).aclass(cls + '-visible').rclass('hidden invisible');
								requestAnimationFrame(function() {
									show.rclass(cls + '-hide-' + anim, delay);
									cfg.reload && self.EXEC(replace(cfg, cfg.reload), show);
									cfg.autofocus && show.autofocus && show.autofocus();
								});
							}, 50);
						};
					})(cfg, anim);

					var run = function(cfg) {
						if (cfg.check) {
							EXEC(replace(cfg, cfg.check), function() {
								hfn && hfn();
								sfn && sfn();
								config.loading && self.EXEC(config.loading, false);
							}, el);
						} else {
							hfn && hfn();
							sfn && sfn();
							config.loading && self.EXEC(config.loading, false);
						}
					};

					if (cfg.url) {

						config.loading && self.EXEC(config.loading, true);

						let args = [];

						args.push(cfg.url);
						args.push(cfg.scroller ? cfg.scroller.body : show);
						args.push(function() {
							cfg.url = null;
							run(cfg);
						});

						if (!M.is20)
							args.push(true);

						args.push(function(content) {
							let path = cfg.path || cfg.if;
							return ADAPT(path, cfg.id, content);
						});

						IMPORT.apply(W, args);
					} else
						run(cfg);
				}

			};

		});

	</script>

	<!-- Example -->
	<style>
		body { padding: 0; margin: 0; overflow: hidden; }
	</style>

	<ui-component name="pages" path="common.page" config="parent:window">

		<section class="hidden invisible" data-config="if:page1;anim:left">
			<div class="padding">
				<div style="background-color:#F0F0F0;margin:30px auto;padding:30px;max-width:600px;border-radius:10px">
					PAGE 1
				</div>
			</div>
		</section>

		<section class="hidden invisible" data-config="if:page2;anim:right">
			<div class="padding">
				<div style="background-color:#F0F0F0;margin:30px auto;padding:30px;max-width:600px;border-radius:10px">
					PAGE 2
				</div>
			</div>
		</section>

		<section class="hidden invisible" data-config="if:page3;anim:bottom">
			<div class="padding">
				<div style="background-color:#F0F0F0;margin:30px auto;padding:30px;max-width:600px;border-radius:10px">
					PAGE 3
				</div>
			</div>
		</section>
	</ui-component>


	<script>

		var common = {};

		function togglepage() {

			var val = common.page;

			switch (val) {
				case 'page1':
					val = 'page2';
					break;
				case 'page2':
					val = 'page3';
					break;
				case 'page3':
				default:
					val = 'page1';
					break;
			}

			SET('common.page', val);
		}

		setInterval(togglepage, 2000);
		togglepage();

	</script>

</body>
</html>
