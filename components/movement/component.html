<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-movement {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('movement', function(self) {

			var SKIP = { INPUT: 1, TEXTAREA: 1, SELECT: 1 };
			var TYPE = { '13': 'enter', '27': 'esc', '38': 'up', '40': 'down', '37': 'left', '39': 'right' };
			var ondown, onexit;

			self.singleton();
			self.readonly();
			self.nocompile();

			self.make = function() {

				$(W).on('keydown', function(e) {
					if (!SKIP[e.target.tagName]) {
						var c = e.keyCode;
						switch (c) {
							case 9:  // tab
								onexit && onexit();
								onexit = null;
								ondown = null;
								break;
							case 13: // enter
							case 27: // esc
							case 38: // up
							case 40: // down
							case 37: // left
							case 39: // right
								ondown && ondown(TYPE[c + ''], e);
								break;
						}
					}
				});
			};

			self.assign = function(down, exit) {
				onexit && onexit();
				ondown = down;
				onexit = exit;
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="movement"></ui-component>

	<div class="block exec" data-exec="assignmovement" style="width:400px;height:400px;padding:20px;font-size:16px;border:2px solid #E0E0E0">
		Click here and press arrows/enter/esc: <b><ui-bind path="mykey" config="text;empty"></ui-bind></b>
	</div>

	<script>
		function assignmovement() {
			SETTER('movement/assign', function(key) {
				SET('mykey', key);
			});
		}
	</script>

</body>
</html>
