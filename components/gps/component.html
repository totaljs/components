<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-gps {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('gps', 'watcher:1', function(self, config) {

			var cache = '';

			self.singleton();
			self.readonly();

			var position = function(pos) {

				var coords = pos.coords;
				var obj = {};
				obj.lat = coords.latitude.floor(6);
				obj.lng = coords.longitude.floor(6);
				obj.speed = coords.speed;
				obj.altitude = coords.altitude;
				obj.accuracy = coords.accuracy;

				if (obj.speed)
					obj.speed = obj.speed.floor(1);

				if (obj.altitude)
					obj.altitude = obj.altitude.floor(2);

				if (obj.accuracy)
					obj.accuracy = obj.accuracy.floor(2);

				obj.pos = obj.lat + ',' + obj.lng;

				var key = obj.pos + ',' + (obj.speed || '0') + ',' + (obj.altitude || '0');
				if (cache && cache === key)
					return;

				cache = key;
				self.emit('gps', obj);
				self.bind('@modified', obj);
			};

			self.make = function() {
				var geo = navigator.geolocation;
				geo.getCurrentPosition(position);
				config.watcher && geo.watchPosition(position);
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="gps" path="mygps"></ui-component>
	<pre><ui-bind path="mygps" config="html:JSON.stringify(value, null, '  ')"></ui-bind></pre>

</body>
</html>
