<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-tagger { margin-top: 5px; }
		.ui-tagger-item { position: relative; margin: 8px 8px 0 0; font-size: 11px; background-color: #F0F0F0; padding: 0; color: #000; display: inline-block; line-height: 14px; font-size: 12px; height: 22px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.ui-tagger-item span { padding: 4px 8px; position: relative; display: block; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
		.ui-tagger-item i { width: 22px; float: left; height: 22px; padding: 5px 0 0; text-align: center; background-color: #303030; cursor: pointer; color: #FFF; font-size: 10px; }
		.ui-tagger-fullwidth .ui-tagger-item { display: block; max-width: inherit; margin: 0 0 1px; }
		.ui-dark .ui-tagger-item i { background-color: #707070; }
		.ui-dark .ui-tagger-item { background-color: #404040; color: silver; }
		.ui-tagger-item .ti.ti-times { transform: scale(1); font-size: 12px; font-weight: bold; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('tagger', 'text:name', function(self, config, cls) {

			// self.bindvisible();
			self.nocompile && self.nocompile();

			var obj = VBINDARRAY('<div class="{0}-item"><i class="ti ti-times"></i><span data-bind=".{1}__text__title"></span></div>'.format(cls, config.text), self);

			self.make = function() {

				self.aclass(cls);
				config.fullwidth && self.aclass(cls + '-fullwidth');

				self.event('click', 'i', function() {
					var el = $(this);
					var index = el.vbind().index;
					self.get().splice(index, 1);
					self.refresh();
					self.change();
				});
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'fullwidth':
						if (!init || value)
							self.tclass(cls + '-fullwidth', !!value);
						break;
				}
			};

			self.setter = function(value) {
				obj.set(value || EMPTYARRAY);
			};

		});

	</script>

	<!-- Example -->
	<div style="width:300px">
		<ui-component name="tagger" path="mydata"></ui-component>
		<br />
	</div>

	<script>
		var mydata = [{ id: 1, name: 'Total.js' }, { id: 2, name: 'jComponent' }];
	</script>

</body>
</html>
