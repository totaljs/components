<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-virtualwire {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('virtualwire', 'selector:.virtualwire;max:50;repeat:100', function(self, config, cls) {

			var old, waiter, div;

			self.make = function() {
				div = document.createElement('DIV');
				div.style = 'position:absolute;left:-1000px;top:-1000px;z-index:-1;visibility:hidden';
				document.body.appendChild(div);
				self.aclass(cls);
			};

			self.destroy = function() {
				div.parentNode.removeChild(div);
				div = null;
			};

			self.restore = function() {
				if (old) {

					div.appendChild(old[0]);

					// while (self.dom.children.length)
					// 	old[0].appendChild(self.dom.children[0]);

					var exec = old.attrd('out');
					exec && self.EXEC(exec);
					old = null;
				}
			};

			self.backup = function(el) {

				if (!el || !el.length) {
					self.restore();
					return;
				}

				if (old && old[0] === el[0])
					return;

				self.restore();

				el.rclass('hidden invisible');
				self.dom.appendChild(el[0]);
				// var children = el[0].children;
				// while (children.length)
				// 	self.dom.appendChild(children[0]);

				old = el;
				var exec = el.attrd('in');
				exec && self.EXEC(exec);
			};

			self.load = function(value, count) {

				waiter && clearTimeout(waiter);
				waiter = null;

				if (count > config.max)
					return;

				var el = $(config.selector + '[data-if="' + value + '"],' + config.selector + '[data-scope="' + value + '"]');
				if (el.length)
					self.backup(el);
				else
					waiter = setTimeout(self.load, config.repeat, value, (count || 0) + 1);
			};

			self.setter = function(value) {
				self.restore();
				if (value) {
					waiter && clearTimeout(waiter);
					self.load(value);
				}
			};

		});

	</script>

	<!-- Example -->
	<div class="b">Virtual Wire Container:</div>
	<ui-component name="virtualwire" path="common.page"></ui-component>

	<hr />

	<!-- YOU CAN HIDE THE ELEMENTS BELOW BY ADDING "hidden" CLASS -->
	<div class="virtualwire" data-if="users">
		<div>USERS</div>
	</div>

	<div class="virtualwire" data-if="products" data-in="products_in" data-out="products_out">
		<div>PRODUCTS</div>
	</div>

	<script>

		var common = {};

		setInterval(function() {
			switch (common.page) {
				case 'users':
					SET('common.page', 'products');
					break;
				case 'products':
					NULL('common.page');
					break;
				default:
					SET('common.page', 'users');
					break;
			}
		}, 2000);

		function products_out() {
			console.log('products_out');
		}

		function products_in() {
			console.log('products_in');
		}

	</script>

</body>
</html>
