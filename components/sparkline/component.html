<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-sparkline { --spbg: #FFF; position: relative; display: inline-block; vertical-align: middle; line-height: 0; }
		.ui-sparkline-fluid { display: block; }
		.ui-sparkline svg { display: block; width: 100%; height: 100%; overflow: visible; }
		.ui-sparkline-line { fill: none; stroke: var(--color); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
		.ui-sparkline-area { fill: rgba(var(--rgb), .14); }
		.ui-sparkline-bar { fill: rgba(var(--rgb), .45); }
		.ui-sparkline-bar.ui-sparkline-last { fill: var(--color); }
		.ui-sparkline-neg { fill: #D03B3B; }
		.ui-sparkline-dot { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--color); box-shadow: 0 0 0 1.5px var(--spbg); pointer-events: none; }
		.ui-sparkline-dot.ui-sparkline-min { background: #8A8A8A; }
		.ui-sparkline-hidden { display: none; }
		.ui-sparkline-tip { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; display: none; padding: 4px 8px; border-radius: 6px; background: #1F1F1F; color: #FFF; font-size: 11px; line-height: 1.4; white-space: nowrap; transform: translateX(-50%); pointer-events: none; }
		.ui-sparkline-hover .ui-sparkline-tip { display: block; }
		.ui-sparkline-cross { position: absolute; top: 0; bottom: 0; display: none; width: 1px; background: rgba(0, 0, 0, .25); pointer-events: none; }
		.ui-sparkline-hover .ui-sparkline-cross { display: block; }

		.ui-dark .ui-sparkline { --spbg: #252525; }
		.ui-dark .ui-sparkline-tip { background: #F2F2F2; color: #1F1F1F; }
		.ui-dark .ui-sparkline-cross { background: rgba(255, 255, 255, .35); }
		.ui-dark .ui-sparkline-neg { fill: #E66767; }

		@media (forced-colors: active) {
			.ui-sparkline-line { stroke: CanvasText; }
			.ui-sparkline-bar, .ui-sparkline-area { fill: CanvasText; }
		}

	</style>

	<script component>

		COMPONENT('sparkline', 'label:;type:line;width:100;height:28;color:;zero:false;dot:true;minmax:false;tooltip:true;format:number;decimals:0;compact:true;currency:EUR;locale:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var values = [];
			var labels = [];
			var points = [];
			var fmt = {};
			var label = '';

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var intl = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, { maximumFractionDigits: options.maximumFractionDigits || 0 });
				}
			};

			var prepare = function() {
				var decimals = Math.max(0, config.decimals || 0);
				var opt = { minimumFractionDigits: 0, maximumFractionDigits: decimals };
				var copt = { notation: 'compact', maximumFractionDigits: 1 };
				if (config.format === 'percent')
					opt.style = 'percent';
				else if (config.format === 'currency') {
					opt.style = copt.style = 'currency';
					opt.currency = copt.currency = config.currency || 'EUR';
				}
				fmt.full = intl(opt);
				fmt.compact = config.compact ? intl(copt) : null;
			};

			var format = function(n) {
				if (n == null)
					return '—';
				if (config.format === 'percent')
					return fmt.full.format(n / 100);
				return (fmt.compact && Math.abs(n) >= 10000 ? fmt.compact : fmt.full).format(n);
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			// [1, 2, 3] or { data: [1, 2, 3], labels: ['Mon', 'Tue', 'Wed'] }
			var parse = function(value) {
				var src = value instanceof Array ? value : value && value.data instanceof Array ? value.data : [];
				values = src.map(num);
				labels = value && value.labels instanceof Array ? value.labels.slice(0, values.length) : [];
			};

			var path = function(list) {
				var d = '';
				var move = true;
				for (var i = 0; i < list.length; i++) {
					if (!list[i]) {
						move = true;
						continue;
					}
					d += (move ? 'M' : 'L') + list[i][0].toFixed(2) + ',' + list[i][1].toFixed(2);
					move = false;
				}
				return d;
			};

			// The summary for screen readers: first, last, lowest and highest value
			var summary = function() {
				var list = values.filter(function(v) {
					return v != null;
				});
				if (!list.length)
					return '';
				return format(list[0]) + ' → ' + format(list[list.length - 1]) + ' (' + format(Math.min.apply(Math, list)) + ' – ' + format(Math.max.apply(Math, list)) + ')';
			};

			var render = function() {

				var list = values.filter(function(v) {
					return v != null;
				});
				var name = els.label.textContent.trim();
				var text = summary();

				self.attr('aria-label', (name ? name + ': ' : '') + (text || '—'));
				points = [];

				if (!list.length) {
					els.svg.innerHTML = '';
					els.dot.classList.add(cls + '-hidden');
					els.min.classList.add(cls + '-hidden');
					els.max.classList.add(cls + '-hidden');
					return;
				}

				var min = Math.min.apply(Math, list);
				var max = Math.max.apply(Math, list);
				var bar = config.type === 'bar';
				if (config.zero || bar) {
					min = Math.min(0, min);
					max = Math.max(0, max);
				}
				var range = max - min || 1;
				var n = values.length;
				var W = 100;
				var H = 100;
				var pad = 6;
				var y = function(v) {
					return max === min ? H / 2 : pad + (1 - (v - min) / range) * (H - pad * 2);
				};
				var builder = [];
				var i;

				if (bar) {
					var band = W / n;
					var gap = Math.min(band * 0.25, 2);
					var zero = y(0);
					var last = -1;
					for (i = 0; i < n; i++)
						values[i] != null && (last = i);
					for (i = 0; i < n; i++) {
						points.push([band * (i + 0.5), values[i] == null ? null : y(values[i])]);
						if (values[i] == null)
							continue;
						var top = Math.min(zero, y(values[i]));
						var h = Math.max(1, Math.abs(zero - y(values[i])));
						builder.push('<rect class="{0}-bar{1}{2}" x="{3}" y="{4}" width="{5}" height="{6}" />'.format(cls, i === last ? ' ' + cls + '-last' : '', values[i] < 0 ? ' ' + cls + '-neg' : '', (band * i + gap / 2).toFixed(2), top.toFixed(2), Math.max(0.5, band - gap).toFixed(2), h.toFixed(2)));
					}
				} else {
					var line = [];
					for (i = 0; i < n; i++) {
						var p = values[i] == null ? null : [n === 1 ? W / 2 : i / (n - 1) * W, y(values[i])];
						line.push(p);
						points.push(p ? p : [n === 1 ? W / 2 : i / (n - 1) * W, null]);
					}
					if (config.type === 'area') {
						// One area per run of values, closed on the bottom
						var run = [];
						for (i = 0; i <= n; i++) {
							if (i < n && line[i]) {
								run.push(line[i]);
								continue;
							}
							if (run.length > 1)
								builder.push('<path class="{0}-area" d="{1}L{2},{3}L{4},{3}Z" />'.format(cls, path(run), run[run.length - 1][0].toFixed(2), H, run[0][0].toFixed(2)));
							run = [];
						}
					}
					builder.push('<path class="{0}-line" d="{1}" />'.format(cls, path(line)));
				}

				els.svg.innerHTML = builder.join('');

				// Dots are HTML, so they stay round when the SVG is stretched
				var place = function(el, index, show) {
					el.classList.toggle(cls + '-hidden', !show || index === -1 || points[index][1] == null);
					if (index !== -1 && points[index][1] != null) {
						el.style.left = points[index][0] + '%';
						el.style.top = points[index][1] + '%';
					}
				};

				var lastindex = -1;
				var minindex = -1;
				var maxindex = -1;
				for (i = 0; i < n; i++) {
					if (values[i] == null)
						continue;
					lastindex = i;
					if (minindex === -1 || values[i] < values[minindex])
						minindex = i;
					if (maxindex === -1 || values[i] > values[maxindex])
						maxindex = i;
				}

				place(els.dot, lastindex, config.dot && !bar);
				place(els.min, minindex, config.minmax && !bar && minindex !== lastindex);
				place(els.max, maxindex, config.minmax && !bar && maxindex !== lastindex);
			};

			var setsize = function() {
				var w = config.width;
				self.tclass(cls + '-fluid', !w);
				self.css({ width: w ? w + 'px' : '100%', height: (config.height || 28) + 'px' });
			};

			self.make = function() {

				label = self.html().trim();

				self.aclass(cls);
				self.attr('role', 'img');
				self.html(('<span class="{0}-label {0}-hidden"></span><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"></svg>' +
					'<span class="{0}-dot {0}-hidden"></span><span class="{0}-dot {0}-min {0}-hidden"></span><span class="{0}-dot {0}-max {0}-hidden"></span>' +
					'<span class="{0}-cross" aria-hidden="true"></span><span class="{0}-tip" aria-hidden="true"></span>').format(cls));

				els.label = self.find(cls2 + '-label')[0];
				els.svg = self.find('svg')[0];
				var dots = self.find(cls2 + '-dot');
				els.dot = dots[0];
				els.min = dots[1];
				els.max = dots[2];
				els.cross = self.find(cls2 + '-cross')[0];
				els.tip = self.find(cls2 + '-tip')[0];

				prepare();

				self.event('mousemove', function(e) {
					if (!config.tooltip || !points.length)
						return;
					var rect = self.dom.getBoundingClientRect();
					var x = (e.clientX - rect.left) / rect.width * 100;
					var best = 0;
					for (var i = 1; i < points.length; i++) {
						if (Math.abs(points[i][0] - x) < Math.abs(points[best][0] - x))
							best = i;
					}
					var text = format(values[best]);
					var name = labels[best];
					els.tip.textContent = name == null || name === '' ? text : (name instanceof Date ? name.toLocaleDateString(locale()) : name) + ': ' + text;
					els.tip.style.left = points[best][0] + '%';
					els.cross.style.left = points[best][0] + '%';
					self.aclass(cls + '-hover');
				});

				self.event('mouseleave', function() {
					self.rclass(cls + '-hover');
				});
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						els.label.innerHTML = value || label;
						!init && render();
						break;
					case 'width':
					case 'height':
						setsize();
						break;
					case 'color':
						var m = (/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i).exec(value || '');
						if (m) {
							var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
							self.dom.style.setProperty('--color', '#' + h);
							self.dom.style.setProperty('--rgb', [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)].join(', '));
						} else {
							self.dom.style.removeProperty('--color');
							self.dom.style.removeProperty('--rgb');
						}
						break;
					case 'type':
					case 'zero':
					case 'dot':
					case 'minmax':
						!init && render();
						break;
					case 'format':
					case 'decimals':
					case 'compact':
					case 'currency':
					case 'locale':
						if (!init) {
							prepare();
							render();
						}
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				render();
			};

		});

	</script>

	<div style="padding:12px;font:14px Arial,sans-serif;color:#1F1F1F">

		<div style="box-sizing:border-box;max-width:420px;padding:16px 18px;border:1px solid #E3E3E3;border-radius:10px">
			<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
				<b>Visitors</b>
				<span style="color:#666;font-size:12px">Last 30 days</span>
			</div>
			<ui-component name="sparkline" path="spark.visitors" config="type:area;width:0;height:150;minmax:true">Visitors in the last 30 days</ui-component>
		</div>

		<table style="margin-top:20px;border-collapse:collapse;font-size:13px">
			<thead>
				<tr style="color:#666;text-align:left"><th style="padding:6px 14px 6px 0">Page</th><th style="padding:6px 14px">Views</th><th style="padding:6px 14px">Last 14 days</th><th style="padding:6px 14px">Per day</th></tr>
			</thead>
			<tbody>
				<tr><td style="padding:6px 14px 6px 0">/</td><td style="padding:6px 14px">12,840</td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.home">Home</ui-component></td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.homebars" config="type:bar;width:80">Home per day</ui-component></td></tr>
				<tr><td style="padding:6px 14px 6px 0">/pricing</td><td style="padding:6px 14px">2,980</td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.pricing" config="color:#EB6834">Pricing</ui-component></td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.balance" config="type:bar;width:80;zero:true;format:currency">Balance per day</ui-component></td></tr>
				<tr><td style="padding:6px 14px 6px 0">/blog/agentic-web</td><td style="padding:6px 14px">2,210</td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.blog" config="color:#1BAF7A">Agentic web</ui-component></td><td style="padding:6px 14px"><ui-component name="sparkline" path="spark.empty" config="type:bar;width:80">No data</ui-component></td></tr>
			</tbody>
		</table>

		<p style="margin-top:20px">Visitors now <ui-component name="sparkline" path="spark.live" config="width:60;height:18;tooltip:false">Visitors in the last minute</ui-component> <b class="live-count"></b></p>

	</div>

	<script>

		var series = function(n, base, amp, seed) {
			var arr = [];
			for (var i = 0; i < n; i++)
				arr.push(Math.round(base + Math.sin((i + seed) / 2.4) * amp + i * base / 60 + ((i * 13 + seed * 7) % 9) * amp / 12));
			return arr;
		};

		SET('spark.visitors', series(30, 1200, 220, 1));
		SET('spark.home', series(14, 900, 120, 2));
		SET('spark.homebars', series(14, 900, 200, 3));
		SET('spark.pricing', series(14, 200, 40, 5));
		SET('spark.balance', [120, -40, 80, 150, -20, 60, 90, -70, 110, 40]);
		SET('spark.blog', { data: [40, 52, 61, 90, 120, 180, 160, 210, 260, 240, 300, 320, 310, 360], labels: ['Nov 9', 'Nov 10', 'Nov 11', 'Nov 12', 'Nov 13', 'Nov 14', 'Nov 15', 'Nov 16', 'Nov 17', 'Nov 18', 'Nov 19', 'Nov 20', 'Nov 21', 'Nov 22'] });
		SET('spark.empty', []);

		// Real time: one value per second
		var live = series(30, 40, 6, 4);
		SET('spark.live', live);
		setInterval(function() {
			live = live.slice(1);
			live.push(Math.max(0, live[live.length - 1] + Math.round(Math.random() * 6 - 3)));
			SET('spark.live', live);
			document.querySelector('.live-count').textContent = live[live.length - 1];
		}, 1000);

	</script>

</body>
</html>
