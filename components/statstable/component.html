<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-statstable { box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }
		.ui-statstable-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-statstable-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
		.ui-statstable-title { flex: 1 1 auto; font-weight: 600; font-size: 14px; }
		.ui-statstable-notitle .ui-statstable-title { display: none; }
		.ui-statstable-search { position: relative; flex: 0 1 220px; }
		.ui-statstable-search i { position: absolute; top: 50%; left: 10px; transform: translateY(-50%); color: #8A8A8A; font-size: 12px; pointer-events: none; }
		.ui-statstable-search input { box-sizing: border-box; width: 100%; height: 32px; padding: 0 10px 0 30px; border: 1px solid #DCDCDC; border-radius: 8px; background: #FFF; color: inherit; font: inherit; }
		.ui-statstable-search input:focus { outline: 2px solid var(--color); outline-offset: -1px; border-color: transparent; }
		.ui-statstable-nosearch .ui-statstable-search { display: none; }
		.ui-statstable-notop .ui-statstable-top { display: none; }
		.ui-statstable-scroll { overflow-x: auto; }
		.ui-statstable-table { width: 100%; border-collapse: collapse; }
		.ui-statstable-table caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
		.ui-statstable-table th, .ui-statstable-table td { padding: 0 10px; height: 36px; border-bottom: 1px solid #EFEFEF; text-align: left; white-space: nowrap; }
		.ui-statstable-table th:first-child, .ui-statstable-table td:first-child { padding-left: 4px; }
		.ui-statstable-table th:last-child, .ui-statstable-table td:last-child { padding-right: 4px; }
		.ui-statstable-table thead th { height: 32px; color: #5E5E5E; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; border-bottom-color: #E3E3E3; }
		.ui-statstable-table .ui-statstable-right { text-align: right; }
		.ui-statstable-sort { display: inline-flex; align-items: center; gap: 4px; padding: 4px 0; border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
		.ui-statstable-sort:focus-visible { outline: 2px solid var(--color); outline-offset: 2px; border-radius: 3px; }
		.ui-statstable-sort i { width: 10px; font-size: 9px; opacity: 0; }
		.ui-statstable-sort:hover i { opacity: .5; }
		[aria-sort="ascending"] .ui-statstable-sort i, [aria-sort="descending"] .ui-statstable-sort i { opacity: 1; color: var(--color); }
		.ui-statstable-num { font-variant-numeric: tabular-nums; }
		.ui-statstable-text { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
		.ui-statstable-text a { color: inherit; text-decoration: none; }
		.ui-statstable-text a:hover { text-decoration: underline; }
		.ui-statstable-text a:focus-visible { outline: 2px solid var(--color); outline-offset: 2px; border-radius: 2px; }
		.ui-statstable-barcell { position: relative; min-width: 110px; }
		.ui-statstable-bar { position: absolute; top: 7px; bottom: 7px; right: 4px; border-radius: 4px; background: rgba(var(--rgb), .13); transition: width .35s ease-out; }
		.ui-statstable-barcell > span:last-child { position: relative; }
		.ui-statstable-delta i { margin-right: 2px; font-size: 10px; }
		.ui-statstable-good i { color: #0A8A0A; }
		.ui-statstable-bad i { color: #D03B3B; }
		.ui-statstable-spark { display: inline-block; vertical-align: middle; width: 90px; height: 22px; }
		.ui-statstable-spark path { fill: none; stroke: var(--color); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
		.ui-statstable-table tbody tr { transition: background .1s; }
		.ui-statstable-clickable tbody tr { cursor: pointer; }
		.ui-statstable-clickable tbody tr:hover { background: rgba(0, 0, 0, .03); }
		.ui-statstable-clickable tbody tr:focus-visible { outline: 2px solid var(--color); outline-offset: -2px; }
		.ui-statstable-table tfoot td { font-weight: 600; border-bottom: 0; border-top: 1px solid #E3E3E3; }
		.ui-statstable-nototals tfoot { display: none; }
		.ui-statstable-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; color: #5E5E5E; font-size: 12px; }
		.ui-statstable-foot:empty { display: none; }
		.ui-statstable-more { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--color); font: inherit; font-weight: 600; cursor: pointer; }
		.ui-statstable-more:hover { background: rgba(var(--rgb), .08); }
		.ui-statstable-more:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
		.ui-statstable-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
		.ui-statstable-empty { display: none; align-items: center; justify-content: center; gap: 8px; padding: 18px; color: #8A8A8A; }
		.ui-statstable-empty i { font-size: 18px; opacity: .7; }
		.ui-statstable-isempty .ui-statstable-empty { display: flex; }
		.ui-statstable-isempty .ui-statstable-table tbody, .ui-statstable-isempty .ui-statstable-table tfoot { display: none; }

		@media (prefers-reduced-motion: reduce) {
			.ui-statstable-bar, .ui-statstable-table tbody tr { transition: none; }
		}

		.ui-dark .ui-statstable { border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-statstable-minimal { border-color: transparent; background: transparent; }
		.ui-dark .ui-statstable-search input { border-color: #444; background: #1E1E1E; }
		.ui-dark .ui-statstable-table th, .ui-dark .ui-statstable-table td { border-bottom-color: #333; }
		.ui-dark .ui-statstable-table thead th { color: #ABABAB; border-bottom-color: #3A3A3A; }
		.ui-dark .ui-statstable-table tfoot td { border-top-color: #3A3A3A; }
		.ui-dark .ui-statstable-bar { background: rgba(var(--rgb), .25); }
		.ui-dark .ui-statstable-good i { color: #4CC94C; }
		.ui-dark .ui-statstable-bad i { color: #EE7B7B; }
		.ui-dark .ui-statstable-clickable tbody tr:hover { background: rgba(255, 255, 255, .04); }
		.ui-dark .ui-statstable-foot { color: #ABABAB; }

		@media (forced-colors: active) {
			.ui-statstable { border: 1px solid CanvasText; }
			.ui-statstable-bar { border: 1px solid CanvasText; }
			.ui-statstable-spark path { stroke: CanvasText; }
		}

	</style>

	<script component>

		COMPONENT('statstable', 'label:;style:card;search:;limit:0;more:;less:;sort:;totals:false;compact:true;currency:EUR;locale:;click:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var columns = [];
			var rows = [];
			var view = [];
			var sortby = null;
			var sortdir = -1;
			var query = '';
			var expanded = false;
			var fmt = {};
			var label = '';
			var collator = null;
			var NUMERIC = { number: 1, percent: 1, currency: 1, duration: 1, delta: 1 };

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			var safeurl = function(url) {
				url = url == null ? '' : (url + '').trim();
				return (/^(https?:\/\/|\/(?!\/)|\.{0,2}\/)/i).test(url) ? url : '';
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var intl = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, { maximumFractionDigits: options.maximumFractionDigits || 0 });
				}
			};

			// One formatter per column type and decimals, created once
			var formatter = function(type, decimals) {
				var key = type + '/' + decimals;
				if (fmt[key])
					return fmt[key];
				var opt = { minimumFractionDigits: 0, maximumFractionDigits: decimals };
				if (type === 'percent')
					opt.style = 'percent';
				else if (type === 'currency') {
					opt.style = 'currency';
					opt.currency = config.currency || 'EUR';
				} else if (type === 'delta') {
					opt.style = 'percent';
					opt.signDisplay = 'exceptZero';
				}
				fmt[key] = intl(opt);
				return fmt[key];
			};

			var compact = function(type) {
				var key = 'compact/' + type;
				if (!fmt[key])
					fmt[key] = intl(type === 'currency' ? { notation: 'compact', maximumFractionDigits: 1, style: 'currency', currency: config.currency || 'EUR' } : { notation: 'compact', maximumFractionDigits: 1 });
				return fmt[key];
			};

			var pad = function(n) {
				return n < 10 ? '0' + n : '' + n;
			};

			var duration = function(sec) {
				sec = Math.abs(sec);
				if (sec < 60)
					return formatter('number', 1).format(sec) + ' s';
				sec = Math.round(sec);
				var h = Math.floor(sec / 3600);
				var m = Math.floor((sec % 3600) / 60);
				var s = sec % 60;
				return h ? (h + ' h' + (m ? ' ' + pad(m) + ' m' : '')) : (m + ' m' + (s ? ' ' + pad(s) + ' s' : ''));
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			var format = function(column, value) {
				var n = num(value);
				if (n == null)
					return '—';
				var decimals = column.decimals == null ? (column.type === 'delta' ? 1 : 0) : column.decimals;
				switch (column.type) {
					case 'percent':
						return formatter('percent', decimals).format(n / 100);
					case 'delta':
						return formatter('delta', decimals).format(n / 100);
					case 'duration':
						return duration(n);
				}
				if (config.compact && Math.abs(n) >= 10000)
					return compact(column.type).format(n);
				return formatter(column.type === 'currency' ? 'currency' : 'number', decimals).format(n);
			};

			// { columns: [{ id, name, type, bar, goodup, decimals, align, url }], rows: [{...}] }
			var parse = function(value) {
				var src = value || {};
				var cols = src.columns instanceof Array ? src.columns : [];
				columns = [];
				for (var i = 0; i < cols.length; i++) {
					var c = cols[i] || {};
					if (c.id == null || c.hidden)
						continue;
					var type = c.type || 'text';
					columns.push({ id: c.id + '', name: c.name == null ? c.id + '' : c.name + '', type: type, bar: !!c.bar, goodup: c.goodup !== false, decimals: c.decimals == null ? null : +c.decimals, url: c.url ? c.url + '' : '', sortable: c.sortable !== false && type !== 'sparkline', right: c.align ? c.align === 'right' : !!NUMERIC[type] });
				}
				rows = src.rows instanceof Array ? src.rows.slice(0) : [];
				if (sortby && !columns.some(function(c) {
					return c.id === sortby;
				}))
					sortby = null;
			};

			var initsort = function() {
				var parts = (config.sort || '').split(' ');
				if (parts[0]) {
					sortby = parts[0];
					sortdir = parts[1] === 'asc' ? 1 : -1;
				}
			};

			var compute = function() {

				var list = rows;

				if (query) {
					var q = query.toLocaleLowerCase(locale());
					list = list.filter(function(row) {
						for (var i = 0; i < columns.length; i++) {
							if (columns[i].type === 'text' && row[columns[i].id] != null && (row[columns[i].id] + '').toLocaleLowerCase(locale()).indexOf(q) !== -1)
								return true;
						}
						return false;
					});
				}

				if (sortby) {
					var column = columns.filter(function(c) {
						return c.id === sortby;
					})[0];
					if (column) {
						var numeric = !!NUMERIC[column.type];
						list = list.slice(0).sort(function(a, b) {
							var x = a[sortby];
							var y = b[sortby];
							if (numeric) {
								x = num(x);
								y = num(y);
								// Empty values always go last
								if (x == null)
									return y == null ? 0 : 1;
								if (y == null)
									return -1;
								return (x - y) * sortdir;
							}
							return collator.compare(x == null ? '' : x + '', y == null ? '' : y + '') * sortdir;
						});
					}
				}

				view = list;
			};

			var spark = function(data) {
				var list = (data instanceof Array ? data : []).map(num);
				var values = list.filter(function(v) {
					return v != null;
				});
				if (values.length < 2)
					return '';
				var min = Math.min.apply(Math, values);
				var max = Math.max.apply(Math, values);
				var range = max - min || 1;
				var d = '';
				var move = true;
				for (var i = 0; i < list.length; i++) {
					if (list[i] == null) {
						move = true;
						continue;
					}
					d += (move ? 'M' : 'L') + (i / (list.length - 1) * 100).toFixed(1) + ',' + (4 + (1 - (list[i] - min) / range) * 92).toFixed(1);
					move = false;
				}
				return '<svg class="{0}-spark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="{1}" /></svg>'.format(cls, d);
			};

			var cellhtml = function(column, row, max) {
				var value = row[column.id];
				var align = column.right ? ' class="' + cls + '-right ' + cls + '-num"' : '';
				switch (column.type) {
					case 'sparkline':
						var list = (value instanceof Array ? value : []).map(num).filter(function(v) {
							return v != null;
						});
						var sr = list.length ? format({ type: 'number' }, list[0]) + ' → ' + format({ type: 'number' }, list[list.length - 1]) : '—';
						return '<td>{0}<span class="{2}-sr">{1}</span></td>'.format(spark(value), esc(sr), cls);
					case 'delta':
						var n = num(value);
						if (n == null)
							return '<td' + align + '>—</td>';
						var up = n > 0.05;
						var down = n < -0.05;
						var state = (column.goodup ? up : down) ? ' ' + cls + '-good' : (column.goodup ? down : up) ? ' ' + cls + '-bad' : '';
						return '<td class="{0}-right {0}-num {0}-delta{1}"><i class="ti {2}" aria-hidden="true"></i>{3}</td>'.format(cls, state, up ? 'ti-arrow-up' : down ? 'ti-arrow-down' : 'ti-minus', esc(format(column, n)));
					case 'text':
						var url = column.url ? safeurl(row[column.url]) : '';
						var text = esc(value == null ? '' : value);
						return '<td class="{0}-text">{1}</td>'.format(cls, url && !config.click ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>' : text);
				}
				if (column.bar) {
					var v = num(value);
					var width = v != null && max ? Math.max(0, v / max * 100) : 0;
					return '<td class="{0}-right {0}-num {0}-barcell"><span class="{0}-bar" style="width:calc({1}% - 8px)"></span><span>{2}</span></td>'.format(cls, width.toFixed(1), esc(format(column, value)));
				}
				return '<td' + align + '>' + esc(format(column, value)) + '</td>';
			};

			var render = function() {

				compute();

				var limit = config.limit > 0 && !expanded ? config.limit : view.length;
				var visible = view.slice(0, limit);
				var i, j, c;

				// Maximum per column with bars, over all the filtered rows
				var maxes = {};
				for (j = 0; j < columns.length; j++) {
					c = columns[j];
					if (!c.bar)
						continue;
					var m = 0;
					for (i = 0; i < view.length; i++)
						m = Math.max(m, num(view[i][c.id]) || 0);
					maxes[c.id] = m;
				}

				var head = [];
				for (j = 0; j < columns.length; j++) {
					c = columns[j];
					var sorted = sortby === c.id;
					var aria = sorted ? (sortdir === 1 ? 'ascending' : 'descending') : 'none';
					var icon = sorted && sortdir === 1 ? 'ti-arrow-up' : 'ti-arrow-down';
					if (c.sortable)
						head.push('<th scope="col" aria-sort="{0}"{1}><button type="button" class="{2}-sort" data-id="{3}">{4}<i class="ti {5}" aria-hidden="true"></i></button></th>'.format(aria, c.right ? ' class="' + cls + '-right"' : '', cls, esc(c.id), esc(c.name), icon));
					else
						head.push('<th scope="col"{0}>{1}</th>'.format(c.right ? ' class="' + cls + '-right"' : '', esc(c.name)));
				}

				var body = [];
				for (i = 0; i < visible.length; i++) {
					var row = visible[i];
					body.push('<tr data-index="{0}"{1}>'.format(i, config.click ? ' tabindex="0"' : ''));
					for (j = 0; j < columns.length; j++)
						body.push(cellhtml(columns[j], row, maxes[columns[j].id]));
					body.push('</tr>');
				}

				// Totals: the sum of number and currency columns, over the filtered rows
				var foot = [];
				if (config.totals) {
					for (j = 0; j < columns.length; j++) {
						c = columns[j];
						if (c.type === 'number' || c.type === 'currency') {
							var sum = 0;
							for (i = 0; i < view.length; i++)
								sum += num(view[i][c.id]) || 0;
							foot.push('<td class="{0}-right {0}-num">{1}</td>'.format(cls, esc(format(c, sum))));
						} else
							foot.push('<td></td>');
					}
				}

				var focused = document.activeElement && els.table.contains(document.activeElement) ? document.activeElement.getAttribute('data-id') : null;

				els.table.innerHTML = '<caption>' + esc(els.title.textContent.trim()) + '</caption><thead><tr>' + head.join('') + '</tr></thead><tbody>' + body.join('') + '</tbody>' + (foot.length ? '<tfoot><tr>' + foot.join('') + '</tr></tfoot>' : '');

				// The focus stays on the header that was used to sort
				if (focused) {
					var button = els.table.querySelector(cls2 + '-sort[data-id="' + focused + '"]');
					button && button.focus();
				}

				self.tclass(cls + '-isempty', !view.length);
				self.tclass(cls + '-nototals', !config.totals);

				var canmore = config.limit > 0 && view.length > config.limit;
				var showmore = canmore && (expanded ? !!config.less : !!config.more);
				els.foot.innerHTML = showmore ? '<button type="button" class="{0}-more" aria-expanded="{1}"><span>{2}</span><i class="ti {3}" aria-hidden="true"></i></button>'.format(cls, expanded ? 'true' : 'false', esc(expanded ? config.less : config.more), expanded ? 'ti-chevron-up' : 'ti-chevron-down') : '';
			};

			var setlabel = function() {
				els.title.innerHTML = config.label || label;
				var text = els.title.textContent.trim();
				self.tclass(cls + '-notitle', !text);
				self.tclass(cls + '-notop', !text && !config.search);
			};

			self.make = function() {

				label = self.html().trim();

				self.aclass(cls);
				self.html(('<div class="{0}-top"><div class="{0}-title"></div><label class="{0}-search"><i class="ti ti-search" aria-hidden="true"></i><input type="search" /></label></div>' +
					'<div class="{0}-scroll"><table class="{0}-table"></table></div>' +
					'<div class="{0}-empty"><i class="ti ti-table" aria-hidden="true"></i></div>' +
					'<div class="{0}-foot"></div>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.input = self.find(cls2 + '-search input')[0];
				els.table = self.find(cls2 + '-table')[0];
				els.foot = self.find(cls2 + '-foot')[0];

				try {
					collator = new Intl.Collator(locale(), { numeric: true, sensitivity: 'base' });
				} catch (e) {
					collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
				}

				initsort();

				self.event('click', cls2 + '-sort', function() {
					var id = this.getAttribute('data-id');
					var column = columns.filter(function(c) {
						return c.id === id;
					})[0];
					if (sortby === id)
						sortdir = -sortdir;
					else {
						sortby = id;
						// Numbers start from the biggest, texts from A
						sortdir = column && NUMERIC[column.type] ? -1 : 1;
					}
					render();
				});

				self.event('input', cls2 + '-search input', function() {
					query = this.value.trim();
					setTimeout2(self.ID + 'search', render, 150);
				});

				self.event('click', cls2 + '-more', function() {
					expanded = !expanded;
					render();
					var more = els.foot.querySelector('button');
					more && more.focus();
				});

				var run = function(tr) {
					var row = view[+tr.getAttribute('data-index')];
					row && config.click && self.EXEC(config.click, row, self);
				};

				self.event('click', 'tbody tr', function(e) {
					if (e.target.closest && e.target.closest('a'))
						return;
					run(this);
				});

				self.event('keydown', 'tbody tr', function(e) {
					if (!config.click)
						return;
					if (e.key === 'Enter' || e.key === ' ') {
						e.preventDefault();
						run(this);
					} else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
						e.preventDefault();
						var next = e.key === 'ArrowDown' ? this.nextElementSibling : this.previousElementSibling;
						next && next.focus();
					}
				});
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						setlabel();
						!init && render();
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'search':
						els.input.setAttribute('placeholder', value || '');
						els.input.setAttribute('aria-label', value || '');
						self.tclass(cls + '-nosearch', !value);
						setlabel();
						break;
					case 'click':
						self.tclass(cls + '-clickable', !!value);
						!init && render();
						break;
					case 'sort':
						if (!init) {
							initsort();
							render();
						}
						break;
					case 'currency':
					case 'locale':
					case 'compact':
						fmt = {};
						!init && render();
						break;
					case 'limit':
					case 'more':
					case 'less':
					case 'totals':
						!init && render();
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				render();
			};

			self.destroy = function() {
				clearTimeout2(self.ID + 'search');
			};

		});

	</script>

		// The first table is small: page and views
		SET('tables.pages', { columns: columns.slice(0, 2), rows: pages.slice(0, 4) });

		SET('tables.full', {
			columns: [
				{ id: 'page', name: 'Page', type: 'text', url: 'url' },
				{ id: 'views', name: 'Views', type: 'number', bar: true },
