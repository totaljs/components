<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-backup { display: flex; width: 180px; justify-content: space-between; border-radius: var(--radius); overflow: hidden; font-size: 12px; }
		.ui-backup button { display: block; width: 50%; height: 26px; line-height: 26px; border: 0; transition: all .2s ease-in-out; background-color: #f0f0f0; }
		.ui-backup button i { margin-right: 5px; color: #555d; }
		.ui-backup button:hover { background-color: #dfdfdf; }
		.ui-backup button:first-child { border-right: 1px solid #fff; }

		.ui-dark .ui-backup { border: 0; }
		.ui-dark .ui-backup button { background-color: #505050; color: #fff;  }
		.ui-dark .ui-backup button i { margin-right: 5px; color: #fff; }
		.ui-dark .ui-backup button:hover { background-color: #5f5f5f;  }
		.ui-dark .ui-backup button:first-child { border-right: 1px solid #000; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('backup', 'expire:1 day;btnsave:SAVE;btnload:LOAD', function(self, config, cls) {
			self.make = function() {
				self.aclass(cls);
				self.append('<button name="save"><i class="ti ti-cloud-upload"></i>{{ btnsave }}</button><button name="load"><i class="ti ti-download"></i>{{ btnload }}</button>'.args(config));
				self.event('click', 'button', function() {
					var name = this.name;
					switch (name) {
						case 'load':
							var item = CACHE(self.path);
							item && self.set(item);
							break;
						case 'save':
							var value = self.get();
							CACHE(self.path, value, config.expire);
							break;
					}
					config.exec && self.SEEX(config.exec, name);
				});
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="backup" path="userform" class="m"></ui-component>

	<ui-plugin path="userform">
		<div class="row">
			<div class="col-xs-6 m">
				<ui-component name="input" path="?.firstname">First name</ui-component>
			</div>
			<div class="col-xs-6 m">
				<ui-component name="input" path="?.lastname">Last name</ui-component>
			</div>
		</div>
	</ui-plugin>

</body>
</html>
