<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-stash {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('stash', 'internal:false;class:hidden', function(self, config, cls) {

			var repo = document.createElement('DIV');
			var compiled = {};
			var loaded = {};
			var curr;

			self.readonly();

			self.make = function() {

				if (!config.internal) {
					$(repo).aclass(config.class).css({ left: '-1000px', top: '-1000px', position: 'absolute' });
					document.body.insertBefore(repo, document.body.children[0]);
				}

				self.aclass(cls);
			};

			self.clear = function(id) {

				if (id) {

					if (loaded[id]) {

						var refresh = false;

						if (curr && curr.getAttribute('data-id') === id) {
							self.dom.removeChild(curr);
							curr = null;
							refresh = true;
						}

						delete loaded[id];
						delete compiled[id];

						for (var i = 0; i < repo.children.length; i++) {
							var child = repo.children[i];
							if (child.getAttribute('data-id') === id) {
								repo.removeChild(child);
								break;
							}
						}

						FREE();

						refresh && setTimeout(function() {
							self.refresh();
						}, 500);
					}

					return;
				}

				loaded = {};
				compiled = {};
				curr = null;

				while (self.dom.children.length)
					self.dom.removeChild(self.dom.children[0]);

				while (repo.children.length)
					repo.removeChild(repo.children[0]);

				if (config.internal && repo.parentNode)
					document.body.removeChild(repo);

				FREE();
			};

			self.destroy = function() {
				if (!config.internal && repo.parentNode)
					document.body.removeChild(repo);
				loaded = null;
				compiled = null;
			};

			self.add = self.register = function(id, body) {

				var div = document.createElement('DIV');
				div.setAttribute('data-id', id);
				div.setAttribute('class', cls + '-item');

				if (typeof(body) === 'string') {
					var el = $(body);
					for (var i = 0; i < el.length; i++)
						div.appendChild(el[i]);
				} else
					div.appendChild(body);

				repo.appendChild(div);
				self.refresh();
			};

			self.setter = function(value) {

				var children = repo.children;

				if (curr) {
					var currid = curr.getAttribute('data-id');
					if (value && currid === value)
						return;
					repo.appendChild(curr);
				}

				if (value) {
					for (var i = 0; i < children.length; i++) {
						var child = children[i];

						if (child.getAttribute('data-id') === value) {

							curr = child;
							self.dom.appendChild(child);

							if (!compiled[value]) {
								COMPILE();
								compiled[value] = 1;
							}

							return;
						}
					}

					// not found, tries to load
					if (!loaded[value]) {
						loaded[value] = 1;
						config.load && self.EXEC(config.load, value, function(response) {
							response && self.add(value, response);
						});
					}

				}
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="stash" path="common.id" config="load:loadcontent"></ui-component>

	<script>

		var common = {};

		function loadcontent(id, next) {
			// next(html/element)
			console.log('LOAD:', id);
			next('<div>{0}</div>'.format(id));
		}

		setTimeout(function() {
			SET('common.id', 'component_settings_1');
		}, 1000);

		setTimeout(function() {
			SET('common.id', 'component_settings_2');
		}, 3000);

		setTimeout(function() {
			SET('common.id', 'component_settings_3');
		}, 6000);

		setTimeout(function() {
			SET('common.id', 'component_settings_1');
		}, 9000);

	</script>

</body>
</html>
