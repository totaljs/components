<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-splashscreen { position: fixed; left: 0; top: 0; bottom: 0; right: 0; overflow: hidden; background-color: #E0E0E0; z-index: 1000; transition: all 0.3s; color: #A0A0A0; }
		.ui-dark .ui-splashscreen { background-color: #000; }
		.ui-splashscreen > div { display: table; width: 80%; height: 100%; margin: 0 auto; }
		.ui-splashscreen-body { display: table-cell; vertical-align: middle; text-align: center; transition: all 0.5s; opacity: 0.5; transform: scale(1.4); }
		.ui-splashscreen-body p { margin: 10px 0 0; font-size: 14px; padding: 0; }
		.ui-splashscreen-animate .ui-splashscreen-body { opacity: 1; transform: scale(1); }
		.ui-splashscreen-animate .fa-spin { animation-duration: 1.3s; }
		.ui-splashscreen-animate { background-color: #FFF; }
		.ui-dark .ui-splashscreen-animate { background-color: #202020; }
		.ui-splashscreen-removing { opacity: 0; transform: scale(0.5); }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('splashscreen', 'timeout:3000;autoremove:1', function(self, config, cls) {

			var cls2 = '.' + cls;

			self.readonly();
			self.singleton();

			self.make = function() {

				if (config.remember) {
					var val = CACHE(self.ID);
					if (val) {
						self.rclass(cls);
						self.remove();
						return;
					}
					CACHE(self.ID, '1', config.remember);
				}

				self.aclass(cls);
				self.html('<div><div class="{0}-body">{1}</div></div>'.format(cls, self.find('script').html()));
				self.show();
			};

			self.show = function(body) {

				body && self.find(cls2 + '-body').html(body);
				self.rclass('hidden invisible');

				setTimeout(function() {
					self.aclass(cls + '-animate');
				}, 100);

				setTimeout(function() {
					self.aclass(cls + '-removing');
					setTimeout(function() {
						if (config.autoremove)
							self.remove();
						else
							self.aclass('hidden');
						self.rclass(cls + '-removing', 100);
					}, 500);
				}, config.timeout);
			};

		});

	</script>

	<!-- Example -->
	<style>
		html,body { height: 100%; overflow: hidden; padding: 0; margin: 0; }
		body { background-color: #F0F0F0; }
	</style>

	<ui-component name="splashscreen" class="ui-splashscreen">
		<script type="text/html">
			<div><img src="https://www.totaljs.com/download/B20200120T000000011.png" alt="Total.js Framework" border="0" /></div>
			<br />
			<p>Total.js framework is a server-side framework for Node.js<br /><b>Better than sex</b></p>
		</script>
	</ui-component>

	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>
	<div>Lorem ipsum</div>

</body>
</html>
