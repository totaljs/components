<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-vitals { --vtgood: #0CA30C; --vtwarn: #E09A00; --vtbad: #D03B3B; container-type: inline-size; box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }
		.ui-vitals-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-vitals-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; margin-bottom: 14px; }
		.ui-vitals-title { font-weight: 600; font-size: 14px; }
		.ui-vitals-notitle .ui-vitals-title { display: none; }
		.ui-vitals-assessment { display: none; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-weight: 600; font-size: 12px; }
		.ui-vitals-passed .ui-vitals-assessment, .ui-vitals-failed .ui-vitals-assessment { display: inline-flex; }
		.ui-vitals-passed .ui-vitals-assessment { background: rgba(12, 163, 12, .12); }
		.ui-vitals-passed .ui-vitals-assessment i { color: var(--vtgood); }
		.ui-vitals-failed .ui-vitals-assessment { background: rgba(208, 59, 59, .12); }
		.ui-vitals-failed .ui-vitals-assessment i { color: var(--vtbad); }
		.ui-vitals-noassessment .ui-vitals-assessment { display: none !important; }
		.ui-vitals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
		.ui-vitals-metric { min-width: 0; padding: 12px 14px; border: 1px solid #EBEBEB; border-radius: 10px; }
		.ui-vitals-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
		.ui-vitals-head b { font-size: 13px; letter-spacing: .02em; }
		.ui-vitals-state { display: inline-flex; align-items: center; gap: 4px; min-width: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; }
		.ui-vitals-good .ui-vitals-state i { color: var(--vtgood); }
		.ui-vitals-warn .ui-vitals-state i { color: var(--vtwarn); }
		.ui-vitals-bad .ui-vitals-state i { color: var(--vtbad); }
		.ui-vitals-name { margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5E5E5E; font-size: 12px; }
		.ui-vitals-value { margin: 8px 0 10px; font-size: 26px; font-weight: 600; letter-spacing: -.01em; line-height: 1.1; }
		.ui-vitals-value small { margin-left: 3px; color: #5E5E5E; font-size: 13px; font-weight: normal; }
		.ui-vitals-dist { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; background: #EDEDED; }
		.ui-vitals-dist span { min-width: 0; transition: flex-grow .4s ease-out; }
		.ui-vitals-dist span:nth-child(1) { background: var(--vtgood); }
		.ui-vitals-dist span:nth-child(2) { background: var(--vtwarn); }
		.ui-vitals-dist span:nth-child(3) { background: var(--vtbad); }
		.ui-vitals-legend { display: flex; justify-content: space-between; gap: 6px; margin-top: 6px; color: #5E5E5E; font-size: 11px; font-variant-numeric: tabular-nums; }
		.ui-vitals-legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
		.ui-vitals-legend i { width: 8px; height: 8px; border-radius: 2px; }
		.ui-vitals-legend span:nth-child(1) i { background: var(--vtgood); }
		.ui-vitals-legend span:nth-child(2) i { background: var(--vtwarn); transform: rotate(45deg) scale(.85); }
		.ui-vitals-legend span:nth-child(3) i { background: var(--vtbad); border-radius: 50%; }
		.ui-vitals-nodist .ui-vitals-dist, .ui-vitals-nodist .ui-vitals-legend { display: none; }
		.ui-vitals-thresholds { margin-top: 6px; color: #8A8A8A; font-size: 11px; font-variant-numeric: tabular-nums; }
		.ui-vitals-nothresholds .ui-vitals-thresholds { display: none; }
		.ui-vitals-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

		/* Narrow boxes: one compact row per metric */
		@container (max-width: 420px) {
			.ui-vitals-top { margin-bottom: 6px; }
			.ui-vitals-grid { gap: 0; }
			.ui-vitals-metric { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; column-gap: 10px; row-gap: 6px; padding: 9px 0; border: 0; border-bottom: 1px solid #EBEBEB; border-radius: 0; }
			.ui-vitals-metric:last-child { border-bottom: 0; }
			.ui-vitals-head { display: contents; }
			.ui-vitals-head b { grid-column: 1; grid-row: 1; }
			.ui-vitals-value { grid-column: 2; grid-row: 1; margin: 0; font-size: 17px; }
			.ui-vitals-state { grid-column: 3; grid-row: 1; }
			.ui-vitals-dist { grid-column: 1 / -1; height: 6px; }
			.ui-vitals-name, .ui-vitals-legend, .ui-vitals-thresholds { display: none; }
		}
		.ui-dark .ui-vitals-metric { border-bottom-color: #3A3A3A; }

		@media (prefers-reduced-motion: reduce) {
			.ui-vitals-dist span { transition: none; }
		}

		.ui-dark .ui-vitals { --vtgood: #4CC94C; --vtwarn: #FAB219; --vtbad: #EE6B6B; border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-vitals-minimal { border-color: transparent; background: transparent; }
		.ui-dark .ui-vitals-metric { border-color: #3A3A3A; }
		.ui-dark .ui-vitals-name, .ui-dark .ui-vitals-value small, .ui-dark .ui-vitals-legend { color: #ABABAB; }
		.ui-dark .ui-vitals-dist { background: #3A3A3A; }

		@media (forced-colors: active) {
			.ui-vitals, .ui-vitals-metric { border: 1px solid CanvasText; }
			.ui-vitals-dist span, .ui-vitals-legend i { forced-color-adjust: none; }
		}

	</style>

	<script component>

		COMPONENT('vitals', 'label:;style:card;metrics:lcp,inp,cls;states:;assessment:;distribution:true;thresholds:true;locale:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var model = {};
			var label = '';

			// The thresholds of web.dev at the 75th percentile: good up to the first, poor from the second
			var METRICS = {
				lcp: { name: 'Largest Contentful Paint', good: 2500, poor: 4000, unit: 's', core: true },
				inp: { name: 'Interaction to Next Paint', good: 200, poor: 500, unit: 'ms', core: true },
				cls: { name: 'Cumulative Layout Shift', good: 0.1, poor: 0.25, unit: '', core: true },
				fcp: { name: 'First Contentful Paint', good: 1800, poor: 3000, unit: 's' },
				ttfb: { name: 'Time to First Byte', good: 800, poor: 1800, unit: 's' }
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var nf = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, options);
				}
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			// Milliseconds as seconds for LCP, FCP and TTFB (2.1 s), INP in ms, CLS without a unit
			var value = function(key, n) {
				var m = METRICS[key];
				if (n == null)
					return { number: '—', unit: '' };
				if (m.unit === 's')
					return { number: nf({ minimumFractionDigits: 1, maximumFractionDigits: n < 1000 ? 2 : 1 }).format(n / 1000), unit: 's' };
				if (m.unit === 'ms')
					return { number: nf({ maximumFractionDigits: 0 }).format(n), unit: 'ms' };
				return { number: nf({ minimumFractionDigits: 2, maximumFractionDigits: 3 }).format(n), unit: '' };
			};

			var state = function(key, n) {
				var m = METRICS[key];
				return n == null ? '' : n <= m.good ? 'good' : n <= m.poor ? 'warn' : 'bad';
			};

			var statetext = function(s) {
				var list = (config.states || '').split('|');
				return s === 'bad' ? list[0] || '' : s === 'warn' ? list[1] || '' : s === 'good' ? list[2] || '' : '';
			};

			var icon = function(s) {
				return s === 'good' ? 'ti-check-circle' : s === 'warn' ? 'ti-exclamation-triangle' : 'ti-times-circle';
			};

			var metrics = function() {
				return (config.metrics || '').split(',').map(function(k) {
					return k.trim().toLowerCase();
				}).filter(function(k) {
					return !!METRICS[k];
				});
			};

			var render = function() {

				var keys = metrics();
				var builder = [];
				var share = nf({ style: 'percent', maximumFractionDigits: 0 });
				var core = 0;
				var corepassed = 0;

				for (var i = 0; i < keys.length; i++) {

					var key = keys[i];
					var m = METRICS[key];
					var src = model[key];
					var data = src != null && typeof src === 'object' ? src : { p75: src };
					var p75 = num(data.p75 != null ? data.p75 : data.value);
					var s = state(key, p75);
					var v = value(key, p75);
					var text = statetext(s);

					if (m.core && p75 != null) {
						core++;
						s === 'good' && corepassed++;
					}

					// The distribution: shares of good, needs improvement and poor (percent or counts)
					var g = num(data.good) || 0;
					var w = num(data.ni != null ? data.ni : data.warn) || 0;
					var b = num(data.poor) || 0;
					var sum = g + w + b;
					var dist = sum > 0;

					var good = value(key, m.good);
					var poor = value(key, m.poor);

					builder.push(('<li class="{0}-metric{1}" role="group" aria-label="{2}">' +
						'<div class="{0}-head"><b>{3}</b><span class="{0}-state"{4}><i class="ti {5}" aria-hidden="true"></i><span>{6}</span></span></div>' +
						'<div class="{0}-name" aria-hidden="true">{7}</div>' +
						'<div class="{0}-value">{8}{9}<span class="{0}-sr">{10}</span></div>' +
						'{11}' +
						'<div class="{0}-thresholds">≤ {12} · {13} {14}</div></li>').format(
						cls, s ? ' ' + cls + '-' + s : '', esc(key.toUpperCase() + ', ' + m.name), key.toUpperCase(),
						s ? '' : ' style="visibility:hidden"', icon(s), esc(text),
						esc(m.name), esc(v.number), v.unit ? '<small>' + v.unit + '</small>' : '', esc(text ? ', ' + text : ''),
						dist ? ('<div class="{0}-dist" aria-hidden="true"><span style="flex-grow:{1}"></span><span style="flex-grow:{2}"></span><span style="flex-grow:{3}"></span></div>' +
							'<div class="{0}-legend"><span><i aria-hidden="true"></i>{4}</span><span><i aria-hidden="true"></i>{5}</span><span><i aria-hidden="true"></i>{6}</span></div>').format(cls, g, w, b, share.format(g / sum), share.format(w / sum), share.format(b / sum)) : '',
						esc(good.number + (good.unit ? ' ' + good.unit : '')), '>', esc(poor.number + (poor.unit ? ' ' + poor.unit : ''))));
				}

				els.grid.innerHTML = builder.join('');

				// The assessment of the three core metrics: passed when all of them are good
				var parts = (config.assessment || '').split('|');
				var passed = core > 0 && core === corepassed;
				self.tclass(cls + '-passed', core > 0 && passed);
				self.tclass(cls + '-failed', core > 0 && !passed);
				self.tclass(cls + '-noassessment', !config.assessment);
				els.assessicon.className = 'ti ' + (passed ? 'ti-check-circle' : 'ti-times-circle');
				els.assesstext.textContent = passed ? parts[1] || '' : parts[0] || '';
			};

			self.make = function() {
				label = self.html().trim();
				self.aclass(cls);
				self.attr('role', 'region');
				self.html(('<div class="{0}-top"><div class="{0}-title"></div><div class="{0}-assessment"><i aria-hidden="true"></i><span></span></div></div>' +
					'<ul class="{0}-grid"></ul>').format(cls));
				els.title = self.find(cls2 + '-title')[0];
				els.grid = self.find(cls2 + '-grid')[0];
				els.assessicon = self.find(cls2 + '-assessment i')[0];
				els.assesstext = self.find(cls2 + '-assessment span')[0];
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						els.title.innerHTML = value || label;
						var text = els.title.textContent.trim();
						self.tclass(cls + '-notitle', !text);
						text ? self.attr('aria-label', text) : self.dom.removeAttribute('aria-label');
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'distribution':
						self.tclass(cls + '-nodist', !value);
						break;
					case 'thresholds':
						self.tclass(cls + '-nothresholds', !value);
						break;
					case 'metrics':
					case 'states':
					case 'assessment':
					case 'locale':
						!init && render();
						break;
				}
			};

			self.setter = function(value) {
				model = value && typeof value === 'object' ? value : {};
				render();
			};

		});

	</script>

	<div style="max-width:960px;padding:12px;display:grid;gap:16px">

		<ui-component name="vitals" path="web.vitals" config="states:Poor|Needs improvement|Good;assessment:Failed|Passed">Core Web Vitals</ui-component>

		<ui-component name="vitals" path="web.mobile" config="metrics:lcp,inp,cls,fcp,ttfb;states:Poor|Needs improvement|Good;assessment:Failed|Passed;thresholds:false">Mobile, all metrics</ui-component>

		<ui-component name="vitals" path="web.compact" config="style:minimal;distribution:false;metrics:lcp,cls">Home page</ui-component>

	</div>

	<script>

		SET('web.vitals', {
			lcp: { p75: 2140, good: 78, ni: 15, poor: 7 },
			inp: { p75: 168, good: 84, ni: 12, poor: 4 },
			cls: { p75: 0.04, good: 91, ni: 6, poor: 3 }
		});

		SET('web.mobile', {
			lcp: { p75: 3120, good: 58, ni: 29, poor: 13 },
			inp: { p75: 240, good: 66, ni: 26, poor: 8 },
			cls: { p75: 0.08, good: 83, ni: 12, poor: 5 },
			fcp: { p75: 1620, good: 79, ni: 16, poor: 5 },
			ttfb: { p75: 1950, good: 41, ni: 38, poor: 21 }
		});

		// A plain value per metric works too
		SET('web.compact', { lcp: 1830, cls: 0.12 });

	</script>

</body>
</html>
