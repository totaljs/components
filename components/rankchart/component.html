<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-rankchart { box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }
		.ui-rankchart-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-rankchart-title { margin-bottom: 12px; font-weight: 600; font-size: 14px; }
		.ui-rankchart-notitle .ui-rankchart-title { display: none; }
		.ui-rankchart-columns { display: none; gap: 12px; padding: 0 10px 6px; color: #5E5E5E; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
		.ui-rankchart-hascolumns .ui-rankchart-columns { display: flex; }
		.ui-rankchart-columns span:first-child { flex: 1 1 auto; }
		.ui-rankchart-list { margin: 0; padding: 0; list-style: none; }
		.ui-rankchart-list li { margin: 0 0 3px; }
		.ui-rankchart-row { position: relative; display: flex; align-items: center; gap: 12px; box-sizing: border-box; width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left; overflow: hidden; }
		button.ui-rankchart-row { cursor: pointer; }
		button.ui-rankchart-row:hover { background: rgba(0, 0, 0, .04); }
		.ui-rankchart-row:focus-visible { outline: 2px solid var(--color); outline-offset: -2px; }
		.ui-rankchart-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 6px; background: rgba(var(--rgb), .13); transition: width .45s ease-out; pointer-events: none; }
		.ui-rankchart-main { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; padding: 7px 0; }
		.ui-rankchart-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
		.ui-rankchart-head i { flex: 0 0 auto; width: 16px; text-align: center; color: #5E5E5E; }
		.ui-rankchart-head img { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 3px; object-fit: cover; }
		.ui-rankchart-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit; text-decoration: none; }
		a.ui-rankchart-name:hover { text-decoration: underline; }
		a.ui-rankchart-name:focus-visible { outline: 2px solid var(--color); outline-offset: 2px; border-radius: 2px; }
		.ui-rankchart-sub { min-width: 0; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #5E5E5E; font-size: 12px; }
		.ui-rankchart-track { display: none; height: 4px; margin-top: 6px; border-radius: 4px; background: rgba(var(--rgb), .12); overflow: hidden; }
		.ui-rankchart-track span { display: block; width: 0; height: 100%; border-radius: 4px; background: var(--color); transition: width .45s ease-out; }
		.ui-rankchart-line .ui-rankchart-fill { display: none; }
		.ui-rankchart-line .ui-rankchart-track { display: block; }
		.ui-rankchart-end { position: relative; display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
		.ui-rankchart-value { min-width: 52px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
		.ui-rankchart-share { min-width: 46px; text-align: right; color: #5E5E5E; font-variant-numeric: tabular-nums; }
		.ui-rankchart-noshare .ui-rankchart-share { display: none; }
		.ui-rankchart-delta { display: inline-flex; align-items: center; gap: 2px; min-width: 58px; justify-content: flex-end; font-size: 12px; font-variant-numeric: tabular-nums; }
		.ui-rankchart-delta i { font-size: 10px; }
		.ui-rankchart-good i { color: #0A8A0A; }
		.ui-rankchart-bad i { color: #D03B3B; }
		.ui-rankchart-more { display: none; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--color); font: inherit; font-weight: 600; cursor: pointer; }
		.ui-rankchart-more:hover { background: rgba(var(--rgb), .08); }
		.ui-rankchart-more:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
		.ui-rankchart-hasmore .ui-rankchart-more { display: inline-flex; }
		.ui-rankchart-empty { display: none; align-items: center; gap: 8px; padding: 10px; color: #8A8A8A; }
		.ui-rankchart-empty i { font-size: 18px; opacity: .7; }
		.ui-rankchart-isempty .ui-rankchart-empty { display: flex; }

		/* Narrow boxes: the name keeps the space, the share goes away */
		.ui-rankchart { container-type: inline-size; }
		@container (max-width: 380px) {
			.ui-rankchart-share { display: none; }
			.ui-rankchart-delta { min-width: 0; }
			.ui-rankchart-value { min-width: 40px; }
			.ui-rankchart-end { gap: 8px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.ui-rankchart-fill, .ui-rankchart-track span { transition: none; }
		}

		.ui-dark .ui-rankchart { border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-rankchart-minimal { border-color: transparent; background: transparent; }
		.ui-dark .ui-rankchart-columns, .ui-dark .ui-rankchart-sub, .ui-dark .ui-rankchart-share, .ui-dark .ui-rankchart-head i { color: #ABABAB; }
		.ui-dark button.ui-rankchart-row:hover { background: rgba(255, 255, 255, .05); }
		.ui-dark .ui-rankchart-fill { background: rgba(var(--rgb), .24); }
		.ui-dark .ui-rankchart-track { background: rgba(var(--rgb), .2); }
		.ui-dark .ui-rankchart-good i { color: #4CC94C; }
		.ui-dark .ui-rankchart-bad i { color: #EE7B7B; }
		.ui-dark .ui-rankchart-more:hover { background: rgba(var(--rgb), .16); }

		@media (forced-colors: active) {
			.ui-rankchart { border: 1px solid CanvasText; }
			.ui-rankchart-fill { border: 1px solid CanvasText; }
			.ui-rankchart-track span { background: CanvasText; }
		}

	</style>

	<script component>

		COMPONENT('rankchart', 'label:;bars:fill;style:card;color:;limit:10;more:;less:;columns:;sort:true;share:true;goodup:true;format:number;decimals:0;compact:true;currency:EUR;locale:;click:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var items = [];
			var total = 0;
			var expanded = false;
			var fmt = {};
			var label = '';

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			// Only web links: no "javascript:" or other schemes from the data
			var safeurl = function(url) {
				url = url == null ? '' : (url + '').trim();
				return (/^(https?:\/\/|\/(?!\/)|\.{0,2}\/)/i).test(url) ? url : '';
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var intl = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, { maximumFractionDigits: options.maximumFractionDigits || 0 });
				}
			};

			var prepare = function() {
				var decimals = Math.max(0, config.decimals || 0);
				var opt = { minimumFractionDigits: 0, maximumFractionDigits: decimals };
				var copt = { notation: 'compact', maximumFractionDigits: 1 };
				if (config.format === 'percent')
					opt.style = 'percent';
				else if (config.format === 'currency') {
					opt.style = copt.style = 'currency';
					opt.currency = copt.currency = config.currency || 'EUR';
				}
				fmt.full = intl(opt);
				fmt.compact = config.compact ? intl(copt) : null;
				fmt.share = intl({ style: 'percent', maximumFractionDigits: 1 });
				fmt.delta = intl({ style: 'percent', maximumFractionDigits: 0, signDisplay: 'exceptZero' });
			};

			var pad = function(n) {
				return n < 10 ? '0' + n : '' + n;
			};

			var duration = function(sec) {
				sec = Math.abs(sec);
				// Under a minute the decimals of the configuration are kept: 4.2 s
				if (sec < 60)
					return fmt.full.format(sec) + ' s';
				sec = Math.round(sec);
				var h = Math.floor(sec / 3600);
				var m = Math.floor((sec % 3600) / 60);
				var s = sec % 60;
				return h ? (h + ' h' + (m ? ' ' + pad(m) + ' m' : '')) : m ? (m + ' m' + (s ? ' ' + pad(s) + ' s' : '')) : (s + ' s');
			};

			var format = function(n) {
				if (config.format === 'duration')
					return duration(n);
				if (config.format === 'percent')
					return fmt.full.format(n / 100);
				return (fmt.compact && Math.abs(n) >= 10000 ? fmt.compact : fmt.full).format(n);
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			var parse = function(value) {
				var src = value instanceof Array ? value : value && value.items instanceof Array ? value.items : [];
				var list = [];
				for (var i = 0; i < src.length; i++) {
					var item = src[i] || {};
					var n = num(item.value);
					if (n != null && n >= 0)
						list.push({ item: item, name: item.name == null ? '' : item.name + '', value: n, previous: num(item.previous) });
				}
				if (config.sort) {
					list.sort(function(a, b) {
						return b.value - a.value;
					});
				}
				total = 0;
				for (var j = 0; j < list.length; j++)
					total += list[j].value;
				items = list;
			};

			// The key of a row keeps the same DOM node between updates, so the bars move instead of jumping
			var keyof = function(entry, index) {
				var item = entry.item;
				return item.id != null ? 'i' + item.id : entry.name ? 'n' + entry.name : 'x' + index;
			};

			var rowhtml = function(entry, index) {
				var item = entry.item;
				var tag = config.click ? 'button' : 'div';
				var url = config.click ? '' : safeurl(item.url);
				var icon = item.image ? '<img src="{0}" alt="" loading="lazy" />'.format(esc(item.image)) : item.icon ? '<i class="{0}" aria-hidden="true"></i>'.format(esc(self.icon(item.icon))) : '';
				var name = url ? '<a class="{0}-name" href="{1}" target="_blank" rel="noopener noreferrer"></a>'.format(cls, esc(url)) : '<span class="{0}-name"></span>'.format(cls);
				return ('<{1} {2}class="{0}-row" data-index="{3}"><span class="{0}-fill" aria-hidden="true"></span><span class="{0}-main"><span class="{0}-head">{4}{5}</span><span class="{0}-sub"></span><span class="{0}-track" aria-hidden="true"><span></span></span></span>' +
					'<span class="{0}-end"><span class="{0}-delta"><i aria-hidden="true"></i><span></span></span><span class="{0}-value"></span><span class="{0}-share"></span></span></{1}>').format(cls, tag, tag === 'button' ? 'type="button" ' : '', index, icon, name);
			};

			var fill = function(li, entry, index, max, anydelta) {

				var row = li.firstChild;
				var item = entry.item;
				var width = max ? (entry.value / max * 100).toFixed(2) + '%' : '0';

				row.setAttribute('data-index', index);
				li.querySelector(cls2 + '-name').textContent = entry.name || '—';

				var sub = li.querySelector(cls2 + '-sub');
				sub.textContent = item.sub == null ? '' : item.sub + '';
				sub.style.display = item.sub == null || item.sub === '' ? 'none' : '';

				li.querySelector(cls2 + '-value').textContent = format(entry.value);
				li.querySelector(cls2 + '-share').textContent = total ? fmt.share.format(entry.value / total) : '';
				li.querySelector(cls2 + '-fill').style.width = width;
				li.querySelector(cls2 + '-track span').style.width = width;

				var delta = li.querySelector(cls2 + '-delta');
				var diff = entry.previous != null && entry.previous > 0 ? (entry.value - entry.previous) / entry.previous * 100 : null;
				// The column stays when another row has a change, so the values keep aligned
				delta.style.display = anydelta ? '' : 'none';
				delta.style.visibility = diff == null ? 'hidden' : '';
				if (diff != null) {
					var up = diff > 0.5;
					var down = diff < -0.5;
					delta.className = cls + '-delta' + ((config.goodup ? up : down) ? ' ' + cls + '-good' : (config.goodup ? down : up) ? ' ' + cls + '-bad' : '');
					delta.firstChild.className = up ? 'ti ti-arrow-up' : down ? 'ti ti-arrow-down' : 'ti ti-minus';
					delta.lastChild.textContent = fmt.delta.format(diff / 100);
				}
			};

			var render = function() {

				var limit = config.limit > 0 && !expanded ? config.limit : items.length;
				var visible = items.slice(0, limit);
				var max = 0;
				var old = {};
				var nodes = els.list.children;
				var i;

				var anydelta = false;

				for (i = 0; i < items.length; i++) {
					max = Math.max(max, items[i].value);
					if (items[i].previous != null && items[i].previous > 0)
						anydelta = true;
				}

				for (i = 0; i < nodes.length; i++)
					old[nodes[i].getAttribute('data-key')] = nodes[i];

				var used = {};

				for (i = 0; i < visible.length; i++) {
					var key = keyof(visible[i], i);
					var li = old[key];
					var isnew = false;
					// A row is rebuilt only when its structure changes (icon, image, link)
					var sign = (visible[i].item.icon || '') + '|' + (visible[i].item.image || '') + '|' + (config.click ? '' : safeurl(visible[i].item.url)) + '|' + !!config.click;
					if (!li || used[key] || li.getAttribute('data-sign') !== sign) {
						li = document.createElement('li');
						li.innerHTML = rowhtml(visible[i], i);
						li.setAttribute('data-key', key);
						li.setAttribute('data-sign', sign);
						isnew = true;
					}
					used[key] = 1;
					if (els.list.children[i] !== li)
						els.list.insertBefore(li, els.list.children[i] || null);
					// A new row is laid out with an empty bar first, so its bar grows
					isnew && li.offsetWidth;
					fill(li, visible[i], i, max, anydelta);
				}

				while (els.list.children.length > visible.length)
					els.list.removeChild(els.list.lastChild);

				self.tclass(cls + '-isempty', !items.length);
				var canmore = config.limit > 0 && items.length > config.limit && !!(config.more || config.less);
				self.tclass(cls + '-hasmore', canmore && (expanded ? !!config.less : !!config.more));
				els.more.setAttribute('aria-expanded', expanded ? 'true' : 'false');
				els.moretext.textContent = expanded ? config.less : config.more;
				els.moreicon.className = expanded ? 'ti ti-chevron-up' : 'ti ti-chevron-down';
			};

			var setlabel = function() {
				els.title.innerHTML = config.label || label;
				var text = els.title.textContent.trim();
				self.tclass(cls + '-notitle', !text);
				text ? els.list.setAttribute('aria-label', text) : els.list.removeAttribute('aria-label');
			};

			var setcolumns = function() {
				var cols = (config.columns || '').split('|');
				els.columns.firstChild.textContent = cols[0] || '';
				els.columns.lastChild.textContent = cols[1] || '';
				self.tclass(cls + '-hascolumns', !!config.columns);
			};

			var setcolor = function(value) {
				var m = (/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i).exec(value || '');
				if (m) {
					var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
					self.dom.style.setProperty('--color', '#' + h);
					self.dom.style.setProperty('--rgb', [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)].join(', '));
				} else {
					self.dom.style.removeProperty('--color');
					self.dom.style.removeProperty('--rgb');
				}
			};

			self.make = function() {

				label = self.html().trim();

				self.aclass(cls);
				self.html(('<div class="{0}-title"></div><div class="{0}-columns" aria-hidden="true"><span></span><span></span></div><ol class="{0}-list"></ol>' +
					'<div class="{0}-empty"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>' +
					'<button type="button" class="{0}-more" aria-expanded="false"><span></span><i aria-hidden="true"></i></button>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.columns = self.find(cls2 + '-columns')[0];
				els.list = self.find(cls2 + '-list')[0];
				els.more = self.find(cls2 + '-more')[0];
				els.moretext = els.more.firstChild;
				els.moreicon = els.more.lastChild;

				prepare();

				self.event('click', 'button' + cls2 + '-row', function() {
					var index = +this.getAttribute('data-index');
					var entry = items[index];
					entry && config.click && self.EXEC(config.click, entry.item, self);
				});

				self.event('click', cls2 + '-more', function() {
					expanded = !expanded;
					render();
				});
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						setlabel();
						break;
					case 'bars':
						self.tclass(cls + '-line', value === 'line');
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'color':
						setcolor(value);
						break;
					case 'columns':
						setcolumns();
						break;
					case 'share':
						self.tclass(cls + '-noshare', !value);
						break;
					case 'sort':
						if (!init) {
							parse(self.get());
							render();
						}
						break;
					case 'limit':
					case 'more':
					case 'less':
					case 'goodup':
					case 'click':
						!init && render();
						break;
					case 'format':
					case 'decimals':
					case 'compact':
					case 'currency':
					case 'locale':
						if (!init) {
							prepare();
							render();
						}
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				render();
			};

		});

	</script>

	<div style="max-width:960px;padding:12px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr))">

		<ui-component name="rankchart" path="rank.referrers" config="limit:4">Referrers</ui-component>

		<ui-component name="rankchart" path="rank.pages" config="limit:5;more:Show all;less:Show less;columns:Page|Visitors;click:onrankclick">Top pages</ui-component>

		<ui-component name="rankchart" path="rank.live" config="share:false;columns:Page|Now">Active pages now</ui-component>

		<ui-component name="rankchart" path="rank.agents" config="bars:line;color:#6250D6">AI agents</ui-component>

		<ui-component name="rankchart" path="rank.slow" config="bars:line;share:false;goodup:false;format:duration;decimals:1;color:#EB6834">Slowest pages</ui-component>

		<ui-component name="rankchart" path="rank.empty">No data yet</ui-component>

	</div>

	<script>

		SET('rank.pages', [
			{ name: '/', value: 12840, previous: 11200, sub: 'Home' },
			{ name: '/blog/total-js-5-release', value: 6420, previous: 3100, sub: 'Total.js 5 is out' },
			{ name: '/docs/getting-started', value: 4310, previous: 4580 },
			{ name: '/pricing', value: 2980, previous: 2900 },
			{ name: '/blog/agentic-web', value: 2210, previous: 980 },
			{ name: '/contact', value: 1340, previous: 1500 },
			{ name: '/about', value: 870, previous: 910 },
			{ name: '/docs/api', value: 640, previous: 600 }
		]);

		SET('rank.agents', { items: [
			{ name: 'ChatGPT', value: 2100, icon: 'ti ti-robot' },
			{ name: 'Claude', value: 1250, icon: 'ti ti-robot' },
			{ name: 'Perplexity', value: 540, icon: 'ti ti-robot' },
			{ name: 'Googlebot', value: 3890, icon: 'ti ti-search' },
			{ name: 'Bingbot', value: 920, icon: 'ti ti-search' }
		] });

		SET('rank.referrers', [
			{ name: 'google.com', value: 18200, url: 'https://www.google.com' },
			{ name: 'chatgpt.com', value: 2900, url: 'https://chatgpt.com' },
			{ name: 'github.com', value: 1450, url: 'https://github.com' },
			{ name: 'x.com', value: 980, url: 'https://x.com' },
			{ name: 'reddit.com', value: 760, url: 'https://www.reddit.com' },
			{ name: 'news.ycombinator.com', value: 410, url: 'https://news.ycombinator.com' }
		]);

		SET('rank.slow', [
			{ name: '/docs/api', value: 4.2 },
			{ name: '/blog/agentic-web', value: 3.1 },
			{ name: '/pricing', value: 2.4 },
			{ name: '/', value: 1.3 }
		]);

		SET('rank.empty', null);

		// Real time: the active pages move every 2 seconds
		var live = [
			{ name: '/', value: 42 },
			{ name: '/blog/total-js-5-release', value: 31 },
			{ name: '/docs/getting-started', value: 18 },
			{ name: '/pricing', value: 9 },
			{ name: '/blog/agentic-web', value: 7 }
		];

		SET('rank.live', live);

		setInterval(function() {
			live = live.map(function(item) {
				return { name: item.name, value: Math.max(1, item.value + Math.round(Math.random() * 10 - 5)) };
			});
			SET('rank.live', live);
		}, 2000);

		function onrankclick(item, component) {
			// e.g. open the detail of the page: item.name, item.value
		}

	</script>

</body>
</html>
