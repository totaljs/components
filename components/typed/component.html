<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-typed {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('typed', 'typespeed:50;startdelay:50;backspeed:0;smartbackspace:true;shuffle:false;backdelay:700;fadeout:false;fadeoutclass:typed-fade-out;fadeoutdelay:500;loop:false;loopcount:Infinity;showcursor:true;cursorchar:|;autoinsertcss:true;contenttype:html', function(self, config) {

			var typed = null;
			var render = function(value) {

				if (!value || !value.length)
					return;

				if (!(value instanceof Array))
					value = [value];

				typed && typed.destroy();

				var node = config.selector ? self.find(config.selector)[0] : self.dom;
				var span = document.createElement('SPAN');

				$(node).html(span);

				typed = new W.Typed(span, {
					strings: value,
					typeSpeed: config.typespeed,
					startDelay: config.startdelay,
					backSpeed: config.backspeed,
					smartBackspace: config.smartbackspace,
					shuffle: config.shuffle,
					backDelay: config.backdelay,
					fadeOut: config.fadeout,
					fadeOutClass: config.fadeoutclass,
					fadeOutDelay: config.fadeoutdelay,
					loop: config.loop,
					loopCount: config.loopcount,
					showCursor: config.showcursor,
					cursorChar: config.cursorchar,
					autoInsertCss: config.autoinsertcss,
					contentType: config.contenttype,
					onComplete: function(typed) {
						self.emit('typed.onComplete', typed, self);
					},
					preStringTyped: function(pos, typed) {
						self.emit('typed.preStringTyped', pos, typed, self);
					},
					onStringTyped: function(pos, typed) {
						self.emit('typed.onStringTyped', pos, typed, self);
					},
					onLastStringBackspaced: function(typed) {
						self.emit('typed.onLastStringBackspaced', typed, self);
					},
					onTypingPaused: function(pos, typed) {
						self.emit('typed.onTypingPaused', pos, typed, self);
					},
					onTypingResumed: function(pos, typed) {
						self.emit('typed.onTypingResumed', pos, typed, self);
					},
					onReset: function(typed) {
						self.emit('typed.onReset', typed, self);
					},
					onStop: function(pos, typed) {
						self.emit('typed.onStop', pos, typed, self);
					},
					onStart: function(pos, typed) {
						self.emit('typed.onStart', pos, typed, self);
					},
					onDestroy: function(typed) {
						self.emit('typed.onDestroy', typed, self);
					}
				});
			};

			self.configure = function(key, value) {
				if (key === 'text' && value)
					render(value.split('|').trim());
			};

			self.setter = render;

		}, ['https://unpkg.com/typed.js@2.0.16/dist/typed.umd.js']);

	</script>

	<!-- Example -->
	<div style="height:100px">
		<ui-component name="typed" path="messages" config="loop:true" style="white-space:pre"></ui-component>
	</div>
	<div style="height:50px">
		<ui-component name="typed" path="messages2" config="loop:true;typespeed:100;backspeed:50"></ui-component>
	</div>

	<script>
		var messages = 'npm install total.js^1000\n`+ <b>total.js@3.1.0</b>` ^1000\n`added <b>1 package</b> from 23 contributors and audited 1 package in <b>1.348s</b>` ^1000\n`found 0 vulnerabilities`';
		var messages2 = ['Hello world!', '<b>Total.js</b> is awesome!', 'jComponent is <b>awesome</b>!', 'Lorem ipsum', 'Lorem dolor'];

		var count = 0;
		ON('typed.onComplete', function(typed, component) {
			if (typed.el.id === 'myconsole') {
				count++;

				if (count === 5)
					typed.loop = false;
			}
		});
	</script>

</body>
</html>
