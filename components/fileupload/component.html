<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-fileupload {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('fileupload', function(self, config) {

			var id = 'fileupload' + self._id;
			var input = null;

			self.readonly();
			self.nocompile && self.nocompile();

			self.configure = function(key, value, init) {
				if (init)
					return;
				switch (key) {
					case 'disabled':
						self.tclass('ui-disabled', value);
						break;
					case 'accept':
						var el = $('#' + id);
						if (value)
							el.prop('accept', value);
						else
							el.removeProp('accept');
						break;
					case 'multiple':
						var el = $('#' + id);
						if (value)
							el.prop('multiple', true);
						else
							el.removeProp('multiple');
						break;
					case 'label':
						self.html(value);
						break;
				}
			};

			self.make = function() {

				config.disabled && self.aclass('ui-disabled');
				$(document.body).append('<input type="file" id="{0}" class="hidden"{1}{2} />'.format(id, config.accept ? ' accept="{0}"'.format(config.accept) : '', config.multiple ? ' multiple="multiple"' : ''));
				input = $('#' + id);

				self.event('click', function() {
					!config.disabled && input.click();
				});

				input.on('change', function(evt) {
					!config.disabled && self.upload(evt.target.files);
					this.value = '';
				});
			};

			self.upload = function(files) {

				var data = new FormData();
				var el = this;

				for (var i = 0, length = files.length; i < length; i++) {

					var filename = files[i].name;
					var index = filename.lastIndexOf('/');

					if (index === -1)
						index = filename.lastIndexOf('\\');

					if (index !== -1)
						filename = filename.substring(index + 1);

					data.append('file' + i, files[i], filename);
				}

				SETTER('loading', 'show');
				UPLOAD(config.url, data, function(response, err) {

					el.value = '';
					SETTER('loading', 'hide', 500);

					if (err) {
						SETTER('snackbar', 'warning', err.toString());
						return;
					}

					self.change();

					if (config.array)
						self.push(response);
					else
						self.set(response);
				});
			};

			self.destroy = function() {
				input.off().remove();
			};
		});

	</script>

	<!-- Example -->
	<a href="javascript:void(0)"><ui-component name="fileupload" path="mypicture" config="url:/my-upload-url/">Upload</ui-component></a>

	<script>
		var mypicture = '';
	</script>

</body>
</html>
