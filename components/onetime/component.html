<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-onetime {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('onetime', 'expire:1 year;delay:1000', function(self, config) {

			self.readonly();

			self.make = function() {

				if (!config.exec)
					return;

				var key = [];
				for (let item of self.dom.attributes)
					key.push(item.name + '=' + item.value);
				key = 'onetime' + HASH(key.join('|')).toString(36);

				if (CACHE(key))
					return;

				setTimeout(function() {
					self.EXEC(config.exec);
					CACHE(key, '1', config.expire);
				}, config.delay);

			};

		});

	</script>

	<!-- Example -->
	<ui-component name="onetime" config="exec:onetimealert;expire:1 month"></ui-component>

	<script>

		function onetimealert() {
			alert('After a month, this message will appear again.');
		}

	</script>

</body>
</html>
