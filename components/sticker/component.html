<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-sticker {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('sticker', 'margin:0;marginparent:0;lg:1;md:1;sm:1;xs:0;type:offset', function(self, config) {

			var raf = W.requestAnimationFrame ? W.requestAnimationFrame : function(cb) { setTimeout(cb, 1); };
			var ca = null;
			var cb = null;
			var enabled = false;
			var is = false;
			var ready = false;
			var top = 0;
			var maxtop = 0;
			var events = {};
			var parent;

			self.readonly();

			function parentscroll(node) {

				if (node) {
					var cls = node.getAttribute('class');
					if (cls && cls.indexOf('ui-scrollbar-area') !== -1)
						return node;
				}

				return node ? (node.scrollHeight > node.clientHeight ? node : parentscroll(node.parentNode)) : null;
			}

			self.configure = function(key, value) {
				switch (key) {
					case 'on':
						ca = value;
						break;
					case 'off':
						cb = value;
						break;
					case 'parent':
						parent = config.parent ? self.parent(config.parent) : null;
						break;
				}
			};

			events.onscroll = function() {
				raf(self.toggle);
			};

			events.bind = function() {
				$(self.container.tagName === 'HTML' ? W : self.container).on('scroll', events.onscroll);
			};

			self.destroy = function() {
				$(self.container.tagName === 'HTML' ? W : self.container).off('scroll', events.onscroll);
			};

			self.resize = function() {

				if (self.hclass(ca))
					return;

				ready = false;

				WAIT(function() {
					top = self.element[config.type]().top;
					return top > 0;
				}, function() {
					ready = true;
					setTimeout(self.toggle, 500);
				});
			};

			self.make = function() {

				var w = WIDTH();

				if (!config[w])
					return;

				self.container = parentscroll(self.dom);

				if (self.container) {
					self.resize();
					events.bind();
				} else
					setTimeout(self.make, 500);
			};

			self.toggle = function() {

				if (!ready)
					return;

				var el = self.element;

				if (!top || !self.dom.parentNode) {
					ca && el.rclass(ca);
					cb && el.aclass(cb);
					return;
				}

				var t = top + config.margin;
				var y = W.pageYOffset || self.container.scrollTop;

				is = y >= t;

				var scrollheight = self.container.scrollHeight || WH;
				if (config.minheight && config.minheight > scrollheight)
					is = false;

				if (is) {

					if (!enabled) {
						enabled = true;
						ca && el.rclass(ca);
						cb && el.aclass(cb);
						if (parent)
							maxtop = (parent.height() - el.height()) - config.marginparent;
					}

					if (parent && y < (maxtop + t))
						self.dom.style.top = y + 'px';

				} else if (enabled) {
					cb && el.rclass(cb);
					ca && el.aclass(ca);
					if (parent)
						self.dom.style.top = t + 'px';
					enabled = false;
				}
			};

			self.setter = function() {
				setTimeout(self.resize, 300);
			};

		});

	</script>

	<!-- Example -->
	<style>
		.fixed { position: fixed; background-color: red; right: 0; top: 0; left: 0; padding: 20px 0; text-align: center; color: white; }
		.relative { background-color: blue; padding: 10px; border-radius: 4px; position: relative; display: inline-block; color: white; }
	</style>

	<div style="padding:50px; height:1500px">
		<div style="background-color:#F0F0F0;height:500px;margin:200px 0 0">
			<ui-component name="sticker" config="parent:parent" style="position:absolute">
				This text will depent on parent position.
			</ui-component>
		</div>
	</div>
	<hr />
	<div style="padding:50px; height:1500px">
		<ui-component name="sticker" config="on:relative;off:fixed">
			This text will be on fixed position.
		</ui-component>
	</div>

</body>
</html>
