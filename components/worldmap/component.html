<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-worldmap { --wmland: #E6E6E6; --wmbg: #FFF; box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }
		.ui-worldmap-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-worldmap-title { margin-bottom: 12px; font-weight: 600; font-size: 14px; }
		.ui-worldmap-notitle .ui-worldmap-title { display: none; }
		.ui-worldmap-body { position: relative; border-radius: 4px; outline: none; }
		.ui-worldmap-body:focus-visible { box-shadow: 0 0 0 2px var(--color); }
		.ui-worldmap-body svg { display: block; width: 100%; height: auto; }
		.ui-worldmap-loading .ui-worldmap-body svg { visibility: hidden; }
		.ui-worldmap-land { fill: var(--wmland); stroke: var(--wmbg); stroke-width: .6; stroke-linejoin: round; vector-effect: non-scaling-stroke; transition: fill .3s; }
		.ui-worldmap-land[data-code] { cursor: default; }
		.ui-worldmap-clickable .ui-worldmap-land.ui-worldmap-has, .ui-worldmap-clickable .ui-worldmap-spot { cursor: pointer; }
		.ui-worldmap-land.ui-worldmap-on { stroke: #1F1F1F; stroke-width: 1.5; }
		.ui-worldmap-spot { stroke: var(--wmbg); stroke-width: 1.5; vector-effect: non-scaling-stroke; transition: fill .3s; }
		.ui-worldmap-spot.ui-worldmap-on { stroke: #1F1F1F; }
		.ui-worldmap-tip { position: absolute; top: 0; left: 0; z-index: 5; display: none; min-width: 120px; max-width: 240px; padding: 8px 10px; border-radius: 8px; background: #1F1F1F; color: #FFF; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); pointer-events: none; }
		.ui-worldmap-hover .ui-worldmap-tip { display: block; }
		.ui-worldmap-tip-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.ui-worldmap-tip-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 3px; color: rgba(255, 255, 255, .8); font-variant-numeric: tabular-nums; }
		.ui-worldmap-tip-row b { color: #FFF; font-weight: 600; }
		.ui-worldmap-scale { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: #5E5E5E; font-size: 12px; font-variant-numeric: tabular-nums; }
		.ui-worldmap-nolegend .ui-worldmap-scale, .ui-worldmap-isempty .ui-worldmap-scale { display: none; }
		.ui-worldmap-steps { display: flex; gap: 2px; }
		.ui-worldmap-steps span { width: 26px; height: 10px; }
		.ui-worldmap-steps span:first-child { border-radius: 3px 0 0 3px; }
		.ui-worldmap-steps span:last-child { border-radius: 0 3px 3px 0; }
		.ui-worldmap-message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #8A8A8A; }
		.ui-worldmap-message i { font-size: 22px; opacity: .7; }
		.ui-worldmap-loading .ui-worldmap-message, .ui-worldmap-failed .ui-worldmap-message { display: flex; }
		.ui-worldmap-loading .ui-worldmap-body { min-height: 120px; }
		.ui-worldmap-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

		@media (prefers-reduced-motion: reduce) {
			.ui-worldmap-land, .ui-worldmap-spot { transition: none; }
		}

		.ui-dark .ui-worldmap { --wmland: #383838; --wmbg: #252525; border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-worldmap-minimal { --wmbg: #1A1A1A; border-color: transparent; background: transparent; }
		.ui-dark .ui-worldmap-land.ui-worldmap-on, .ui-dark .ui-worldmap-spot.ui-worldmap-on { stroke: #FFF; }
		.ui-dark .ui-worldmap-tip { background: #F2F2F2; color: #1F1F1F; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
		.ui-dark .ui-worldmap-tip-row { color: #5E5E5E; }
		.ui-dark .ui-worldmap-tip-row b { color: #1F1F1F; }
		.ui-dark .ui-worldmap-scale { color: #ABABAB; }

		@media (forced-colors: active) {
			.ui-worldmap { border: 1px solid CanvasText; }
			.ui-worldmap-land { stroke: CanvasText; }
			.ui-worldmap-land.ui-worldmap-on { stroke: Highlight; }
			.ui-worldmap-tip { border: 1px solid CanvasText; }
		}

	</style>

	<script component>

		COMPONENT('worldmap', 'label:;style:card;color:;steps:5;scale:log;legend:true;format:number;decimals:0;compact:true;currency:EUR;locale:;list:;click:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var map = null;
			var values = {};
			var ranking = [];
			var total = 0;
			var bounds = { min: 0, max: 0 };
			var active = null;
			var cursor = -1;
			var fmt = {};
			var label = '';
			var nodes = {};
			var STEPS = [22, 40, 58, 78, 100];

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var intl = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, { maximumFractionDigits: options.maximumFractionDigits || 0 });
				}
			};

			var prepare = function() {
				var decimals = Math.max(0, config.decimals || 0);
				var opt = { minimumFractionDigits: 0, maximumFractionDigits: decimals };
				var copt = { notation: 'compact', maximumFractionDigits: 1 };
				if (config.format === 'currency') {
					opt.style = copt.style = 'currency';
					opt.currency = copt.currency = config.currency || 'EUR';
				}
				fmt.full = intl(opt);
				fmt.compact = config.compact ? intl(copt) : null;
				fmt.share = intl({ style: 'percent', maximumFractionDigits: 1 });
				try {
					fmt.names = Intl.DisplayNames ? new Intl.DisplayNames(locale() ? [locale()] : undefined, { type: 'region' }) : null;
				} catch (e) {
					fmt.names = null;
				}
			};

			var format = function(n) {
				return (fmt.compact && Math.abs(n) >= 10000 ? fmt.compact : fmt.full).format(n);
			};

			// The name of the country in the language of the page (Unicode CLDR of the browser)
			var name = function(code) {
				var text = '';
				try {
					text = fmt.names ? fmt.names.of(code) : '';
				} catch (e) {}
				return text || code;
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			// { ES: 120, MX: 40 } or [{ code: 'ES', value: 120 }]
			var parse = function(model) {
				var out = {};
				var code, n;
				if (model instanceof Array) {
					for (var i = 0; i < model.length; i++) {
						var item = model[i] || {};
						code = (item.code || item.id || '') + '';
						n = num(item.value);
						if ((/^[a-z]{2}$/i).test(code) && n != null && n >= 0)
							out[code.toUpperCase()] = (out[code.toUpperCase()] || 0) + n;
					}
				} else if (model && typeof model === 'object') {
					for (code in model) {
						n = num(model[code]);
						if ((/^[a-z]{2}$/i).test(code) && n != null && n >= 0)
							out[code.toUpperCase()] = n;
					}
				}

				values = out;
				ranking = [];
				total = 0;
				bounds.min = Infinity;
				bounds.max = 0;
				for (code in out) {
					if (out[code] > 0) {
						ranking.push(code);
						total += out[code];
						bounds.min = Math.min(bounds.min, out[code]);
						bounds.max = Math.max(bounds.max, out[code]);
					}
				}
				if (!ranking.length)
					bounds.min = 0;
				ranking.sort(function(a, b) {
					return out[b] - out[a];
				});
			};

			var count = function() {
				return Math.max(2, Math.min(STEPS.length, config.steps || 5));
			};

			// The value to a step of the sequential scale: 0 is the lightest, count - 1 the darkest
			var step = function(value) {
				var n = count();
				if (bounds.max <= bounds.min)
					return n - 1;
				var t;
				if (config.scale === 'linear')
					t = (value - bounds.min) / (bounds.max - bounds.min);
				else
					t = (Math.log(value) - Math.log(bounds.min)) / (Math.log(bounds.max) - Math.log(bounds.min));
				return Math.max(0, Math.min(n - 1, Math.floor(t * n)));
			};

			var shade = function(index) {
				var n = count();
				var alpha = STEPS[Math.round(index * (STEPS.length - 1) / (n - 1))];
				// Mixed with the colour of the land, so the lightest step is still a tint of the land in light and dark mode
				return 'color-mix(in srgb, var(--color) ' + alpha + '%, var(--wmland))';
			};

			var build = function() {

				var scale = map.scale || 1;
				var width = map.width * scale;
				var height = map.height * scale;
				var land = [];
				var spots = [];

				for (var i = 0; i < map.countries.length; i++) {
					var c = map.countries[i];
					var code = c[0];
					land.push('<path class="{0}-land"{1} d="{2}" />'.format(cls, code ? ' data-code="' + esc(code) + '"' : '', c[1]));
					// Very small countries get a dot, otherwise their data would be invisible
					if (code && c[4] < 6)
						spots.push('<circle class="{0}-spot" data-code="{1}" cx="{2}" cy="{3}" r="{4}" style="display:none" />'.format(cls, esc(code), c[2] * scale, c[3] * scale, 3.2 * scale));
				}

				els.svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
				els.svg.innerHTML = land.join('') + spots.join('');

				nodes = {};
				var list = els.svg.querySelectorAll('[data-code]');
				for (var j = 0; j < list.length; j++) {
					var key = list[j].getAttribute('data-code');
					(nodes[key] = nodes[key] || []).push(list[j]);
				}

				self.rclass(cls + '-loading');
				paint();
			};

			var paint = function() {

				self.tclass(cls + '-isempty', !ranking.length);

				for (var code in nodes) {
					var value = values[code];
					var has = value != null && value > 0;
					var fill = has ? shade(step(value)) : '';
					for (var i = 0; i < nodes[code].length; i++) {
						var node = nodes[code][i];
						node.style.fill = fill;
						node.classList.toggle(cls + '-has', has);
						if (node.tagName === 'circle')
							node.style.display = has ? '' : 'none';
					}
				}

				renderscale();
				rendertable();

				if (active)
					show(active, null, cursor !== -1);
			};

			var renderscale = function() {
				var builder = [];
				for (var i = 0; i < count(); i++)
					builder.push('<span style="background:{0}"></span>'.format(shade(i)));
				els.steps.innerHTML = builder.join('');
				els.min.textContent = ranking.length ? format(bounds.min) : '';
				els.max.textContent = ranking.length ? format(bounds.max) : '';
			};

			var rendertable = function() {
				var builder = ['<table><caption>' + esc(els.title.textContent.trim()) + '</caption><tbody>'];
				for (var i = 0; i < ranking.length; i++)
					builder.push('<tr><th scope="row">{0}</th><td>{1}</td><td>{2}</td></tr>'.format(esc(name(ranking[i])), esc(format(values[ranking[i]])), esc(fmt.share.format(values[ranking[i]] / total))));
				builder.push('</tbody></table>');
				els.table.innerHTML = builder.join('');
			};

			var highlight = function(code) {
				var list = els.svg.querySelectorAll(cls2 + '-on');
				for (var i = 0; i < list.length; i++)
					list[i].classList.remove(cls + '-on');
				if (code && nodes[code]) {
					for (var j = 0; j < nodes[code].length; j++) {
						nodes[code][j].classList.add(cls + '-on');
						// The outline of the active country is drawn over its neighbours, but under the dots of small countries
						var node = nodes[code][j];
						node.parentNode.insertBefore(node, node.tagName === 'circle' ? null : els.svg.querySelector('circle'));
					}
				}
			};

			var show = function(code, point, announce) {

				if (!code || !nodes[code]) {
					hide();
					return;
				}

				var value = values[code];
				var has = value != null && value > 0;
				var title = name(code);

				active = code;
				highlight(code);

				els.tip.innerHTML = '<div class="{0}-tip-name">{1}</div>'.format(cls, esc(title)) + (has ? '<div class="{0}-tip-row"><b>{1}</b><span>{2}</span></div>'.format(cls, esc(format(value)), esc(fmt.share.format(value / total))) : '<div class="{0}-tip-row"><span>—</span></div>'.format(cls));
				self.aclass(cls + '-hover');

				// Next to the pointer, or next to the country when it comes from the keyboard
				var rect = els.body.getBoundingClientRect();
				var x, y;
				if (point) {
					x = point.x - rect.left;
					y = point.y - rect.top;
				} else {
					var box = nodes[code][0].getBoundingClientRect();
					x = box.left + box.width / 2 - rect.left;
					y = box.top + box.height / 2 - rect.top;
				}

				var tw = els.tip.offsetWidth;
				var th = els.tip.offsetHeight;
				var tx = x + 14 + tw > rect.width ? x - 14 - tw : x + 14;
				var ty = Math.max(0, Math.min(rect.height - th, y - th - 10));
				els.tip.style.transform = 'translate(' + Math.round(Math.max(0, tx)) + 'px,' + Math.round(ty) + 'px)';

				if (announce)
					els.live.textContent = has ? title + ': ' + format(value) + ', ' + fmt.share.format(value / total) : title;
			};

			var hide = function() {
				active = null;
				highlight(null);
				self.rclass(cls + '-hover');
			};

			var run = function(code) {
				if (!code || !config.click)
					return;
				var value = values[code];
				self.EXEC(config.click, { code: code, name: name(code), value: value == null ? null : value, share: value && total ? value / total * 100 : 0 }, self);
			};

			var load = function() {
				var url = config.list || ((DEF.cdn || 'https://cdn.componentator.com') + '/j-worldmap.json');
				self.aclass(cls + '-loading');
				self.rclass(cls + '-failed');
				AJAX('GET ' + url, function(response) {
					if (response && response.countries instanceof Array && response.width) {
						map = response;
						build();
					} else {
						self.rclass(cls + '-loading');
						self.aclass(cls + '-failed');
					}
				});
			};

			var setcolor = function(value) {
				var m = (/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i).exec(value || '');
				if (m) {
					var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
					self.dom.style.setProperty('--color', '#' + h);
					self.dom.style.setProperty('--rgb', [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)].join(', '));
				} else {
					self.dom.style.removeProperty('--color');
					self.dom.style.removeProperty('--rgb');
				}
			};

			var setlabel = function() {
				els.title.innerHTML = config.label || label;
				var text = els.title.textContent.trim();
				self.tclass(cls + '-notitle', !text);
				text ? els.body.setAttribute('aria-label', text) : els.body.removeAttribute('aria-label');
			};

			self.make = function() {

				label = self.html().trim();

				self.aclass(cls);
				self.html(('<div class="{0}-title"></div>' +
					'<div class="{0}-body" tabindex="0" role="group"><svg aria-hidden="true" focusable="false"></svg><div class="{0}-tip" aria-hidden="true"></div><div class="{0}-message"><i class="ti ti-globe" aria-hidden="true"></i></div></div>' +
					'<div class="{0}-scale" aria-hidden="true"><span class="{0}-min"></span><span class="{0}-steps"></span><span class="{0}-max"></span></div>' +
					'<div class="{0}-sr {0}-table"></div><div class="{0}-sr" aria-live="polite"></div>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.body = self.find(cls2 + '-body')[0];
				els.svg = self.find(cls2 + '-body svg')[0];
				els.tip = self.find(cls2 + '-tip')[0];
				els.steps = self.find(cls2 + '-steps')[0];
				els.min = self.find(cls2 + '-min')[0];
				els.max = self.find(cls2 + '-max')[0];
				els.table = self.find(cls2 + '-table')[0];
				els.live = self.find(cls2 + '-sr[aria-live]')[0];

				prepare();

				self.event('mousemove', cls2 + '-body', function(e) {
					var target = e.target.closest ? e.target.closest('[data-code]') : null;
					var code = target ? target.getAttribute('data-code') : null;
					cursor = -1;
					if (code)
						show(code, { x: e.clientX, y: e.clientY });
					else if (active)
						hide();
				});

				self.event('mouseleave', cls2 + '-body', function() {
					document.activeElement !== els.body && hide();
				});

				self.event('click', cls2 + '-body', function(e) {
					var target = e.target.closest ? e.target.closest('[data-code]') : null;
					target && values[target.getAttribute('data-code')] > 0 && run(target.getAttribute('data-code'));
				});

				// The keyboard moves through the countries with data, from the biggest value
				self.event('keydown', cls2 + '-body', function(e) {
					if (!ranking.length || !map)
						return;
					switch (e.key) {
						case 'ArrowDown':
						case 'ArrowRight':
							cursor = Math.min(ranking.length - 1, cursor + 1);
							break;
						case 'ArrowUp':
						case 'ArrowLeft':
							cursor = cursor <= 0 ? 0 : cursor - 1;
							break;
						case 'Home':
							cursor = 0;
							break;
						case 'End':
							cursor = ranking.length - 1;
							break;
						case 'Escape':
							cursor = -1;
							hide();
							return;
						case 'Enter':
						case ' ':
							e.preventDefault();
							cursor !== -1 && run(ranking[cursor]);
							return;
						default:
							return;
					}
					e.preventDefault();
					show(ranking[cursor], null, true);
				});

				self.event('blur', cls2 + '-body', function() {
					cursor = -1;
					hide();
				});

				load();
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						setlabel();
						!init && rendertable();
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'color':
						setcolor(value);
						break;
					case 'legend':
						self.tclass(cls + '-nolegend', !value);
						break;
					case 'click':
						self.tclass(cls + '-clickable', !!value);
						break;
					case 'list':
						!init && load();
						break;
					case 'steps':
					case 'scale':
						!init && map && paint();
						break;
					case 'format':
					case 'decimals':
					case 'compact':
					case 'currency':
					case 'locale':
						if (!init) {
							prepare();
							map && paint();
						}
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				map && paint();
			};

		});

	</script>

	<div style="max-width:960px;padding:20px;display:grid;gap:16px">

		<ui-component name="worldmap" path="geo.visitors" config="click:oncountryclick">Visitors by country</ui-component>

		<ui-component name="worldmap" path="geo.agents" config="color:#6250D6;steps:4;scale:linear;style:minimal">AI agent visits by country</ui-component>

	</div>

	<script>

		SET('geo.visitors', { US: 18420, ES: 9650, MX: 6120, DE: 4210, GB: 3980, FR: 3310, AR: 2870, CO: 2140, BR: 1980, IT: 1730, CA: 1520, IN: 1410, NL: 980, CL: 920, PE: 860, PT: 790, SK: 640, PL: 560, JP: 520, AU: 480, CH: 410, SE: 370, BE: 330, CZ: 300, AD: 120, MT: 90, SG: 260, UY: 210, EC: 330, VE: 280, MA: 140, ZA: 150, CN: 190, KR: 170, IE: 240, AT: 230, NO: 160, DK: 150, FI: 110, RU: 90, TR: 130, NG: 60, EG: 80, NZ: 70, LU: 40 });

		SET('geo.agents', [{ code: 'US', value: 6100 }, { code: 'IE', value: 2400 }, { code: 'DE', value: 1300 }, { code: 'NL', value: 900 }, { code: 'SG', value: 700 }, { code: 'FR', value: 450 }, { code: 'JP', value: 300 }, { code: 'GB', value: 520 }, { code: 'CA', value: 280 }]);

		// Real time: new visits every 2 seconds
		setInterval(function() {
			var model = GET('geo.visitors');
			var codes = Object.keys(model);
			var copy = {};
			for (var i = 0; i < codes.length; i++)
				copy[codes[i]] = model[codes[i]];
			var code = codes[Math.floor(Math.random() * codes.length)];
			copy[code] += Math.round(Math.random() * 40);
			SET('geo.visitors', copy);
		}, 2000);

		function oncountryclick(country, component) {
			// e.g. filter the dashboard by the country: country.code, country.name, country.value
		}

	</script>

</body>
</html>
