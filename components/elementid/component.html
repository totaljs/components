<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-elementid {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('elementid', function(self) {
			self.setter = function(value) {
				self.attrd('id', value == null ? '' : value);
			};
		});

	</script>

	<!-- Example -->
	Check the <b>data-id</b> attribute via Web Developer tools.

	<ui-component name="elementid" path="common.id"></ui-component>

	<script>

		var common = { id: '123456' };

	</script>

</body>
</html>
