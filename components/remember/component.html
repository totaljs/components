<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-remember {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('remember', 'repeat:10 minutes;delay:3000', function(self, config) {

			let key = 'remember_' + config.id || self.ID;

			self.readonly();

			self.make = function() {
				let is = CACHE(key);
				if (!is) {
					setTimeout(function() {
						CACHE(key, {}, config.repeat);
						config.exec && self.EXEC(config.exec, self.element);
					}, config.delay);
				}
			};

			self.reset = function(id) {
				if (key === id)
					CACHE(key, null, '-1 day');
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="remember" config="exec:message;repeat:5 minutes"></ui-component>

	<script>

		function message() {
			alert('This message will be displayed every 5 minutes');
		}

	</script>

</body>
</html>
