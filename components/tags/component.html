	<!-- Style -->

		.tag { position: relative; height: 22px; display: block; float: left; max-width: 200px; padding: 4px 10px 0 12px; border: 1px solid #c7deeb; border-left-width: 0; border-radius: 0 3px 3px 0; font-size: 11px; white-space: nowrap; text-overflow: ellipsis; background-color: #d5ebf0; color: #505050; cursor: pointer; user-select: none; margin: 3px 8px; z-index: 2; font-family: Arial; text-decoration: none; }
		.tag:before { content: ''; width: 16px; height: 15px; position: absolute; left: -8px; top: 2px; transform: rotate(45deg); border-left: 1px solid #c7deeb; border-bottom: 1px solid #c7deeb; border-radius: 2px; z-index: 1; background-color: #d5ebf0; border-bottom-left-radius: 3px; }
		.tag:after { content: ''; width: 6px; height: 6px; background-color: #fff; border-radius: 4px; border: 1px solid #c7deeb; position: absolute; top: 6px; left: -1px; z-index: 2; }
		.tag:hover { opacity: 0.8; }
	</style>
