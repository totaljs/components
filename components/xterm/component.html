<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-xterm .terminal { padding: 5px; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('xterm', 'cols:80;rows:24', function(self, config, cls) {

			self.readonly();

			var fakews = {};
			var fakedata = {};
			var container;
			var term;

			fakews.handlers = {};
			fakews.readyState = 1;

			self.destroy = function() {
				term.destroy();
				term = null;
			};

			self.make = function() {

				self.aclass(cls);
				container = document.createElement('div');
				self.dom.appendChild(container);

				term = new Terminal({ cols: config.cols, rows: config.rows });
				term.open(container);

				fakews.send = function(data) {
					config.send && self.SEEX(config.send, data);
				};

				fakews.removeEventListener = function(type) {
					delete fakews.handlers[type];
				};

				fakews.addEventListener = function(type, handler) {
					fakews.handlers[type] = handler;
				};

				new attach.attach(term, fakews);
			};

			self.write = function(data) {
				fakedata.data = data;
				fakews.handlers.message(fakedata);
			};

		}, [function(next) {
			let cdn = (DEF.cdn || 'https://cdn.componentator.com');
			IMPORT(cdn + '/xterm.min@314.css', () => IMPORT(cdn + '/xterm.min@314.js', next));
		}]);

	</script>

	<!-- Example -->
	<ui-component name="xterm" config="send:send_to_server"></ui-component>

	<script>

		function send_to_server(data) {

			// FAKE:
			// the below code will append the data directly into the terminal
			SETTER('xterm/write', data);

		}

	</script>

</body>
</html>
