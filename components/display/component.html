<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-centered-noscroll, .ui-centered-noscroll body { overflow: hidden; }
		.ui-centered-container { position: fixed; width: 100%; height: 100%; z-index: 5; background-color: rgba(255,255,255,0.95); left: 0; top: 0; }
		.ui-centered-body { display: table-cell; vertical-align: middle; text-align: center; }
		.ui-centered-content { display: table; width: 100%; height: 100%; }
		.ui-centered-button { font-size: 14px; color: #A0A0A0; position: absolute; right: 15px; top: 15px; cursor: pointer; opacity: 0.7; transition: all 0.3s; width: 24px; height: 24px; text-align: center; line-height: 24px; z-index: 2; }
		.ui-centered-button:active { top: 21px; }
		.ui-centered-button:hover { opacity: 1; }

		.ui-dark .ui-centered-container { background-color: rgba(20,20,20,0.95); }
		.ui-dark .ui-centered-button { color: #777777; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('display', 'delay:100;xs:768;sm:992;md:1200', function(self, config, cls) {

			var initialized = false;
			var sizes = {};
			var prev;

			self.readonly();

			self.make = function() {
				self.aclass(cls);
				self.resizeforce();
				self.on('resize + resize2', self.resize);
			};

			self.resizeforce = function() {

				var width = self.element.width();
				var size = 'lg';

				if (width <= config.xs)
					size = 'xs';
				else if (width <= config.sm)
					size = 'sm';
				else if (width <= config.md)
					size = 'md';

				if (!prev || prev.substring(3) !== size) {
					prev && self.rclass(prev);
					prev = (M.version < 19 ? 'jc-' : 'd-') + size;
					self.aclass(prev);
					self.path && self.set(size);
					if (!initialized) {
						initialized = true;
						self.rclass('invisible hidden');
					}
				}
			};

			self.resize = function() {
				setTimeout2(self.ID, self.resizeforce, config.delay);
			};

		});

	</script>

	<!-- Example -->
	<div style="width:500px;padding:10px;border:1px solid #E0E0E0">
		<ui-component name="display" path="common.xs">
			<ui-bind path="common.xs" config="text" class="block"></ui-bind>
		</ui-component>
	</div>
	<br />
	<div style="width:800px;padding:10px;border:1px solid #E0E0E0">
		<ui-component name="display" path="common.sm">
			<ui-bind path="common.sm" config="text" class="block"></ui-bind>
		</ui-component>
	</div>
	<br />
	<div style="width:1080px;padding:10px;border:1px solid #E0E0E0">
		<ui-component name="display" path="common.md">
			<ui-bind path="common.md" config="text" class="block"></ui-bind>
		</ui-component>
	</div>
	<br />
	<div style="width:1380px;padding:10px;border:1px solid #E0E0E0">
		<ui-component name="display" path="common.lg">
			<ui-bind path="common.lg" config="text" class="block"></ui-bind>
		</ui-component>
	</div>
	<br />

</body>
</html>
