<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-mainprogress { position: fixed; left: 0; top: 0; height: 2px; z-index: 1001; background-color: var(--color); box-shadow: 0 2px 10px rgba(66,130,244,0.8); }
		.ui-mainprogress-bottom { bottom: 0; top: unset; box-shadow: 0 -2px 10px rgba(66,130,244,0.8); }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('mainprogress', function(self, config, cls) {

			var old = null;

			self.singleton();
			self.readonly();
			self.nocompile();

			self.make = function() {
				var temp = config.position === 'bottom' ? ' ' + cls + '-bottom' : '';
				self.aclass(cls + temp + ' hidden');
			};

			self.setter = function(value) {
				!value && (value = 0);

				if (old === value)
					return;

				if (value > 100)
					value = 100;
				else if (value < 0)
					value = 0;

				old = value >> 0;

				self.element.stop().animate({ width: old + '%' }, 80).show();
				self.tclass('hidden', old === 0 || old === 100);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="mainprogress" path="percentage"></ui-component>

	<script>
		var percentage = 30;
		setInterval(function() {
			SET('percentage', (Math.random() * 100) >> 0);
		}, 800);
	</script>

</body>
</html>
