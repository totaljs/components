<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-colorpalette { position: fixed; z-index: 1000; width: 300px; max-width: calc(100vw - 16px); box-sizing: border-box; padding: 10px; background: #FFF; color: #222; border: 1px solid #E0E0E0; border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.08); font-size: 13px; }
		.ui-colorpalette-top { display: flex; gap: 10px; align-items: stretch; }
		.ui-colorpalette-sample { width: 74px; height: 74px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 8px; font-size: 15px; font-weight: bold; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.4); }
		.ui-colorpalette-sample span:first-child { color: #000; }
		.ui-colorpalette-sample span:last-child { color: #FFF; }
		.ui-colorpalette-values { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
		.ui-colorpalette-value { width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid #E0E0E0; border-radius: 8px; background: #F6F6F6; color: inherit; font: 13px Menlo, Consolas, monospace; outline: none; }
		.ui-colorpalette-value:focus { border-color: var(--color); }
		.ui-colorpalette-tools { display: flex; gap: 6px; align-items: center; }
		.ui-colorpalette-tool { position: relative; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid #E0E0E0; border-radius: 8px; background: #FFF; color: inherit; cursor: pointer; }
		.ui-colorpalette-tool:hover, .ui-colorpalette-tool:focus-within { border-color: var(--color); color: var(--color); }
		.ui-colorpalette-tool input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
		.ui-colorpalette-apply { margin-left: auto; height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--color); color: #FFF; font: inherit; font-weight: bold; cursor: pointer; }
		.ui-colorpalette-apply:focus-visible { outline: 2px solid var(--color); outline-offset: 2px; }
		.ui-colorpalette-swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; margin-top: 10px; }
		.ui-colorpalette-swatches button { aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 4px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.25); }
		.ui-colorpalette-swatches button:hover, .ui-colorpalette-swatches button:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
		.ui-colorpalette-label { margin-top: 10px; font-size: 11px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.04em; color: #888; }
		.ui-colorpalette-label + .ui-colorpalette-swatches { margin-top: 4px; }

		.ui-dark .ui-colorpalette { background: #252525; color: #E0E0E0; border-color: #404040; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); }
		.ui-dark .ui-colorpalette-value { background: #1E1E1E; border-color: #404040; }
		.ui-dark .ui-colorpalette-tool { background: #2E2E2E; border-color: #404040; }
		.ui-dark .ui-colorpalette-label { color: #999; }

	</style>

	<script component>

		COMPONENT('colorpalette', 'label:Colour;custom:Any colour;copy:Copy;apply:Apply;used:Used colours', function(self, config, cls) {

			var cls2 = '.' + cls;
			var opt = null;
			var target = null;
			var focused = null;
			var value = '';
			var copied;
			var COLUMNS = 12;

			self.singleton();
			self.readonly();

			// Any CSS colour through the browser: { r, g, b, a }
			var parse = function(text) {
				var ctx = document.createElement('canvas').getContext('2d');
				ctx.fillStyle = '#000000';
				ctx.fillStyle = text;
				var color = ctx.fillStyle;
				var match;
				if (color.charAt(0) === '#')
					return { r: parseInt(color.substring(1, 3), 16), g: parseInt(color.substring(3, 5), 16), b: parseInt(color.substring(5, 7), 16), a: 1 };
				if ((match = color.match(/rgba?\(([^)]+)\)/))) {
					var parts = match[1].split(',');
					return { r: parseFloat(parts[0]), g: parseFloat(parts[1]), b: parseFloat(parts[2]), a: parts.length > 3 ? parseFloat(parts[3]) : 1 };
				}
				return { r: 0, g: 0, b: 0, a: 1 };
			};

			var two = function(number) {
				var text = Math.round(number).toString(16);
				return text.length < 2 ? '0' + text : text;
			};

			var hex = function(c, alpha) {
				var output = '#' + two(c.r) + two(c.g) + two(c.b);
				if (alpha && c.a < 1)
					output += two(c.a * 255);
				return output.toUpperCase();
			};

			var hsl = function(c) {
				var r = c.r / 255, g = c.g / 255, b = c.b / 255;
				var max = Math.max(r, g, b), min = Math.min(r, g, b);
				var h = 0, s = 0, l = (max + min) / 2;
				if (max !== min) {
					var d = max - min;
					s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
					h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
					h *= 60;
				}
				return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
			};

			var fromhsl = function(h, s, l) {
				s /= 100;
				l /= 100;
				var a = s * Math.min(l, 1 - l);
				var f = function(n) {
					var k = (n + h / 30) % 12;
					return (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))) * 255;
				};
				return hex({ r: f(0), g: f(8), b: f(4) });
			};

			// The chosen colour written as the original one was: hex (its case), rgb(), rgba(), hsl(), hsla(); the
			// alpha of the original stays when the new colour has none
			self.format = function(original, color) {
				original = String(original || '').trim();
				var c = parse(color);
				var old = original ? parse(original) : null;
				if (old && c.a === 1)
					c.a = old.a;
				if ((/^rgba?\(/i).test(original))
					return c.a < 1 || (/^rgba/i).test(original) ? 'rgba({0}, {1}, {2}, {3})'.format(c.r, c.g, c.b, +c.a.toFixed(2)) : 'rgb({0}, {1}, {2})'.format(c.r, c.g, c.b);
				if ((/^hsla?\(/i).test(original)) {
					var x = hsl(c);
					return c.a < 1 || (/^hsla/i).test(original) ? 'hsla({0}, {1}%, {2}%, {3})'.format(x.h, x.s, x.l, +c.a.toFixed(2)) : 'hsl({0}, {1}%, {2}%)'.format(x.h, x.s, x.l);
				}
				var output = hex(c, original.length === 5 || original.length === 9);
				return original && original === original.toLowerCase() ? output.toLowerCase() : output;
			};

			// 12 hues in 6 shades, and 12 greys
			var PALETTE = (function() {
				var list = [];
				var hues = [0, 15, 30, 45, 60, 90, 140, 175, 200, 220, 260, 300];
				var shades = [92, 80, 65, 50, 38, 26];
				for (var i = 0; i < shades.length; i++) {
					for (var j = 0; j < hues.length; j++)
						list.push(fromhsl(hues[j], shades[i] > 85 ? 80 : 85, shades[i]));
				}
				for (var k = 0; k < 12; k++) {
					var v = 255 - k * (255 / 11);
					list.push(hex({ r: v, g: v, b: v }));
				}
				return list;
			})();

			var swatches = function(list) {
				var builder = [];
				for (var i = 0; i < list.length; i++)
					builder.push('<button type="button" data-color="{0}" style="background:{0}" title="{0}" aria-label="{0}"></button>'.format(list[i]));
				return '<div class="{0}-swatches">{1}</div>'.format(cls, builder.join(''));
			};

			self.make = function() {

				self.aclass(cls + ' hidden');
				self.attr('role', 'dialog');
				self.html('<div class="{0}-top"><div class="{0}-sample" aria-hidden="true"><span>Aa</span><span>Aa</span></div><div class="{0}-values"><input class="{0}-value" maxlength="40" autocomplete="off" spellcheck="false" /><div class="{0}-tools"><label class="{0}-tool {0}-custom"><input type="color" /><i class="ti ti-tint" aria-hidden="true"></i></label><button type="button" class="{0}-tool {0}-copy"><i class="ti ti-copy" aria-hidden="true"></i></button><button type="button" class="{0}-apply"></button></div></div></div>{1}<div class="{0}-used"></div>'.format(cls, swatches(PALETTE)));

				self.event('click', cls2 + '-swatches button', function() {
					self.preview($(this).attrd('color'));
					self.apply();
				});

				self.event('input', 'input[type="color"]', function() {
					self.preview(this.value.toUpperCase());
				});

				self.event('input', cls2 + '-value', function() {
					var text = this.value.trim();
					if (window.CSS && CSS.supports('color', text)) {
						value = text;
						self.find(cls2 + '-sample').css('background', text);
					}
				});

				self.event('keydown', cls2 + '-value', function(e) {
					if (e.key === 'Enter') {
						e.preventDefault();
						self.apply();
					}
				});

				self.event('click', cls2 + '-apply', self.apply);

				self.event('click', cls2 + '-copy', function() {
					var icon = $(this).find('i');
					navigator.clipboard && navigator.clipboard.writeText(self.find(cls2 + '-value').val()).then(function() {
						icon.attr('class', 'ti ti-check');
						copied && clearTimeout(copied);
						copied = setTimeout(function() {
							copied = null;
							icon.attr('class', 'ti ti-copy');
						}, 1200);
					});
				});

				// Arrows move through the swatches, Escape closes everywhere
				self.event('keydown', cls2 + '-swatches button', function(e) {
					var buttons = $(this).parent().find('button');
					var index = buttons.index(this);
					var next = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: COLUMNS, ArrowUp: -COLUMNS }[e.key];
					if (next && buttons[index + next]) {
						e.preventDefault();
						buttons[index + next].focus();
					}
				});

				self.event('keydown', function(e) {
					if (e.key === 'Escape') {
						e.stopPropagation();
						self.hide();
					}
				});

				self.on('resize2', self.hide);
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'label':
						self.find(cls2 + '-value').attr('aria-label', value);
						break;
					case 'custom':
						self.find(cls2 + '-custom').attr('title', value).find('input').attr('aria-label', value);
						break;
					case 'copy':
						self.find(cls2 + '-copy').attr({ title: value, 'aria-label': value });
						break;
					case 'apply':
						self.find(cls2 + '-apply').text(value);
						break;
				}
			};

			self.preview = function(color, text) {
				value = text || color;
				self.find(cls2 + '-sample').css('background', color);
				self.find(cls2 + '-value').val(value);
				self.find('input[type="color"]').val(hex(parse(color)).toLowerCase());
			};

			// opt: { element or x and y (and height), offsetX, offsetY, align, value, colors, callback(color) }
			self.show = function(options) {
				var el = options.element ? (options.element instanceof jQuery ? options.element[0] : (options.element.dom || options.element)) : null;
				if (opt && el && target === el) {
					self.hide();
					return;
				}
				opt = options;
				target = el;
				focused = document.activeElement;

				// The colours already in use, without repeats, at most two rows
				var used = [];
				var list = opt.colors || [];
				for (var i = 0; i < list.length && used.length < 24; i++) {
					var color = hex(parse(list[i]));
					if (used.indexOf(color) === -1)
						used.push(color);
				}
				self.find(cls2 + '-used').html(used.length ? '<div class="{0}-label">{1}</div>{2}'.format(cls, Thelpers.encode(config.used), swatches(used)) : '');

				self.preview(opt.value || '#FFFFFF', opt.value);
				self.rclass('hidden');
				self.place();
				self.find(cls2 + '-value').focus().select();
				setTimeout(function() {
					opt && $(document).on('mousedown.' + self.ID + ' touchstart.' + self.ID, self.outside);
				}, 10);
			};

			self.outside = function(e) {
				if (!self.dom.contains(e.target))
					self.hide();
			};

			// Under the element or the point, or above it when there is no room; always inside the window
			self.place = function() {
				var rect = target ? target.getBoundingClientRect() : { left: opt.x || 0, right: opt.x || 0, top: opt.y || 0, bottom: (opt.y || 0) + (opt.height || 0) };
				var w = self.dom.offsetWidth;
				var h = self.dom.offsetHeight;
				var x = opt.align === 'right' ? rect.right - w : opt.align === 'center' ? rect.left + (rect.right - rect.left - w) / 2 : rect.left;
				var y = rect.bottom + 6 + (opt.offsetY || 0);
				if (y + h > window.innerHeight - 8)
					y = rect.top - h - 6 - (opt.offsetY || 0);
				x = Math.max(8, Math.min(x + (opt.offsetX || 0), window.innerWidth - w - 8));
				self.css({ left: x, top: Math.max(8, y) });
			};

			// The colour goes back in the format of the current value (a hex when there is none)
			self.apply = function() {
				if (!opt)
					return;
				var callback = opt.callback;
				var result = opt.value ? self.format(opt.value, value) : hex(parse(value));
				self.hide();
				callback && callback(result);
			};

			self.hide = function() {
				if (!opt)
					return;
				opt = null;
				target = null;
				$(document).off('.' + self.ID);
				self.aclass('hidden');
				focused && focused.focus && document.body.contains(focused) && focused.focus();
				focused = null;
			};

			self.destroy = function() {
				copied && clearTimeout(copied);
				$(document).off('.' + self.ID);
			};

		});

	</script>

	<p style="padding: 20px 20px 0; font: 13px Arial">
		<button class="pick-color" data-value="rgb(249, 115, 22)" style="font-size: 14px; padding: 6px 12px; cursor: pointer"><span class="sample" style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; background: rgb(249, 115, 22)"></span> <code>rgb(249, 115, 22)</code></button>
		<button class="pick-color" data-value="#2563eb" style="font-size: 14px; padding: 6px 12px; cursor: pointer; margin-left: 6px"><span class="sample" style="display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; background: #2563eb"></span> <code>#2563eb</code></button>
	</p>

	<ui-component name="colorpalette"></ui-component>

	<script>

		// Each button keeps its value: the colour comes back written like it (rgb() stays rgb(), a lower case hex stays a
		// lower case hex)
		$(document).on('click', '.pick-color', function() {
			var button = $(this);
			SETTER('colorpalette/show', { element: this, value: button.attrd('value'), colors: ['#1C1C1A', '#F97316', '#16A34A', '#F97316', '#2563EB'], callback: function(color) {
				button.attrd('value', color);
				button.find('.sample').css('background', color);
				button.find('code').text(color);
			}});
		});

		// The preview shows it open
		setTimeout(function() {
			$('.pick-color').first().trigger('click');
		}, 600);

	</script>

</body>
</html>
