<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-togglemore .ui-togglemore-before { margin-left: 20px; line-height: 20px; cursor: pointer; display: inline-block; }
		.ui-togglemore .ui-togglemore-after { margin-left: 20px; line-height: 20px; }
		.ui-togglemore .ui-togglemore-arrow { float: left; cursor: pointer; user-select: none; color: gray; position: absolute; width: 15px; margin-top: -1px; text-align: center; }
		.ui-togglemore .ui-togglemore-arrow.down { margin-top: 0; }
		.ui-togglemore .ui-togglemore-arrow.down { font-size: 14px; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('togglemore', function(self) {

			var cls = 'ui-togglemore';
			var cls2 = '.' + cls;
			var before, after, arrow, arrowcontainer;
			var showed = false;

			self.readonly();

			self.make = function() {
				self.element.aclass(cls);
				self.event('click', cls2 + '-arrow, ' + cls2 + '-before', self.toggle);
				self.prepare();
			};

			self.toggle = function(force) {

				if (typeof(force) === 'boolean')
					showed = !force;

				showed = !showed;
				after.tclass('hidden', !showed);
				before.tclass('hidden', showed);
				arrowcontainer.tclass('down', showed);
				arrow.rclass2('ti-chevron').aclass('ti-chevron-' + (showed ? 'down' : 'right'));
			};

			self.prepare = function() {

				self.find(' > div').each(function(index) {
					$(this).aclass(cls + '-' + (index === 0 ? 'before' : 'after'));
				});

				self.element.prepend('<div class="' + cls +'-arrow"><i class="ti ti-chevron-right ti-sm"></i></div>');
				before = self.find(cls2 + '-before');
				after = self.find(cls2 + '-after');
				arrowcontainer = self.find(cls2 + '-arrow');
				arrow = self.find(cls2 + '-arrow i');
				after.aclass('hidden');
			};

			self.setter = function() {
				self.toggle(false);
			};
		});

	</script>

	<!-- Example -->
	<div style="width: 400px">
		<ui-component name="togglemore">
			<div>
				BEFORE long text
			</div>
			<div class="hidden">
				AFTER Lorem ipsum dolor sit amet, consectetur adipisicing elit. Assumenda eligendi pariatur perferendis expedita tempora, deserunt sunt, quas similique velit quo, harum odio explicabo ea dicta aliquam ipsa, veniam vitae nemo.
			</div>
		</ui-component>
	</div>

</body>
</html>
