	<style component>

		.ui-calendarchart { --ccempty: #EBEDF0; --ccbase: #F2F2F2; box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }

		.ui-calendarchart-wrap { flex: 1 1 auto; min-width: 0; }

		.ui-calendarchart-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--cccell, 12px)); grid-auto-columns: var(--cccell, 12px); gap: var(--ccgap, 3px); justify-content: start; outline: none; }
		.ui-calendarchart-day { border-radius: 2px; background: var(--ccempty); }
		.ui-calendarchart-day.ui-calendarchart-out { visibility: hidden; }
		.ui-calendarchart-day.ui-calendarchart-on { box-shadow: 0 0 0 2px #1F1F1F; }

		.ui-calendarchart-foot i { width: 10px; height: 10px; border-radius: 2px; }

		.ui-calendarchart-hover .ui-calendarchart-tip { display: block; }
		.ui-calendarchart-tip div { color: rgba(255, 255, 255, .75); }
		.ui-calendarchart-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

		.ui-dark .ui-calendarchart { --ccempty: #2F2F2F; --ccbase: #2E2E2E; border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-calendarchart-minimal { border-color: transparent; background: transparent; }
		.ui-dark .ui-calendarchart-total, .ui-dark .ui-calendarchart-days, .ui-dark .ui-calendarchart-months, .ui-dark .ui-calendarchart-foot { color: #9A9A9A; }
		.ui-dark .ui-calendarchart-total b { color: #EDEDED; }
		.ui-dark .ui-calendarchart-day.ui-calendarchart-on { box-shadow: 0 0 0 2px #FFF; }
		.ui-dark .ui-calendarchart-tip { background: #F2F2F2; color: #1F1F1F; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
		.ui-dark .ui-calendarchart-tip div { color: #5E5E5E; }

		@media (forced-colors: active) {
			.ui-calendarchart { border: 1px solid CanvasText; }
			.ui-calendarchart-day { forced-color-adjust: none; outline: 1px solid GrayText; }

	<script component>

		COMPONENT('calendarchart', 'label:;style:card;days:365;year:;cell:0;steps:5;color:;legend:true;less:;more:;caption:;firstday:;format:number;decimals:0;compact:true;currency:EUR;locale:;click:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var values = {};
			var days = [];
			var levels = [];
			var weeks = 0;
			var visible = 0;
			var cursor = -1;
			var label = '';
			var fmt = {};
			var observer = null;
			var lastwidth = 0;
			var DAY = 86400000;

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var nf = function(options) {
				try {
					return new Intl.NumberFormat(locale(), options);
				} catch (e) {
					return new Intl.NumberFormat(undefined, options);
				}
			};

			var df = function(options) {
				try {
					return new Intl.DateTimeFormat(locale(), options);
				} catch (e) {
					return new Intl.DateTimeFormat(undefined, options);
				}
			};

			var prepare = function() {
				var decimals = Math.max(0, config.decimals || 0);
				var opt = { minimumFractionDigits: 0, maximumFractionDigits: decimals };
				var copt = { notation: 'compact', maximumFractionDigits: 1 };
				if (config.format === 'currency') {
					opt.style = copt.style = 'currency';
					opt.currency = copt.currency = config.currency || 'EUR';
				}
				fmt.full = nf(opt);
				fmt.compact = config.compact ? nf(copt) : null;
				fmt.long = df({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
				fmt.month = df({ month: 'short' });
				fmt.monthyear = df({ month: 'long', year: 'numeric' });
				fmt.weekday = df({ weekday: 'short' });
			};

			var format = function(n) {
				return n == null ? '—' : (fmt.compact && Math.abs(n) >= 10000 ? fmt.compact : fmt.full).format(n);
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			var pad = function(n) {
				return n < 10 ? '0' + n : '' + n;
			};

			var key = function(d) {
				return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
			};

			var firstday = function() {
				if (config.firstday !== '' && config.firstday != null)
					return (+config.firstday) % 7;
				try {
					var info = new Intl.Locale(locale() || navigator.language);
					var week = info.getWeekInfo ? info.getWeekInfo() : info.weekInfo;
					if (week && week.firstDay)
						return week.firstDay % 7;
				} catch (e) {}
				return 1;
			};

			// { '2026-11-22': 120 } or [{ date: '2026-11-22', value: 120 }] or [{ date: Date, value: 120 }]
			var parse = function(model) {
				values = {};
				if (model instanceof Array) {
					for (var i = 0; i < model.length; i++) {
						var item = model[i] || {};
						var d = item.date instanceof Date ? item.date : typeof item.date === 'string' ? new Date(+item.date.substring(0, 4), +item.date.substring(5, 7) - 1, +item.date.substring(8, 10)) : null;
						var n = num(item.value);
						if (d && !isNaN(d.getTime()) && n != null)
							values[key(d)] = (values[key(d)] || 0) + n;
					}
				} else if (model && typeof model === 'object') {
					for (var k in model) {
						var v = num(model[k]);
						if ((/^\d{4}-\d{2}-\d{2}$/).test(k) && v != null)
							values[k] = v;
					}
				}
			};

			// The days of the range, padded to whole weeks from the first day of the locale
			var range = function() {
				var end;
				var start;
				if (config.year) {
					start = new Date(+config.year, 0, 1);
					end = new Date(+config.year, 11, 31);
				} else {
					var t = new Date();
					end = new Date(t.getFullYear(), t.getMonth(), t.getDate());
					start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - Math.max(7, config.days || 365) + 1);
				}
				var first = firstday();
				var offset = (start.getDay() - first + 7) % 7;
				var cursor2 = new Date(start.getFullYear(), start.getMonth(), start.getDate() - offset);
				var list = [];
				while (cursor2 <= end || list.length % 7) {
					list.push({ date: cursor2, key: key(cursor2), out: cursor2 < start || cursor2 > end });
					cursor2 = new Date(cursor2.getFullYear(), cursor2.getMonth(), cursor2.getDate() + 1);
				}
				days = list;
				weeks = list.length / 7;
			};

			// Levels: 0 is no value, then "steps" quantiles of the days with a value, so a few big days do not hide the rest
			var quantize = function() {
				var list = [];
				for (var i = 0; i < days.length; i++) {
					var v = values[days[i].key];
					!days[i].out && v != null && v > 0 && list.push(v);
				}
				list.sort(function(a, b) {
					return a - b;
				});
				var steps = Math.max(2, Math.min(6, config.steps || 5));
				levels = [];
				for (var s = 1; s < steps; s++)
					levels.push(list.length ? list[Math.min(list.length - 1, Math.floor(list.length * s / steps))] : 0);
			};

			var level = function(v) {
				if (v == null || v <= 0)
					return 0;
				var l = 1;
				for (var i = 0; i < levels.length; i++) {
					if (v > levels[i])
						l = i + 2;
				}
				return l;
			};

			var shade = function(l) {
				if (!l)
					return 'var(--ccempty)';
				var steps = Math.max(2, Math.min(6, config.steps || 5));
				return 'color-mix(in srgb, var(--color) ' + Math.round(25 + (l - 1) / (steps - 1) * 75) + '%, var(--ccbase))';
			};

			// Narrow boxes show the last weeks that fit, with cells of 10px at least
			var fit = function() {
				var width = els.wrap.clientWidth;
				var cell = config.cell > 0 ? config.cell : 0;
				var gap = 3;
				if (!cell)
					cell = width ? Math.max(10, Math.min(18, Math.floor((width + gap) / weeks) - gap)) : 12;
				var count = width ? Math.max(1, Math.min(weeks, Math.floor((width + gap) / (cell + gap)))) : weeks;
				self.dom.style.setProperty('--cccell', cell + 'px');
				self.dom.style.setProperty('--ccgap', gap + 'px');
				return { count: count, cell: cell, gap: gap };
			};

			var render = function() {

				range();
				quantize();

				var size = fit();
				visible = size.count;
				lastwidth = els.wrap.clientWidth;
				var from = (weeks - visible) * 7;
				var builder = [];
				var total = 0;
				var active = 0;

				for (var i = from; i < days.length; i++) {
					var d = days[i];
					var v = d.out ? null : values[d.key];
					if (v != null) {
						total += v;
						v > 0 && active++;
					}
					builder.push('<span class="{0}-day{1}" data-index="{2}" style="background:{3}"></span>'.format(cls, d.out ? ' ' + cls + '-out' : '', i, d.out ? 'transparent' : shade(level(v))));
				}
				els.grid.innerHTML = builder.join('');

				// Month names over the first week that contains the 1st day of the month
				var months = [];
				var step = size.cell + size.gap;
				var lastx = -100;
				for (var w = 0; w < visible; w++) {
					for (var r = 0; r < 7; r++) {
						var day = days[from + w * 7 + r];
						if (!day.out && day.date.getDate() === 1) {
							var x = w * step;
							if (x - lastx > 30) {
								months.push('<span style="left:{0}px">{1}</span>'.format(x, esc(fmt.month.format(day.date))));
								lastx = x;
							}
						}
					}
				}
				els.months.innerHTML = months.join('');

				// Day names on the second, fourth and sixth row
				var names = [];
				for (r = 0; r < 7; r++)
					names.push('<span>{0}</span>'.format(r % 2 ? esc(fmt.weekday.format(days[r].date)) : ''));
				els.days.innerHTML = names.join('');

				// Legend: less, the steps, more (texts of the configuration, or the lowest and highest value)
				var steps = Math.max(2, Math.min(6, config.steps || 5));
				var legend = ['<span>{0}</span>'.format(esc(config.less || (levels.length ? format(0) : '')))];
				for (var l = 0; l <= steps; l++)
					legend.push('<i style="background:{0}"></i>'.format(shade(l)));
				legend.push('<span>{0}</span>'.format(esc(config.more || (levels.length ? '> ' + format(levels[levels.length - 1]) : ''))));
				els.foot.innerHTML = legend.join('');

				els.total.innerHTML = '<b>{0}</b>{1}'.format(esc(format(total)), config.caption ? ' ' + esc(config.caption) : '');

				// A table for screen readers: the total per month
				var permonth = {};
				var order = [];
				for (i = from; i < days.length; i++) {
					if (days[i].out)
						continue;
					var mk = days[i].key.substring(0, 7);
					if (permonth[mk] == null) {
						permonth[mk] = 0;
						order.push({ key: mk, date: days[i].date });
					}
					permonth[mk] += values[days[i].key] || 0;
				}
				var rows = order.map(function(m) {
					return '<tr><th scope="row">{0}</th><td>{1}</td></tr>'.format(esc(fmt.monthyear.format(m.date)), esc(format(permonth[m.key])));
				});
				els.table.innerHTML = '<table><caption>{0}</caption><tbody>{1}</tbody></table>'.format(esc(els.title.textContent.trim()), rows.join(''));

				cursor !== -1 && cursor >= from && show(cursor, false);
			};

			var show = function(index, announce) {
				var d = days[index];
				var cell = els.grid.querySelector('[data-index="' + index + '"]');
				if (!d || !cell || d.out)
					return;
				cursor = index;
				var old = els.grid.querySelector(cls2 + '-on');
				old && old.classList.remove(cls + '-on');
				cell.classList.add(cls + '-on');
				var date = fmt.long.format(d.date);
				var text = format(values[d.key] == null ? 0 : values[d.key]);
				els.tip.innerHTML = '<div>{0}</div><b>{1}</b>'.format(esc(date), esc(text));
				self.aclass(cls + '-hover');
				var rect = els.body.getBoundingClientRect();
				var box = cell.getBoundingClientRect();
				var tw = els.tip.offsetWidth;
				var th = els.tip.offsetHeight;
				var x = Math.max(0, Math.min(rect.width - tw, box.left - rect.left + box.width / 2 - tw / 2));
				var y = box.top - rect.top - th - 6;
				if (y < 0)
					y = box.bottom - rect.top + 6;
				els.tip.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
				if (announce)
					els.live.textContent = date + ': ' + text;
			};

			var hide = function() {
				cursor = -1;
				var old = els.grid.querySelector(cls2 + '-on');
				old && old.classList.remove(cls + '-on');
				self.rclass(cls + '-hover');
			};

			var run = function(index) {
				var d = days[index];
				d && !d.out && config.click && self.EXEC(config.click, { date: d.date, key: d.key, value: values[d.key] == null ? null : values[d.key] }, self);
			};

			self.make = function() {

				label = self.html().trim();
				self.aclass(cls);
				self.html(('<div class="{0}-top"><div class="{0}-title"></div><div class="{0}-total"></div></div>' +
					'<div class="{0}-body"><div class="{0}-days" aria-hidden="true"></div><div class="{0}-wrap"><div class="{0}-months" aria-hidden="true"></div><div class="{0}-grid" tabindex="0" role="group"></div></div><div class="{0}-tip" aria-hidden="true"></div></div>' +
					'<div class="{0}-foot" aria-hidden="true"></div><div class="{0}-sr {0}-table"></div><div class="{0}-sr" aria-live="polite"></div>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.total = self.find(cls2 + '-total')[0];
				els.body = self.find(cls2 + '-body')[0];
				els.days = self.find(cls2 + '-days')[0];
				els.wrap = self.find(cls2 + '-wrap')[0];
				els.months = self.find(cls2 + '-months')[0];
				els.grid = self.find(cls2 + '-grid')[0];
				els.tip = self.find(cls2 + '-tip')[0];
				els.foot = self.find(cls2 + '-foot')[0];
				els.table = self.find(cls2 + '-table')[0];
				els.live = self.find(cls2 + '-sr[aria-live]')[0];

				prepare();

				self.event('mouseover', cls2 + '-day', function() {
					show(+this.getAttribute('data-index'));
				});

				self.event('mouseleave', cls2 + '-grid', function() {
					document.activeElement !== els.grid && hide();
				});

				self.event('click', cls2 + '-day', function() {
					run(+this.getAttribute('data-index'));
				});

				// Columns are weeks: left and right move a week, up and down a day
				self.event('keydown', cls2 + '-grid', function(e) {
					var from = (weeks - visible) * 7;
					var last = days.length - 1;
					while (last > 0 && days[last].out)
						last--;
					var index = cursor === -1 ? last : cursor;
					switch (e.key) {
						case 'ArrowLeft':
							index -= cursor === -1 ? 0 : 7;
							break;
						case 'ArrowRight':
							index += cursor === -1 ? 0 : 7;
							break;
						case 'ArrowUp':
							index -= cursor === -1 ? 0 : 1;
							break;
						case 'ArrowDown':
							index += cursor === -1 ? 0 : 1;
							break;
						case 'Home':
							index = from;
							break;
						case 'End':
							index = last;
							break;
						case 'Enter':
						case ' ':
							e.preventDefault();
							cursor !== -1 && run(cursor);
							return;
						case 'Escape':
							hide();
							return;
						default:
							return;
					}
					e.preventDefault();
					index = Math.max(from, Math.min(last, index));
					while (days[index] && days[index].out && index < last)
						index++;
					show(index, true);
				});

				self.event('blur', cls2 + '-grid', hide);

				if (window.ResizeObserver) {
					observer = new ResizeObserver(function() {
						els.wrap.clientWidth !== lastwidth && setTimeout2(self.ID + 'resize', render, 60);
					});
					observer.observe(els.wrap);
				}
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						els.title.innerHTML = value || label;
						var text = els.title.textContent.trim();
						self.tclass(cls + '-notitle', !text);
						text ? els.grid.setAttribute('aria-label', text) : els.grid.removeAttribute('aria-label');
						!init && render();
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'legend':
						self.tclass(cls + '-nolegend', !value);
						break;
					case 'click':
						self.tclass(cls + '-clickable', !!value);
						break;
					case 'color':
						var m = (/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i).exec(value || '');
						if (m) {
							var h = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1];
							self.dom.style.setProperty('--color', '#' + h);
							self.dom.style.setProperty('--rgb', [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)].join(', '));
						} else {
							self.dom.style.removeProperty('--color');
							self.dom.style.removeProperty('--rgb');
						}
						break;
					case 'days':
					case 'year':
					case 'cell':
					case 'steps':
					case 'less':
					case 'more':
					case 'caption':
					case 'firstday':
						!init && render();
						break;
					case 'format':
					case 'decimals':
					case 'compact':
					case 'currency':
					case 'locale':
						if (!init) {
							prepare();
							render();
						}
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				render();
			};

			self.destroy = function() {
				observer && observer.disconnect();
				clearTimeout2(self.ID + 'resize');
			};

		});

	</script>

	<div style="max-width:960px;padding:12px;display:grid;gap:16px">

		<ui-component name="calendarchart" path="cal.visits" config="days:126;caption:visits;less:Less;more:More;click:ondayclick">Visits per day</ui-component>

		<ui-component name="calendarchart" path="cal.year" config="caption:visits in the last year;less:Less;more:More">Visits in the last year</ui-component>

	<script>

		var make = function(days, base, weekend, seed) {
			var out = {};
			var s = seed;
			var t = new Date();
			for (var i = 0; i < days; i++) {
				var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i);
				s = (s * 16807) % 2147483647;
				var r = s / 2147483647;
				var w = d.getDay() === 0 || d.getDay() === 6;
				var v = r < 0.06 ? 0 : Math.round(base * (w ? weekend : 1) * (0.4 + r * 1.2) * (1 + (days - i) / days * 0.6));
				out[d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2)] = v;
			}
			return out;
		};
