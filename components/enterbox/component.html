<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-enterbox { border: 1px solid #E0E0E0; border-radius: var(--radius); padding: 0 1px; background-color: #FFF; }
		.ui-enterbox-input input { width: 100%; border: 0; background: #FFF; outline: 0; font-size: 16px; }
		.ui-enterbox-input { margin-right: 60px; padding: 10px 10px 0; height: 40px; }
		.ui-enterbox-button { float: right; width: 60px; border-left: 1px solid #E0E0E0; }
		.ui-enterbox-button button { width: 100%; background-color: #FFF; outline: 0; border: 0; font-size: 22px; height: 40px; cursor: pointer; }
		.ui-enterbox-button button:hover { background-color: #F8F8F8; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('enterbox', function(self, config, cls) {

			self.readonly();
			self.nocompile();

			self.configure = function(key, value, init) {
				if (init)
					return;
				switch (key) {
					case 'icon':
						self.find('i').rclass().aclass(self.icon(value));
						break;
					case 'placeholder':
						self.find('input').prop('placeholder', value);
						break;
					case 'maxlength':
						self.find('input').prop('maxlength', value);
						break;
				}
			};

			self.make = function() {
				self.aclass(cls);
				self.append('<div class="{3}-button"><button><i class="{0}"></i>{4}</button></div><div class="{3}-input"><input type="text" placeholder="{1}" maxlength="{2}" /></div>'.format(self.icon(config.icon) || 'ti ti-keyboard', config.placeholder, config.maxlength || 50, cls, config.button || ''));
				self.event('click', 'button', self.submit);
				self.event('keyup', 'input', function(e) {
					e.which === 13 && self.submit();
				});
			};

			self.submit = function() {
				var val = self.find('input').val();
				config.exec && self.EXEC(config.exec, val);
				self.path && self.set(val);
			};

			self.clear = function() {
				self.find('input').val('');
				config.exec && self.EXEC(config.exec, '');
				self.path && self.set('');
			};

			self.setter = function(value) {
				self.find('input').val(value == null ? '' : value.toString());
			};
		});

	</script>

	<!-- Example -->
	<div style="padding:50px;max-width:300px">
		<ui-component name="enterbox" config="exec:enterbox_enter;icon:ti ti-search;placeholder:Search and press enter ..."></ui-component>
	</div>

	<script>
		function enterbox_enter(value) {
			alert(value);
		}
	</script>

</body>
</html>
