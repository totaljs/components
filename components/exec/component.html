<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.exec { cursor: pointer; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('exec', function(self, config) {

			var regparent = /\?\d/;
			var extensions = [];
			var skiptimeout = null;

			self.readonly();
			self.blind();
			self.singleton();

			self.register = function(fn) {
				extensions.push(fn);
			};

			self.make = function() {

				var fn = function(plus, forceprevent) {
					return function execlick(e) {

						var el = $(this);

						if (!plus && skiptimeout)
							return;

						if (!e.$force && !plus && el.hclass('exec2')) {
							skiptimeout && clearTimeout(skiptimeout);
							skiptimeout = setTimeout(function(ctx, e) {
								skiptimeout = null;
								e.$force = true;
								execlick.call(ctx, e);
							}, 300, this, e);
							return;
						}

						var attr = el.attrd('exec' + plus);
						var href = el.attrd('href' + plus);

						if (skiptimeout) {
							clearTimeout(skiptimeout);
							skiptimeout = null;
						}

						var prevent = forceprevent ? '1' : el.attrd('prevent' + plus);
						if (prevent === 'true' || prevent === '1') {
							e.preventDefault();
							e.stopPropagation();
						}

						if (attr) {
							if (extensions.length) {
								for (var ext of extensions) {
									if (ext(attr, el, e, plus))
										return;
								}
							}
							if (M.is20) {
								// el.EXEC() tries to find the closest plugin
								el.EXEC(attr, el, e);
							} else {
								if (attr.includes('?'))
									attr = el.scope().makepath(attr);
								EXEC(attr, el, e);
							}
						}

						href && REDIRECT(href);
					};
				};

				var el = $(document.body);
				el.on('contextmenu', config.selector3 || '.exec3', fn('3', true));
				el.on('dblclick', config.selector2 || '.exec2', fn('2'));
				el.on('click', config.selector || '.exec', fn(''));
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="exec"></ui-component>
	<a href="javascript:void(0)" class="exec" data-exec="myClick">1</a>
	<a href="javascript:void(0)" class="exec" data-exec="myClick">2</a>
	<p class="exec" data-exec="myClick">3</p>
	<span class="exec" data-exec="myClick">4</span>
	<div class="exec" data-exec="myClick">5</div>

	<script>
		function myClick(el) {
	        alert('CLICK: ' + el.html());
	    }
	</script>

</body>
</html>
