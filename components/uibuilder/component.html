<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-uibuilder {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('uibuilder', 'css:1', function(self, config, cls) {

			self.make = function() {
				self.aclass(cls);
				var scr = self.find('scr' + 'ipt');
				if (scr.length > 0) {
					var meta = PARSE(scr.html());
					self.empty();
					self.load(meta);
				}
			};

			self.done = function() {
				config.url && AJAX('GET ' + config.url, self.load);
			};

			self.load = function(data) {

				if (!data || data instanceof Array || typeof(data) !== 'object')
					return;

				if (self.app) {
					self.app.remove();
					self.app = null;
					config.app && self.SEEX(config.app, null);
				}

				if (config.id)
					data.id = config.id;

				UIBuilder.build(self.element, data, function(response) {

					if (!config.css)
						response.css = '';

					response.component = self;
					response.schema = data;
					self.app = response;
					config.app && self.SEEX(config.app, response, data);
					config.output && self.app.on('output', function(meta) {
						self.SEEX(config.output, meta);
					});
				});
			};

			self.setter = function(value) {
				if (value) {
					if (typeof(value) === 'string')
						AJAX('GET ' + value, self.load);
					else
						self.load(value);
				} else if (self.app) {
					self.app.remove();
					self.app = null;
					config.app && self.SEEX(config.app, null);
				}
			};

		}, [function(next) {
			let cdn = (DEF.cdn || 'https://cdn.componentator.com');
			IMPORT('<UIBuilder> {0}/uibuilder.min@1.js'.format(cdn), next);
		}]);

	</script>

	<!-- Example -->
	<ui-component name="uibuilder" config="url:https://cdn.componentator.com/uibuilder/demo/render/dashboard.json"></ui-component>

</body>
</html>
