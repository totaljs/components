<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-autoexec {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('autoexec', 'delay:0;init:0;manually:0;input:1', function(self, config) {

			var delay = null;
			var track = [];

			self.readonly();

			var exec = function() {
				delay = null;
				config.exec && self.EXEC(config.exec, self.element, self.get());
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'track':
						track = value.split(',').trim();
						break;
				}
			};

			self.setter = function(value, path, flags) {

				var is = false;
				var type = flags;

				if (jComponent.v20) {
					if (flags.init)
						type =0;
					else if (flags.touched)
						type = 2;
					else if (flags.modified)
						type = 1;
				}

				if ((type === 1 || type === 2) && track.length) {
					for (var p of track) {
						if (path.indexOf(p) !== -1) {
							is = true;
							break;
						}
					}
					if (!is)
						return;
				}

				switch (type) {
					case 0:
						if (!config.init)
							return;
						break;
					case 1:
					case 3:
						if (!config.manually)
							return;
						break;
					case 2:
						if (!config.input)
							return;
						break;
				}

				if (config.delay) {
					delay && clearTimeout(delay);
					delay = setTimeout(exec, config.delay);
				} else
					exec(value);
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="autoexec" path="common.value" config="exec:autoexec;manually:1"></ui-component>

	<script>

		function autoexec(el, value) {
			console.log('Exec:', value);
			el.html(value);
		}

		var common = {};

		setInterval(function() {
			SET('common.value', new Date().format('HH:mm:ss'));
		}, 1000);

	</script>

</body>
</html>
