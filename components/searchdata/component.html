<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-searchdata {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('searchdata', 'class:hidden;delay:50;key:name;splitwords:1', function(self, config, cls) {

			self.readonly();

			self.configure = function(key, value) {
				if (key === 'datasource')
					self.datasource(value, self.search);
			};

			self.searchforce = function() {

				var value = self.get();
				var datasource = GET(self.makepath(config.datasource)) || EMPTYARRAY;

				if (!value) {
					self.rclass2(cls + '-');
					config.output && SET(self.makepath(config.output), datasource);
					return;
				}

				var raw = value.trim();
				var search = raw.toSearch();
				var output = [];
				var is = false;

				if (config.splitwords) {
					search = search.split(' ');
					raw = raw.split(' ');
				}

				self.aclass(cls + '-used');

				for (var item of datasource) {

					var val = item[config.key] || '';
					var fuzzy = val.toSearch();

					if (search instanceof Array) {

						for (var j = 0; j < raw.length; j++) {
							if (val.indexOf(raw[j]) === -1) {
								is = true;
								break;
							}
						}

						if (is) {
							is = false;
							for (var j = 0; j < search.length; j++) {
								if (fuzzy.indexOf(search[j]) === -1) {
									is = true;
									break;
								}
							}
						}
					} else
						is = fuzzy.indexOf(search) === -1 && val.indexOf(raw) === -1;

					if (!is)
						output.push(item);
				}

				self.tclass(cls + '-empty', !output.length);
				config.output && SET(self.makepath(config.output), output);
			};

			self.search = function() {
				setTimeout2(self.ID, self.searchforce, config.delay);
			};

			self.setter = self.search;
		});

	</script>

	<!-- Example -->
	<ui-component name="textbox" path="search" config="type:search"></ui-component>
	<br />
	<ui-component name="searchdata" path="search" config="datasource:searchitems;output:searchoutput">
		<ui-bind path="searchoutput" config="template" class="block">
			<script type="text/html">
				{{ foreach m in value }}
					<div>{{ m.name }}</div>
				{{ end }}
			</script>
		</ui-bind>
	</ui-component>

	<script>

		// Search phrase
		var search = '';

		// Datasource for filtering
		var searchitems = [{ name: 'Apples' }, { name: 'Oranges' }, { name: 'Pears' }, { name: 'Black-eye bean' }, { name: 'Broccoli' }];

		// Here will be stored all filtered items
		var searchoutput = [];

	</script>

</body>
</html>
