<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		/* This package has no CSS */
	</style>

	<!-- Source-code -->
	<script component>

		FUNC.csv = function(filename, columns, arr) {
			IMPORT('ONCE https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/1.3.8/FileSaver.min.js', function() {

				var builder = [];
				var tmp = [];

				if (arr == null) {

					// get columns

					arr = columns;
					columns = {};

					for (var i = 0; i < arr.length; i++) {
						var keys = Object.keys(arr[i]);
						for (var j = 0; j < keys.length; j++) {
							var key = keys[j];
							columns[key] = 1;
						}
					}

					columns = Object.keys(columns);
				}

				for (var i = 0; i < columns.length; i++)
					tmp.push('"{0}"'.format(columns[i]));

				builder.push(tmp.join(';'));

				for (var i = 0; i < arr.length; i++) {
					tmp = [];
					for (var j = 0; j < columns.length; j++) {
						var val = arr[i][columns[j]];
						switch (typeof(val)) {
							case 'string':
								tmp.push('"{0}"'.format(val.trim()));
								break;
							case 'number':
								tmp.push(val.toString().replace('.', ','));
								break;
							case 'boolean':
								tmp.push(val ? 'true' : 'false');
								break;
							case 'object':
								if (val instanceof Date)
									tmp.push(val.format('yyyy-MM-dd'));
								else
									tmp.push(val == null ? 'null' : val.toString());
								break;
							default:
								tmp.push('');
								break;
						}
					}
					builder.push(tmp.join(';'));
				}

				var file = new Blob(['\uFEFF' + builder.join('\n')], { type: 'application/vnd.ms-excel;charset=utf-8' });
				saveAs(file, filename);
			});
		};

	</script>

	<!-- Example -->
	<button>CSV export</button>

	<script>
		$(document).on('click', 'button', function() {
			FUNC.csv('example.csv', [{ name: 'Name 1', price: 1, date: new Date() }, { name: 'Name 2', price: 2, date: new Date() }, { name: 'Name 3', price: 3, date: new Date() }]);
		});
	</script>

</body>
</html>
