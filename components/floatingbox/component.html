<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-floatingbox-visible { position: fixed; width: 100%; height: 100%; left: 0; top: 0; display: block !important; }
		.ui-floatingbox-container { display: none; }
		.floatingbox { position: absolute; z-index: 0; visibility: hidden; background-color: #FFF; box-shadow: rgb(15 15 15 / 5%) 0 0 0 1px, rgb(15 15 15 / 10%) 0 3px 6px, rgb(15 15 15 / 20%) 0 9px 24px; border-radius: var(--radius); transition: all 0.08s; transform: scale(0.7); pointer-events: none; }
		.floatingbox-visible { z-index: 10; visibility: visible; transform: scale(1); pointer-events: all; }

		.ui-dark .floatingbox { background-color: #303030; box-shadow: rgb(15 15 15 / 5%) 0 0 0 1px, rgb(15 15 15 / 10%) 0 3px 6px, rgb(15 15 15 / 20%) 0 9px 24px; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('floatingbox', 'zindex:10', function(self, config, cls) {

			var clsvisible = 'floatingbox-visible';
			var is = false;
			var open = [];
			var processed = {};

			var makepath = function(val, scope) {
				return val.replace(/\?/g, scope);
			};

			self.readonly();
			self.singleton();

			self.make = function() {

				var e_click = function(e) {
					if (e.target === self.dom)
						self.hide();
				};

				var e_resize = function() {
					is && self.hide(true);
				};

				self.bindedevents = false;

				self.bindevents = function() {
					if (!self.bindedevents) {
						$(document).on('click', e_click);
						$(W).on('resize', e_resize);
						self.bindedevents = true;
					}
				};

				self.unbindevents = function() {
					if (self.bindedevents) {
						self.bindedevents = false;
						$(document).off('click', e_click);
						$(W).off('resize', e_resize);
					}
				};

				var fn = function() {
					is && self.hide(true);
				};

				self.css('z-index', config.zindex);
				self.on('reflow + resize + resize2', fn);
				self.aclass(cls + '-container');
				$(W).on('scroll', fn);
			};

			var animate = function(el) {
				el.aclass(clsvisible);
			};

			self.show = function(opt) {

				// opt.id
				// opt.element
				// opt.offsetX     --> offsetX
				// opt.offsetY     --> offsetY
				// opt.placeholder
				// opt.show
				// opt.custom
				// opt.minwidth
				// opt.maxwidth
				// opt.classname
				// opt.height
				// opt.scope;
				// opt.autofocus
				// opt.delay
				// opt.url
				// |-- opt.path
				// |-- opt.ID

				opt.box = $('.floatingbox[data-id="{0}"]'.format(opt.id));

				if (!opt.box.length) {

					if (opt.url) {
						if (!processed[opt.url]) {
							processed[opt.url] = 1;
							IMPORT(opt.url, function() {
								setTimeout(self.show, 100, opt);
							}, function(content) {
								return ADAPT(opt.path, opt.ID || opt.id || '', content);
							});
							return;
						}
					}

					setTimeout(self.show, 500, opt);
					return;
				}

				opt.config = (opt.box.attrd('config') || '').parseConfig();

				if (opt.config.scope)
					opt.scope = opt.config.scope;
				else if (opt.config.path)
					opt.path = opt.config.path;

				opt.initialized = 1;

				if (!opt.box[0].$processed) {
					opt.initialized = 0;
					opt.box[0].$processed = true;
					self.dom.appendChild(opt.box[0]);
					opt.box.rclass('invisible hidden');
				}

				self.aclass(cls + '-visible');

				var element = opt.element ? $(opt.element) : null;
				setTimeout(self.bindevents, 500);

				var w = opt.box.width();
				var offset = element ? element.offset() : null;
				var width = w + (opt.offsetWidth || 0);
				var options = { left: opt.x || 0, top: opt.y || 0 };

				if (opt.minwidth && width < opt.minwidth) {
					width = opt.minwidth;
					options.width = width;
				} else if (opt.maxwidth && width > opt.maxwidth) {
					width = opt.maxwidth;
					options.width = width;
				}

				if (element) {
					switch (opt.align) {
						case 'center':
							options.left = Math.ceil((offset.left - width / 2) + (opt.element.innerWidth() / 2));
							break;
						case 'right':
							options.left = (offset.left - width) + opt.element.innerWidth();
							break;
						default:
							options.left = offset.left;
							break;
					}
					options.top = opt.position === 'bottom' ? ((offset.top - opt.box.height()) + element.height()) : offset.top;
				}

				if (opt.offsetX)
					options.left += opt.offsetX;

				if (opt.offsetY)
					options.top += opt.offsetY;

				if (opt.scrolltop)
					options.top -= $(W).scrollTop();

				var mw = width;
				var mh = opt.box.height();

				if (options.left < 0)
					options.left = 10;
				else if ((mw + options.left) > WW)
					options.left = (WW - mw) - 10;

				if (options.top < 0)
					options.top = 10;
				else if ((mh + options.top) > WH)
					options.top = (WH - mh) - 10;

				options['z-index'] = opt.config.zindex || (config.zindex + open.length + 1);
				opt.box.css(options);
				opt.box.SETTER('*/resize');

				setTimeout(animate, 50, opt.box);

				if (!open.findItem('id', opt.id))
					open.push(opt);

				if (!opt.scope)
					opt.scope = opt.box.attrd('scope');

				opt.prevscope = M.scope();
				opt.scope && M.scope(opt.scope);
				opt.init && opt.init();

				if (!opt.initialized && opt.config.init)
					EXEC(makepath(opt.config.init, opt.scope), opt.box);

				opt.config.reload && EXEC(makepath(opt.config.reload, opt.scope), opt.box);
				opt.mouseleave && opt.box.on('mouseleave', function(e) {
					opt.mouseleave(e, function() {
						close(opt);
					});
				});

				if (opt.autohide)
					opt.box.on('click', self.hide);

				opt.autofocus && self.autofocus(opt.autofocus);
				is = true;

				opt.show && opt.show(opt.box);
			};

			var close = function(item) {
				if (item) {
					item.box.rclass(clsvisible);
					item.hide && item.hide(item.box);
					item.config.hide && EXEC(makepath(item.config.hide, item.scope), item.box);
					item.mouseleave && item.box.off('mouseleave', item.mouseleave);
					item.prevscope && M.scope(item.prevscope);
				}
			};

			self.hide = function(all) {
				if (all) {
					if (typeof(all) === 'string') {
						var index = open.findIndex('id', all);
						var count = open.length - index;
						for (var i = 0; i <= count; i++)
							close(open.pop());
					} else {
						while (open.length)
							close(open.pop());
					}
				} else
					close(open.pop());

				if (!open.length) {
					self.rclass(cls + '-visible');
					self.unbindevents();
				}
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="exec"></ui-component>
	<ui-component name="floatingbox" config="zindex:10"></ui-component>

	<!-- Form templates -->

	<div class="floatingbox" data-id="1" style="width:200px">
		<div class="padding">
			<div>Box 1</div>
			<br />
			<br />
			<br />
		</div>
	</div>

	<div class="floatingbox" data-id="2" data-config="init:box2init">
		<div class="padding">
			<div>Box 2</div>
			<br />
			<br />
			<br />
			<span class="exec" data-exec="showbox" data-id="3" style="color:#2A6CEC;cursor:pointer;text-decoration:underline">Show box 3</span>
		</div>
	</div>

	<div class="floatingbox" data-id="3">
		<div class="padding">
			Box 3
		</div>
	</div>

	<!-- Executors -->

	<div class="row">
		<div class="col-xs-4">
			<span class="exec" data-exec="showbox" data-id="1" style="color:#2A6CEC;cursor:pointer;text-decoration:underline" class="block">Show box 1</span>
		</div>
		<div class="col-xs-4">
			<span class="exec" data-exec="showbox" data-id="2" style="color:#2A6CEC;cursor:pointer;text-decoration:underline" class="block">Show box 2</span>
		</div>
		<div class="col-xs-4">
			<span class="exec" data-exec="showbox" data-id="3" style="color:#2A6CEC;cursor:pointer;text-decoration:underline" class="block">Show box 3</span>
		</div>
	</div>

	<script>

		function showbox(el) {
			var opt = {};
			opt.element = el;
			opt.id = el.attrd('id');
			SETTER('floatingbox/show', opt);
		}

		function box2init(el) {
			console.log('Box 2 is initialized', el);
		}

	</script>

</body>
</html>
