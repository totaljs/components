<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-dragdropelement { min-height: 16px; position: relative; }
		.ui-dragdropelement-area { background-color: rgba(229,229,229,0.3) !important; position: absolute; inset: 0; border: 1px dashed #000; border-radius: var(--radius); text-align: center; display: grid; place-content: center; }
		.ui-dragdropelement-area span { color: #000; font-size: 14px; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('dragdropelement', function(self, config, cls) {

			var area;
			var timeoutid;

			self.readonly();
			self.destroy = function () {
				area.off('*').remove();
			};

			self.make = function () {

				var hidden = true;
				var text = '';

				if (config.text)
					text = '<span>{0}</span>'.format(config.text);

				self.aclass(cls);
				self.append('<div class="{0}-area hidden">{1}</div>'.format(cls, text));
				area = self.find('.' + cls + '-area');

				var show = function(e) {

					e.stopPropagation();
					e.preventDefault();

					if (config.disabled)
						return;

					if (timeoutid) {
						clearTimeout(timeoutid);
						timeoutid = null;
					} else {
						if (hidden) {
							area.rclass('hidden');
							hidden = false;
						}
					}
				};

				var hide = function(e) {

					e.stopPropagation();
					e.preventDefault();

					if (config.disabled)
						return;

					if (!timeoutid) {
						timeoutid = setTimeout(function () {
							area.aclass('hidden');
							timeoutid = null;
							hidden = true;
						}, 100);
					}
				};

				var finish = function (e) {
					if (config.disabled)
						return;
					self.EXEC(config.exec, e.originalEvent.dataTransfer.files, e, self);
				};

				area.on('dragenter dragover', show);
				area.on('drop dragleave', hide);
				area.on('drop', finish);

				self.event('dragenter dragover', show);
				self.event('drop dragleave', hide);
				self.event('drop', finish);
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="dragdropelement" config="exec:console.log;">
		<button>Upload (drag &amp; drop file)</button>
	</ui-component>

</body>
</html>
