<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		.ui-scoregauge { --sgtrack: #ECECEC; --sggood: #0CA30C; --sgwarn: #E09A00; --sgbad: #D03B3B; --sgtext: #1F1F1F; display: inline-flex; flex-direction: column; align-items: center; gap: 6px; box-sizing: border-box; padding: 14px 16px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: var(--sgtext); font-size: 13px; text-align: center; }
		.ui-scoregauge-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-scoregauge-title { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
		.ui-scoregauge-notitle .ui-scoregauge-title { display: none; }
		.ui-scoregauge-dial { position: relative; }
		.ui-scoregauge-dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
		.ui-scoregauge-track { fill: none; stroke: var(--sgtrack); stroke-linecap: round; }
		.ui-scoregauge-arc { fill: none; stroke: var(--color); stroke-linecap: round; transition: stroke-dashoffset .6s ease-out, stroke .3s; }
		.ui-scoregauge-good .ui-scoregauge-arc { stroke: var(--sggood); }
		.ui-scoregauge-warn .ui-scoregauge-arc { stroke: var(--sgwarn); }
		.ui-scoregauge-bad .ui-scoregauge-arc { stroke: var(--sgbad); }
		.ui-scoregauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 6%; }
		.ui-scoregauge-value { font-weight: 700; line-height: 1; letter-spacing: -.02em; }
		.ui-scoregauge-unit { margin-top: 4px; color: #5E5E5E; font-size: 12px; }
		.ui-scoregauge-state { display: none; align-items: center; gap: 5px; min-height: 20px; font-weight: 600; }
		.ui-scoregauge-good .ui-scoregauge-state, .ui-scoregauge-warn .ui-scoregauge-state, .ui-scoregauge-bad .ui-scoregauge-state { display: inline-flex; }
		.ui-scoregauge-good .ui-scoregauge-state i { color: var(--sggood); }
		.ui-scoregauge-warn .ui-scoregauge-state i { color: var(--sgwarn); }
		.ui-scoregauge-bad .ui-scoregauge-state i { color: var(--sgbad); }
		.ui-scoregauge-scale { display: flex; justify-content: space-between; width: 100%; margin-top: -8px; color: #8A8A8A; font-size: 11px; font-variant-numeric: tabular-nums; }
		.ui-scoregauge-noscale .ui-scoregauge-scale { display: none; }

		@media (prefers-reduced-motion: reduce) {
			.ui-scoregauge-arc { transition: none; }
		}

		.ui-dark .ui-scoregauge { --sgtrack: #3A3A3A; --sggood: #4CC94C; --sgwarn: #FAB219; --sgbad: #EE6B6B; --sgtext: #EDEDED; border-color: #3A3A3A; background: #252525; }
		.ui-dark .ui-scoregauge-minimal { border-color: transparent; background: transparent; }
		.ui-dark .ui-scoregauge-unit { color: #ABABAB; }

		@media (forced-colors: active) {
			.ui-scoregauge { border: 1px solid CanvasText; }
			.ui-scoregauge-arc { stroke: Highlight !important; }
			.ui-scoregauge-track { stroke: GrayText; }
		}

	</style>

	<script component>

		COMPONENT('scoregauge', 'label:;style:card;size:150;thickness:12;min:0;max:100;bands:50,90;goodup:true;states:;unit:;scale:false;format:number;decimals:0;locale:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var els = {};
			var current = null;
			var fmt = null;
			var label = '';
			var SWEEP = 240;

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var prepare = function() {
				var opt = { maximumFractionDigits: Math.max(0, config.decimals || 0) };
				if (config.format === 'percent')
					opt.style = 'percent';
				try {
					fmt = new Intl.NumberFormat(locale(), opt);
				} catch (e) {
					fmt = new Intl.NumberFormat(undefined, opt);
				}
			};

			var format = function(n) {
				return n == null ? '—' : fmt.format(config.format === 'percent' ? n / 100 : n);
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) ? value : null;
			};

			// "50,90": below 50 is bad, below 90 needs work, from 90 good (reversed with goodup:false)
			var bands = function() {
				var list = (config.bands + '').split(',').map(num).filter(function(v) {
					return v != null;
				});
				return list.length ? list.slice(0, 2).sort(function(a, b) {
					return a - b;
				}) : [];
			};

			var state = function(n) {
				var b = bands();
				if (n == null || !b.length)
					return '';
				var low = b[0];
				var high = b.length > 1 ? b[1] : b[0];
				if (config.goodup)
					return n >= high ? 'good' : n >= low ? 'warn' : 'bad';
				return n <= low ? 'good' : n <= high ? 'warn' : 'bad';
			};

			var polar = function(cx, cy, r, deg) {
				var a = (deg - 90) * Math.PI / 180;
				return (cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2);
			};

			var build = function() {
				var size = Math.max(60, config.size || 150);
				var stroke = Math.max(2, Math.min(size / 4, config.thickness || 12));
				var r = size / 2 - stroke / 2;
				var c = size / 2;
				var start = -SWEEP / 2;
				var end = SWEEP / 2;
				var d = 'M' + polar(c, c, r, start) + 'A' + r + ',' + r + ' 0 1 1 ' + polar(c, c, r, end);
				var length = Math.PI * 2 * r * SWEEP / 360;

				// The dial is a bit lower than tall, because the bottom of the circle is open
				var height = Math.round(size * 0.86);
				els.dial.style.width = size + 'px';
				els.dial.style.height = height + 'px';
				els.svg.setAttribute('viewBox', '0 0 ' + size + ' ' + height);
				els.svg.innerHTML = '<path class="{0}-track" d="{1}" stroke-width="{2}" /><path class="{0}-arc" d="{1}" stroke-width="{2}" stroke-dasharray="{3}" stroke-dashoffset="{3}" />'.format(cls, d, stroke, length.toFixed(2));
				els.arc = els.svg.lastChild;
				els.length = length;
				els.value.style.fontSize = Math.round(size * 0.24) + 'px';
				self.dom.style.width = (size + (config.style === 'minimal' ? 0 : 34)) + 'px';
			};

			var render = function() {

				var n = current;
				var min = num(config.min) || 0;
				var max = num(config.max);
				if (max == null || max <= min)
					max = min + 100;

				var t = n == null ? 0 : Math.max(0, Math.min(1, (n - min) / (max - min)));
				els.arc.setAttribute('stroke-dashoffset', (els.length * (1 - t)).toFixed(2));
				els.arc.style.visibility = n == null || t === 0 ? 'hidden' : '';

				var s = state(n);
				self.tclass(cls + '-good', s === 'good');
				self.tclass(cls + '-warn', s === 'warn');
				self.tclass(cls + '-bad', s === 'bad');

				els.value.textContent = format(n);

				var states = (config.states || '').split('|');
				var text = s === 'bad' ? states[0] : s === 'warn' ? states[1] : s === 'good' ? states[2] : '';
				els.stateicon.className = 'ti ' + (s === 'good' ? 'ti-check-circle' : s === 'warn' ? 'ti-exclamation-triangle' : 'ti-times-circle');
				els.statetext.textContent = text || '';

				els.min.textContent = format(min);
				els.max.textContent = format(max);

				var name = els.title.textContent.trim();
				self.attr('aria-valuemin', min);
				self.attr('aria-valuemax', max);
				n == null ? self.dom.removeAttribute('aria-valuenow') : self.attr('aria-valuenow', n);
				self.attr('aria-valuetext', format(n) + (config.unit ? ' ' + config.unit : '') + (text ? ', ' + text : ''));
				name ? self.attr('aria-label', name) : self.dom.removeAttribute('aria-label');
			};

			self.make = function() {

				label = self.html().trim();

				self.aclass(cls);
				self.attr('role', 'meter');
				self.html(('<div class="{0}-title"></div><div class="{0}-dial"><svg aria-hidden="true" focusable="false"></svg><div class="{0}-center" aria-hidden="true"><div class="{0}-value"></div><div class="{0}-unit"></div></div></div>' +
					'<div class="{0}-scale" aria-hidden="true"><span></span><span></span></div>' +
					'<div class="{0}-state" aria-hidden="true"><i></i><span></span></div>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.dial = self.find(cls2 + '-dial')[0];
				els.svg = self.find(cls2 + '-dial svg')[0];
				els.value = self.find(cls2 + '-value')[0];
				els.unit = self.find(cls2 + '-unit')[0];
				els.min = self.find(cls2 + '-scale span')[0];
				els.max = self.find(cls2 + '-scale span')[1];
				els.stateicon = self.find(cls2 + '-state i')[0];
				els.statetext = self.find(cls2 + '-state span')[0];

				prepare();
				build();
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						els.title.innerHTML = value || label;
						self.tclass(cls + '-notitle', !els.title.textContent.trim());
						!init && render();
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						!init && build();
						!init && render();
						break;
					case 'unit':
						els.unit.textContent = value || '';
						els.unit.style.display = value ? '' : 'none';
						!init && render();
						break;
					case 'scale':
						self.tclass(cls + '-noscale', !value);
						break;
					case 'size':
					case 'thickness':
						if (!init) {
							build();
							render();
						}
						break;
					case 'format':
					case 'decimals':
					case 'locale':
						if (!init) {
							prepare();
							render();
						}
						break;
					case 'min':
					case 'max':
					case 'bands':
					case 'goodup':
					case 'states':
						!init && render();
						break;
				}
			};

			// A number, or { value: 87 }
			self.setter = function(value) {
				current = num(value && typeof value === 'object' ? value.value : value);
				render();
			};

		});

	</script>

	<div style="padding:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:16px;align-items:flex-start;font-family:Arial,sans-serif">

		<ui-component name="scoregauge" path="score.seo" config="size:160;thickness:14;states:Poor|Needs work|Good;unit:of 100">SEO score</ui-component>

		<ui-component name="scoregauge" path="score.agents" config="states:Poor|Needs work|Good;unit:of 100">Agent readiness</ui-component>

		<ui-component name="scoregauge" path="score.performance" config="states:Poor|Needs work|Good">Performance</ui-component>

		<ui-component name="scoregauge" path="score.cpu" config="format:percent;bands:70,90;goodup:false;states:High|Busy|OK;scale:true;thickness:10">Server CPU</ui-component>

		<ui-component name="scoregauge" path="score.response" config="min:0;max:2000;bands:800,1800;goodup:false;unit:ms;states:Slow|Fair|Fast;scale:true;size:120">Response time</ui-component>

		<ui-component name="scoregauge" path="score.empty" config="size:120">No data</ui-component>

	</div>

	<script>

		SET('score.seo', 92);
		SET('score.agents', 68);
		SET('score.performance', 41);
		SET('score.cpu', 34);
		SET('score.response', 640);
		SET('score.empty', null);

		// Real time: the CPU moves every 2 seconds
		setInterval(function() {
			SET('score.cpu', Math.max(2, Math.min(99, GET('score.cpu') + Math.round(Math.random() * 30 - 15))));
		}, 2000);

	</script>

</body>
</html>
