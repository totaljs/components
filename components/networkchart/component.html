<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<style component>

		/* Group colours: slot 1 is the primary colour of the app, the rest is a colour-blind safe palette in a fixed order */
		.ui-networkchart { --nc1: var(--color); --nc2: #EB6834; --nc3: #1BAF7A; --nc4: #EDA100; --nc5: #E87BA4; --nc6: #008300; --nc7: #6250D6; --nc8: #E34948; --ncbg: #FFF; --nclink: #B8B8B8; box-sizing: border-box; min-width: 0; padding: 16px 18px; border: 1px solid #E3E3E3; border-radius: var(--radius); background: #FFF; color: #1F1F1F; font-size: 13px; }
		.ui-networkchart-minimal { padding: 0; border-color: transparent; background: transparent; }
		.ui-networkchart-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin-bottom: 10px; }
		.ui-networkchart-title { flex: 1 1 auto; font-weight: 600; font-size: 14px; }
		.ui-networkchart-notitle .ui-networkchart-title { display: none; }
		.ui-networkchart-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
		.ui-networkchart-nolegend .ui-networkchart-legend { display: none; }
		.ui-networkchart-legend span { display: inline-flex; align-items: center; gap: 6px; }
		.ui-networkchart-legend i { width: 10px; height: 10px; border-radius: 50%; }
		.ui-networkchart-body { position: relative; overflow: hidden; border-radius: 6px; outline: none; touch-action: none; }
		.ui-networkchart-body:focus-visible { box-shadow: 0 0 0 2px var(--color); }
		.ui-networkchart-body svg { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; }
		.ui-networkchart-panning svg { cursor: grabbing; }
		.ui-networkchart-link { fill: none; stroke: var(--nclink); stroke-opacity: .55; stroke-linecap: round; }
		.ui-networkchart-arrow { fill: var(--nclink); fill-opacity: .8; }
		.ui-networkchart-node { stroke: var(--ncbg); stroke-width: 1.5; cursor: pointer; }
		.ui-networkchart-label { fill: #1F1F1F; font-size: 11px; pointer-events: none; paint-order: stroke; stroke: var(--ncbg); stroke-width: 3px; stroke-linejoin: round; }
		.ui-networkchart-label.ui-networkchart-hidden { display: none; }
		.ui-networkchart-active .ui-networkchart-link, .ui-networkchart-active .ui-networkchart-arrow { stroke-opacity: .08; fill-opacity: .08; }
		.ui-networkchart-active .ui-networkchart-node { opacity: .2; }
		.ui-networkchart-active .ui-networkchart-label { opacity: .15; }
		.ui-networkchart-active .ui-networkchart-on { opacity: 1; stroke-opacity: .9; fill-opacity: 1; }
		.ui-networkchart-active .ui-networkchart-link.ui-networkchart-on { stroke: var(--color); }
		.ui-networkchart-active .ui-networkchart-label.ui-networkchart-on { display: block; font-weight: 600; }
		.ui-networkchart-node.ui-networkchart-focus { stroke: #1F1F1F; stroke-width: 2.5; }
		.ui-networkchart-tools { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
		.ui-networkchart-nozoom .ui-networkchart-tools { display: none; }
		.ui-networkchart-tools button { width: 30px; height: 30px; border: 1px solid #DCDCDC; border-radius: 6px; background: var(--ncbg); color: inherit; cursor: pointer; }
		.ui-networkchart-tools button:hover { border-color: rgba(var(--rgb), .6); }
		.ui-networkchart-tools button:focus-visible { outline: 2px solid var(--color); outline-offset: 1px; }
		.ui-networkchart-tip { position: absolute; top: 0; left: 0; z-index: 5; display: none; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: #1F1F1F; color: #FFF; font-size: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, .18); pointer-events: none; }
		.ui-networkchart-hover .ui-networkchart-tip { display: block; }
		.ui-networkchart-tip b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.ui-networkchart-tip div { color: rgba(255, 255, 255, .78); }
		.ui-networkchart-nodata { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #8A8A8A; }
		.ui-networkchart-nodata i { font-size: 22px; opacity: .6; }
		.ui-networkchart-isempty .ui-networkchart-nodata { display: flex; }
		.ui-networkchart-isempty .ui-networkchart-tools { display: none; }
		.ui-networkchart-sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

		.ui-dark .ui-networkchart { --nc2: #D95926; --nc3: #199E70; --nc4: #C98500; --nc5: #D55181; --nc6: #0CA30C; --nc7: #9085E9; --nc8: #E66767; --ncbg: #252525; --nclink: #6A6A6A; border-color: #3A3A3A; background: #252525; color: #EDEDED; }
		.ui-dark .ui-networkchart-minimal { --ncbg: #1A1A1A; border-color: transparent; background: transparent; }
		.ui-dark .ui-networkchart-label { fill: #EDEDED; }
		.ui-dark .ui-networkchart-node.ui-networkchart-focus { stroke: #FFF; }
		.ui-dark .ui-networkchart-tools button { border-color: #444; }
		.ui-dark .ui-networkchart-tip { background: #F2F2F2; color: #1F1F1F; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); }
		.ui-dark .ui-networkchart-tip div { color: #5E5E5E; }

		@media (forced-colors: active) {
			.ui-networkchart { border: 1px solid CanvasText; }
			.ui-networkchart-link { stroke: CanvasText; }
			.ui-networkchart-tip { border: 1px solid CanvasText; }
		}

	</style>

	<script component>

		COMPONENT('networkchart', 'label:;style:card;height:420;layout:force;center:;directed:false;labels:auto;legend:true;zoom:true;format:number;decimals:0;compact:true;locale:;click:', function(self, config, cls) {

			var cls2 = '.' + cls;
			var MAX = 500;
			var els = {};
			var nodes = [];
			var links = [];
			var groups = [];
			var byid = {};
			var order = [];
			var cursor = -1;
			var hovered = null;
			var label = '';
			var fmt = {};
			var raf = 0;
			var alpha = 0;
			var view = { x: 0, y: 0, k: 1 };
			var size = { w: 0, h: 0 };
			var drag = null;
			var observer = null;
			var cut = 0;
			var userview = false;

			var esc = function(value) {
				return (value == null ? '' : value + '').replace(/[&<>"']/g, function(c) {
					return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
				});
			};

			var locale = function() {
				return config.locale || document.documentElement.lang || undefined;
			};

			var prepare = function() {
				var decimals = Math.max(0, config.decimals || 0);
				try {
					fmt.full = new Intl.NumberFormat(locale(), { maximumFractionDigits: decimals });
					fmt.compact = new Intl.NumberFormat(locale(), { notation: 'compact', maximumFractionDigits: 1 });
				} catch (e) {
					fmt.full = new Intl.NumberFormat(undefined, { maximumFractionDigits: decimals });
					fmt.compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 });
				}
			};

			var format = function(n) {
				return (config.compact && Math.abs(n) >= 10000 ? fmt.compact : fmt.full).format(n);
			};

			var num = function(value) {
				if (value == null || value === '')
					return null;
				value = typeof value === 'number' ? value : +value;
				return isFinite(value) && value >= 0 ? value : null;
			};

			var reduced = function() {
				return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
			};

			// { nodes: [{ id, name, value, group, color }], links: [{ source, target, value }] }; nodes are optional
			var parse = function(model) {

				var src = model || {};
				var list = src.links instanceof Array ? src.links : [];
				var all = {};
				var allnodes = [];

				var get = function(id) {
					id = id + '';
					if (!all[id]) {
						all[id] = { id: id, name: id, value: null, group: '', color: '', item: null, degree: 0, weight: 0 };
						allnodes.push(all[id]);
					}
					return all[id];
				};

				if (src.nodes instanceof Array) {
					for (var n = 0; n < src.nodes.length; n++) {
						var item = src.nodes[n] || {};
						if (item.id == null)
							continue;
						var node = get(item.id);
						node.name = item.name == null ? node.id : item.name + '';
						node.value = num(item.value);
						node.group = item.group == null ? '' : item.group + '';
						node.color = (/^#[0-9a-f]{3,8}$/i).test(item.color || '') ? item.color : '';
						node.item = item;
					}
				}

				var raw = [];
				for (var i = 0; i < list.length; i++) {
					var l = list[i] || {};
					if (l.source == null || l.target == null || l.source + '' === l.target + '')
						continue;
					var a = get(l.source);
					var b = get(l.target);
					var w = num(l.value);
					w = w == null ? 1 : w;
					raw.push({ source: a, target: b, value: w, item: l });
					a.degree++;
					b.degree++;
					a.weight += w;
					b.weight += w;
				}

				// More than 500 nodes: the 500 most important ones stay (value, or the weight of their links)
				allnodes.forEach(function(node) {
					node.size = node.value != null ? node.value : node.weight || node.degree;
				});
				var keep = allnodes.slice(0);
				cut = 0;
				if (keep.length > MAX) {
					keep.sort(function(x, y) {
						return y.size - x.size;
					});
					cut = keep.length - MAX;
					keep = keep.slice(0, MAX);
				}

				// Positions of nodes that stay are kept, so an update in real time does not shuffle the network
				var old = byid;
				byid = {};
				nodes = keep;
				for (var k = 0; k < nodes.length; k++) {
					var nd = nodes[k];
					nd.index = k;
					nd.neighbours = [];
					nd.links = [];
					var prev = old[nd.id];
					if (prev && prev.x != null) {
						nd.x = prev.x;
						nd.y = prev.y;
						nd.vx = 0;
						nd.vy = 0;
					}
					byid[nd.id] = nd;
				}

				links = raw.filter(function(link) {
					return byid[link.source.id] === link.source && byid[link.target.id] === link.target;
				});
				for (var m = 0; m < links.length; m++) {
					links[m].index = m;
					links[m].source.neighbours.push(links[m].target);
					links[m].target.neighbours.push(links[m].source);
					links[m].source.links.push(links[m]);
					links[m].target.links.push(links[m]);
				}

				groups = [];
				var seen = {};
				for (var g = 0; g < nodes.length; g++) {
					var name = nodes[g].group;
					if (name && !seen[name]) {
						seen[name] = 1;
						groups.push(name);
					}
				}

				var max = 0;
				nodes.forEach(function(node) {
					max = Math.max(max, node.size);
				});
				nodes.forEach(function(node) {
					node.r = 4 + (max ? Math.sqrt(node.size / max) : 0) * 14;
				});

				// The keyboard goes from the most important node
				order = nodes.slice(0).sort(function(x, y) {
					return y.size - x.size;
				});
			};

			var color = function(node) {
				if (node.color)
					return node.color;
				var index = node.group ? groups.indexOf(node.group) : 0;
				return 'var(--nc' + ((Math.max(0, index) % 8) + 1) + ')';
			};

			// Force layout: nodes push each other away, links pull like springs, everything is pulled a bit to the centre
			var tick = function() {

				var cx = size.w / 2;
				var cy = size.h / 2;
				var cell = 90;
				var grid = {};
				var i, j, a, b, dx, dy, d2, d, f;

				// Repulsion only between near nodes, with a grid: the cost stays linear with 500 nodes
				for (i = 0; i < nodes.length; i++) {
					a = nodes[i];
					var key = Math.floor(a.x / cell) + ':' + Math.floor(a.y / cell);
					(grid[key] = grid[key] || []).push(a);
				}

				for (i = 0; i < nodes.length; i++) {
					a = nodes[i];
					var gx = Math.floor(a.x / cell);
					var gy = Math.floor(a.y / cell);
					for (var ox = -1; ox <= 1; ox++) {
						for (var oy = -1; oy <= 1; oy++) {
							var bucket = grid[(gx + ox) + ':' + (gy + oy)];
							if (!bucket)
								continue;
							for (j = 0; j < bucket.length; j++) {
								b = bucket[j];
								if (b.index <= a.index)
									continue;
								dx = b.x - a.x;
								dy = b.y - a.y;
								d2 = dx * dx + dy * dy;
								if (d2 > cell * cell)
									continue;
								if (d2 < 0.01) {
									dx = (Math.random() - 0.5);
									dy = (Math.random() - 0.5);
									d2 = dx * dx + dy * dy;
								}
								d = Math.sqrt(d2);
								var min = a.r + b.r + 6;
								f = (d < min ? (min - d) * 0.5 : 0) + 2400 / d2 * alpha;
								dx = dx / d * f;
								dy = dy / d * f;
								a.vx -= dx;
								a.vy -= dy;
								b.vx += dx;
								b.vy += dy;
							}
						}
					}
				}

				// Springs: stronger links are shorter
				for (i = 0; i < links.length; i++) {
					var l = links[i];
					a = l.source;
					b = l.target;
					dx = b.x - a.x;
					dy = b.y - a.y;
					d = Math.sqrt(dx * dx + dy * dy) || 1;
					var length = 40 + a.r + b.r;
					f = (d - length) / d * 0.08 * alpha * 4;
					dx *= f;
					dy *= f;
					var wa = b.links.length / (a.links.length + b.links.length);
					a.vx += dx * wa;
					a.vy += dy * wa;
					b.vx -= dx * (1 - wa);
					b.vy -= dy * (1 - wa);
				}

				for (i = 0; i < nodes.length; i++) {
					a = nodes[i];
					a.vx += (cx - a.x) * 0.008 * alpha;
					a.vy += (cy - a.y) * 0.008 * alpha;
					if (a.fixed) {
						a.vx = 0;
						a.vy = 0;
						continue;
					}
					a.vx *= 0.6;
					a.vy *= 0.6;
					a.x += a.vx;
					a.y += a.vy;
				}

				alpha *= 0.985;
			};

			// The whole network fits in the box (with room for the labels), until the user zooms or pans
			var fit = function(force) {
				if ((userview && !force) || !nodes.length)
					return;
				var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
				for (var i = 0; i < nodes.length; i++) {
					var n = nodes[i];
					var room = config.labels === 'none' ? 0 : Math.min(120, n.name.length * 6.2);
					x0 = Math.min(x0, n.x - n.r - (config.layout === 'circle' && Math.cos(n.angle || 0) < 0 ? room : 0));
					x1 = Math.max(x1, n.x + n.r + room);
					y0 = Math.min(y0, n.y - n.r - 8);
					y1 = Math.max(y1, n.y + n.r + 8);
				}
				var pad = 16;
				var k = Math.min(1.6, (size.w - pad * 2) / Math.max(1, x1 - x0), (size.h - pad * 2) / Math.max(1, y1 - y0));
				view.k = k;
				view.x = size.w / 2 - (x0 + x1) / 2 * k;
				view.y = size.h / 2 - (y0 + y1) / 2 * k;
				transform();
			};

			var simulate = function(reheat) {
				raf && cancelAnimationFrame(raf);
				raf = 0;
				alpha = reheat || 1;
				if (config.layout !== 'force' || !nodes.length) {
					paint();
					fit();
					return;
				}
				// Without motion the layout is computed at once
				if (reduced()) {
					while (alpha > 0.02)
						tick();
					paint();
					fit();
					return;
				}
				var frame = function() {
					for (var t = 0; t < 3 && alpha > 0.02; t++)
						tick();
					paint();
					drag || fit();
					raf = alpha > 0.02 ? requestAnimationFrame(frame) : 0;
				};
				raf = requestAnimationFrame(frame);
			};

			var circle = function() {
				var cx = size.w / 2;
				var cy = size.h / 2;
				var radius = Math.max(40, Math.min(size.w, size.h) / 2 - 70);
				// The nodes of a group stay together, the biggest first
				var list = nodes.slice(0).sort(function(a, b) {
					var ga = groups.indexOf(a.group);
					var gb = groups.indexOf(b.group);
					return ga - gb || b.size - a.size;
				});
				for (var i = 0; i < list.length; i++) {
					var angle = i / list.length * Math.PI * 2 - Math.PI / 2;
					list[i].x = cx + Math.cos(angle) * radius;
					list[i].y = cy + Math.sin(angle) * radius;
					list[i].angle = angle;
				}
			};

			var radial = function() {
				var cx = size.w / 2;
				var cy = size.h / 2;
				var root = byid[config.center] || order[0];
				var level = {};
				var queue = [root];
				level[root.id] = 0;
				var rings = [[root]];
				// Breadth-first: every ring is one step further from the centre
				while (queue.length) {
					var node = queue.shift();
					var next = node.neighbours.slice(0).sort(function(a, b) {
						return b.size - a.size;
					});
					for (var i = 0; i < next.length; i++) {
						if (level[next[i].id] == null) {
							level[next[i].id] = level[node.id] + 1;
							(rings[level[next[i].id]] = rings[level[next[i].id]] || []).push(next[i]);
							next[i].parent = node;
							queue.push(next[i]);
						}
					}
				}
				var lost = nodes.filter(function(n) {
					return level[n.id] == null;
				});
				lost.length && rings.push(lost);
				// Oval rings use the whole box
				var stepx = Math.max(40, (size.w / 2 - 110) / Math.max(1, rings.length - 1));
				var stepy = Math.max(30, (size.h / 2 - 24) / Math.max(1, rings.length - 1));
				root.x = cx;
				root.y = cy;
				for (var r = 1; r < rings.length; r++) {
					// Children follow the angle of their parent, so the branches do not cross
					rings[r].sort(function(a, b) {
						return (a.parent ? a.parent.angle || 0 : 9) - (b.parent ? b.parent.angle || 0 : 9);
					});
					for (var j = 0; j < rings[r].length; j++) {
						var angle = j / rings[r].length * Math.PI * 2 - Math.PI / 2;
						rings[r][j].angle = angle;
						rings[r][j].x = cx + Math.cos(angle) * stepx * r;
						rings[r][j].y = cy + Math.sin(angle) * stepy * r;
					}
				}
			};

			var layout = function() {
				size.w = els.body.clientWidth;
				size.h = els.body.clientHeight;
				if (config.layout === 'circle')
					circle();
				else if (config.layout === 'radial')
					radial();
				else {
					// New nodes start near a neighbour that has a place, or in a spiral around the centre
					for (var i = 0; i < nodes.length; i++) {
						var n = nodes[i];
						if (n.x != null && config.layout === 'force' && !n.fromlayout)
							continue;
						var near = null;
						for (var j = 0; j < n.neighbours.length; j++) {
							if (n.neighbours[j].x != null) {
								near = n.neighbours[j];
								break;
							}
						}
						var a = i * 2.4;
						var r = 10 * Math.sqrt(i + 1);
						n.x = near ? near.x + Math.cos(a) * 20 : size.w / 2 + Math.cos(a) * r;
						n.y = near ? near.y + Math.sin(a) * 20 : size.h / 2 + Math.sin(a) * r;
						n.vx = 0;
						n.vy = 0;
						n.fromlayout = false;
					}
				}
				if (config.layout !== 'force')
					nodes.forEach(function(n) {
						n.fromlayout = true;
					});
			};

			var edge = function(l) {
				var a = l.source;
				var b = l.target;
				if (config.layout === 'circle') {
					// Curves through the inside of the circle
					var mx = (a.x + b.x) / 2;
					var my = (a.y + b.y) / 2;
					var qx = mx + (size.w / 2 - mx) * 0.6;
					var qy = my + (size.h / 2 - my) * 0.6;
					return 'M' + a.x.toFixed(1) + ',' + a.y.toFixed(1) + 'Q' + qx.toFixed(1) + ',' + qy.toFixed(1) + ' ' + b.x.toFixed(1) + ',' + b.y.toFixed(1);
				}
				return 'M' + a.x.toFixed(1) + ',' + a.y.toFixed(1) + 'L' + b.x.toFixed(1) + ',' + b.y.toFixed(1);
			};

			// An arrow at the end of a directed link, drawn as a triangle (no markers with ids)
			var arrow = function(l) {
				var a = l.source;
				var b = l.target;
				var fx = a.x;
				var fy = a.y;
				if (config.layout === 'circle') {
					var mx = (a.x + b.x) / 2;
					var my = (a.y + b.y) / 2;
					fx = mx + (size.w / 2 - mx) * 0.6;
					fy = my + (size.h / 2 - my) * 0.6;
				}
				var dx = b.x - fx;
				var dy = b.y - fy;
				var d = Math.sqrt(dx * dx + dy * dy) || 1;
				var ux = dx / d;
				var uy = dy / d;
				var tx = b.x - ux * (b.r + 2);
				var ty = b.y - uy * (b.r + 2);
				var s = 5;
				return 'M' + tx.toFixed(1) + ',' + ty.toFixed(1) + 'L' + (tx - ux * s * 1.6 - uy * s).toFixed(1) + ',' + (ty - uy * s * 1.6 + ux * s).toFixed(1) + 'L' + (tx - ux * s * 1.6 + uy * s).toFixed(1) + ',' + (ty - uy * s * 1.6 - ux * s).toFixed(1) + 'Z';
			};

			var build = function() {

				self.tclass(cls + '-isempty', !nodes.length);
				var maxw = 0;
				links.forEach(function(l) {
					maxw = Math.max(maxw, l.value);
				});

				var b = ['<g class="' + cls + '-links">'];
				for (var i = 0; i < links.length; i++)
					b.push('<path class="{0}-link" data-link="{1}" stroke-width="{2}" />'.format(cls, i, (1 + (maxw ? links[i].value / maxw : 0) * 4).toFixed(2)));
				b.push('</g><g>');
				if (config.directed) {
					for (i = 0; i < links.length; i++)
						b.push('<path class="{0}-arrow" data-link="{1}" />'.format(cls, i));
				}
				b.push('</g><g>');
				for (i = 0; i < nodes.length; i++)
					b.push('<circle class="{0}-node" data-node="{1}" r="{2}" style="fill:{3}" />'.format(cls, i, nodes[i].r.toFixed(1), color(nodes[i])));
				b.push('</g><g>');

				// Labels: all, none, or the 25 biggest nodes (the others appear on hover)
				var shown = {};
				if (config.labels === 'auto') {
					for (var o = 0; o < Math.min(25, order.length); o++)
						shown[order[o].id] = 1;
				}
				for (i = 0; i < nodes.length; i++) {
					var hidden = config.labels === 'none' || (config.labels === 'auto' && !shown[nodes[i].id]);
					b.push('<text class="{0}-label{1}" data-label="{2}" dy="0.35em"></text>'.format(cls, hidden ? ' ' + cls + '-hidden' : '', i));
				}
				b.push('</g>');

				els.layer.innerHTML = b.join('');
				els.linknodes = els.layer.querySelectorAll(cls2 + '-link');
				els.arrownodes = els.layer.querySelectorAll(cls2 + '-arrow');
				els.circlenodes = els.layer.querySelectorAll(cls2 + '-node');
				els.labelnodes = els.layer.querySelectorAll(cls2 + '-label');
				for (i = 0; i < els.labelnodes.length; i++)
					els.labelnodes[i].textContent = nodes[i].name;

				renderlegend();
				rendertable();
			};

			var paint = function() {
				var i;
				for (i = 0; i < links.length; i++) {
					els.linknodes[i].setAttribute('d', edge(links[i]));
					els.arrownodes[i] && els.arrownodes[i].setAttribute('d', arrow(links[i]));
				}
				for (i = 0; i < nodes.length; i++) {
					var n = nodes[i];
					els.circlenodes[i].setAttribute('cx', n.x.toFixed(1));
					els.circlenodes[i].setAttribute('cy', n.y.toFixed(1));
					var label = els.labelnodes[i];
					// In the circle the labels go outwards, elsewhere to the right of the node
					if (config.layout === 'circle' && n.angle != null) {
						var out = Math.cos(n.angle) >= 0;
						label.setAttribute('x', (n.x + Math.cos(n.angle) * (n.r + 5)).toFixed(1));
						label.setAttribute('y', (n.y + Math.sin(n.angle) * (n.r + 5)).toFixed(1));
						label.setAttribute('text-anchor', out ? 'start' : 'end');
					} else {
						label.setAttribute('x', (n.x + n.r + 4).toFixed(1));
						label.setAttribute('y', n.y.toFixed(1));
						label.setAttribute('text-anchor', 'start');
					}
				}
			};

			var transform = function() {
				els.layer.setAttribute('transform', 'translate(' + view.x.toFixed(1) + ',' + view.y.toFixed(1) + ') scale(' + view.k.toFixed(3) + ')');
			};

			var zoomat = function(k, px, py) {
				k = Math.max(0.3, Math.min(5, k));
				// The point under the pointer stays in place
				view.x = px - (px - view.x) * k / view.k;
				view.y = py - (py - view.y) * k / view.k;
				view.k = k;
				transform();
				hovered && showtip(hovered);
			};

			var renderlegend = function() {
				var builder = [];
				for (var i = 0; i < groups.length; i++)
					builder.push('<span><i style="background:{0}"></i>{1}</span>'.format('var(--nc' + ((i % 8) + 1) + ')', esc(groups[i])));
				els.legend.innerHTML = builder.join('');
				self.tclass(cls + '-nolegend', !config.legend || groups.length < 2);
			};

			var rendertable = function() {
				var rows = links.map(function(l) {
					return '<tr><td>{0}</td><td>{1}</td><td>{2}</td></tr>'.format(esc(l.source.name), esc(l.target.name), esc(format(l.value)));
				});
				els.table.innerHTML = '<table><caption>{0}</caption><tbody>{1}</tbody></table>'.format(esc(els.title.textContent.trim()), rows.join(''));
			};

			var describe = function(node) {
				var names = node.neighbours.slice(0).sort(function(a, b) {
					return b.size - a.size;
				}).map(function(n) {
					return n.name;
				});
				var text = node.name + (node.group ? ' (' + node.group + ')' : '') + ': ' + format(node.size) + ', ' + names.length;
				return text + (names.length ? ': ' + names.slice(0, 8).join(', ') + (names.length > 8 ? '…' : '') : '');
			};

			var highlight = function(node) {
				var old = els.layer.querySelectorAll(cls2 + '-on');
				for (var i = 0; i < old.length; i++)
					old[i].classList.remove(cls + '-on');
				if (!node) {
					self.rclass(cls + '-active');
					return;
				}
				var mark = function(n) {
					els.circlenodes[n.index].classList.add(cls + '-on');
					els.labelnodes[n.index].classList.add(cls + '-on');
				};
				mark(node);
				for (var j = 0; j < node.links.length; j++) {
					var l = node.links[j];
					els.linknodes[l.index].classList.add(cls + '-on');
					els.arrownodes[l.index] && els.arrownodes[l.index].classList.add(cls + '-on');
					mark(l.source === node ? l.target : l.source);
				}
				self.aclass(cls + '-active');
			};

			var showtip = function(node) {
				var names = node.neighbours.slice(0).sort(function(a, b) {
					return b.size - a.size;
				});
				var list = names.slice(0, 5).map(function(n) {
					return esc(n.name);
				}).join(', ') + (names.length > 5 ? '…' : '');
				els.tip.innerHTML = '<b>{0}</b><div>{1}{2} · {3}</div>{4}'.format(esc(node.name), node.group ? esc(node.group) + ' · ' : '', esc(format(node.size)), names.length, list ? '<div>' + list + '</div>' : '');
				self.aclass(cls + '-hover');
				var x = node.x * view.k + view.x;
				var y = node.y * view.k + view.y;
				var tw = els.tip.offsetWidth;
				var th = els.tip.offsetHeight;
				var tx = x + node.r * view.k + 10;
				if (tx + tw > size.w)
					tx = x - node.r * view.k - 10 - tw;
				var ty = Math.max(0, Math.min(size.h - th, y - th / 2));
				els.tip.style.transform = 'translate(' + Math.round(Math.max(0, tx)) + 'px,' + Math.round(ty) + 'px)';
			};

			var enter = function(node, announce) {
				hovered = node;
				highlight(node);
				showtip(node);
				if (announce)
					els.live.textContent = describe(node);
			};

			var leave = function() {
				hovered = null;
				highlight(null);
				self.rclass(cls + '-hover');
				var focus = els.layer.querySelector(cls2 + '-focus');
				focus && focus.classList.remove(cls + '-focus');
			};

			var run = function(node) {
				node && config.click && self.EXEC(config.click, { id: node.id, name: node.name, group: node.group, value: node.size, neighbours: node.neighbours.map(function(n) {
					return n.id;
				}), item: node.item }, self);
			};

			var point = function(e) {
				var rect = els.body.getBoundingClientRect();
				return { x: e.clientX - rect.left, y: e.clientY - rect.top };
			};

			var render = function() {
				userview = false;
				view = { x: 0, y: 0, k: 1 };
				transform();
				layout();
				build();
				simulate(1);
			};

			self.make = function() {

				label = self.html().trim();
				self.aclass(cls);
				self.html(('<div class="{0}-top"><div class="{0}-title"></div><div class="{0}-legend" aria-hidden="true"></div></div>' +
					'<div class="{0}-body" tabindex="0" role="group"><svg aria-hidden="true" focusable="false"><g class="{0}-layer"></g></svg>' +
					'<div class="{0}-tools"><button type="button" data-zoom="1.4"><i class="ti ti-search-plus" aria-hidden="true"></i></button><button type="button" data-zoom="0.7"><i class="ti ti-search-minus" aria-hidden="true"></i></button><button type="button" data-zoom="0"><i class="ti ti-expand" aria-hidden="true"></i></button></div>' +
					'<div class="{0}-tip" aria-hidden="true"></div><div class="{0}-nodata"><i class="ti ti-project-diagram" aria-hidden="true"></i></div></div>' +
					'<div class="{0}-sr {0}-table"></div><div class="{0}-sr" aria-live="polite"></div>').format(cls));

				els.title = self.find(cls2 + '-title')[0];
				els.legend = self.find(cls2 + '-legend')[0];
				els.body = self.find(cls2 + '-body')[0];
				els.svg = self.find(cls2 + '-body svg')[0];
				els.layer = self.find(cls2 + '-layer')[0];
				els.tip = self.find(cls2 + '-tip')[0];
				els.table = self.find(cls2 + '-table')[0];
				els.live = self.find(cls2 + '-sr[aria-live]')[0];

				prepare();

				// Pointer: drag a node (it stays where it is dropped), or pan the background
				self.event('pointerdown', cls2 + '-body svg', function(e) {
					var t = e.target;
					var p = point(e);
					if (t.hasAttribute('data-node')) {
						var node = nodes[+t.getAttribute('data-node')];
						drag = { node: node, moved: false };
						node.fixed = true;
					} else {
						userview = true;
						drag = { pan: true, x: p.x - view.x, y: p.y - view.y };
						self.aclass(cls + '-panning');
					}
					els.svg.setPointerCapture && els.svg.setPointerCapture(e.pointerId);
				});

				self.event('pointermove', cls2 + '-body svg', function(e) {
					var p = point(e);
					if (drag && drag.pan) {
						view.x = p.x - drag.x;
						view.y = p.y - drag.y;
						transform();
						return;
					}
					if (drag && drag.node) {
						drag.moved = true;
						drag.node.x = (p.x - view.x) / view.k;
						drag.node.y = (p.y - view.y) / view.k;
						if (config.layout === 'force') {
							if (!raf && !reduced())
								simulate(0.3);
						}
						paint();
						showtip(drag.node);
						return;
					}
					var t = e.target;
					if (t.hasAttribute && t.hasAttribute('data-node')) {
						var node = nodes[+t.getAttribute('data-node')];
						node !== hovered && enter(node);
					} else if (hovered)
						leave();
				});

				self.event('pointerup pointercancel', cls2 + '-body svg', function() {
					if (drag && drag.node && !drag.moved)
						run(drag.node);
					drag = null;
					self.rclass(cls + '-panning');
				});

				self.event('mouseleave', cls2 + '-body', function() {
					document.activeElement !== els.body && leave();
				});

				self.event('wheel', cls2 + '-body svg', function(e) {
					if (!config.zoom)
						return;
					e.preventDefault();
					userview = true;
					var p = point(e);
					zoomat(view.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y);
				});

				self.event('click', cls2 + '-tools button', function() {
					var z = +this.getAttribute('data-zoom');
					if (z) {
						userview = true;
						zoomat(view.k * z, size.w / 2, size.h / 2);
					} else {
						// The last button fits the whole network again
						userview = false;
						fit(true);
					}
				});

				// Keyboard: the arrows go through the nodes from the most important, + and - zoom, 0 resets
				self.event('keydown', cls2 + '-body', function(e) {
					if (e.target !== els.body || !order.length)
						return;
					switch (e.key) {
						case 'ArrowRight':
						case 'ArrowDown':
							cursor = Math.min(order.length - 1, cursor + 1);
							break;
						case 'ArrowLeft':
						case 'ArrowUp':
							cursor = Math.max(0, cursor - 1);
							break;
						case 'Home':
							cursor = 0;
							break;
						case 'End':
							cursor = order.length - 1;
							break;
						case 'Enter':
						case ' ':
							e.preventDefault();
							cursor !== -1 && run(order[cursor]);
							return;
						case '+':
						case '=':
							userview = true;
							config.zoom && zoomat(view.k * 1.25, size.w / 2, size.h / 2);
							return;
						case '-':
							userview = true;
							config.zoom && zoomat(view.k / 1.25, size.w / 2, size.h / 2);
							return;
						case '0':
							userview = false;
							fit(true);
							return;
						case 'Escape':
							cursor = -1;
							leave();
							return;
						default:
							return;
					}
					e.preventDefault();
					var node = order[cursor];
					var old = els.layer.querySelector(cls2 + '-focus');
					old && old.classList.remove(cls + '-focus');
					els.circlenodes[node.index].classList.add(cls + '-focus');
					enter(node, true);
				});

				self.event('blur', cls2 + '-body', function() {
					cursor = -1;
					leave();
				});

				if (window.ResizeObserver) {
					observer = new ResizeObserver(function() {
						if (els.body.clientWidth !== size.w && nodes.length)
							setTimeout2(self.ID + 'resize', function() {
								var w = size.w;
								var h = size.h;
								size.w = els.body.clientWidth;
								size.h = els.body.clientHeight;
								// The network moves with the centre of the box
								nodes.forEach(function(n) {
									n.x += (size.w - w) / 2;
									n.y += (size.h - h) / 2;
								});
								config.layout === 'force' ? paint() : render();
							}, 80);
					});
					observer.observe(els.body);
				}
			};

			self.configure = function(key, value, init) {
				switch (key) {
					case 'label':
						els.title.innerHTML = value || label;
						var text = els.title.textContent.trim();
						self.tclass(cls + '-notitle', !text);
						text ? els.body.setAttribute('aria-label', text) : els.body.removeAttribute('aria-label');
						break;
					case 'style':
						self.tclass(cls + '-minimal', value === 'minimal');
						break;
					case 'height':
						els.body.style.height = Math.max(160, value || 420) + 'px';
						!init && nodes.length && render();
						break;
					case 'zoom':
						self.tclass(cls + '-nozoom', !value);
						break;
					case 'click':
						self.tclass(cls + '-clickable', !!value);
						break;
					case 'layout':
					case 'center':
					case 'directed':
					case 'labels':
					case 'legend':
						if (!init && nodes.length) {
							nodes.forEach(function(n) {
								n.fixed = false;
								n.x = null;
							});
							render();
						}
						break;
					case 'format':
					case 'decimals':
					case 'compact':
					case 'locale':
						if (!init) {
							prepare();
							rendertable();
						}
						break;
				}
			};

			self.setter = function(value) {
				parse(value);
				if (cut)
					WARN('networkchart: ' + cut + ' nodes over the limit of ' + MAX + ' were left out');
				var fresh = !nodes.some(function(n) {
					return n.x != null;
				});
				if (fresh) {
					render();
					return;
				}
				// An update keeps the view and only reheats the layout a little
				layout();
				build();
				simulate(config.layout === 'force' ? 0.3 : 1);
				hovered = null;
			};

			self.destroy = function() {
				raf && cancelAnimationFrame(raf);
				observer && observer.disconnect();
				clearTimeout2(self.ID + 'resize');
			};

		});

	</script>

	<div style="max-width:960px;padding:12px;display:grid;gap:16px">

		<ui-component name="networkchart" path="net.agents" config="layout:circle;height:420">AI agents and the pages they read</ui-component>

		<ui-component name="networkchart" path="net.links" config="layout:radial;center:pricing;height:420;labels:all">Around /pricing</ui-component>

		<ui-component name="networkchart" path="net.big" config="height:420;labels:none">500 nodes</ui-component>

	</div>

			{ id: 'b3', name: '/blog/flow', group: 'Blog', value: 980 },
			{ id: 'docs', name: '/docs', group: 'Docs', value: 2400 },
			{ id: 'd1', name: '/docs/start', group: 'Docs', value: 4310 },

			['b1', 'd1'], ['b2', 'pricing'], ['b3', 'd3'], ['docs', 'd1'], ['docs', 'd2'], ['docs', 'd3'], ['d1', 'd2'], ['d1', 'pricing'], ['orphan', 'home']
		];
		SET('net.links', { nodes: pages, links: edges.map(function(e) { return { source: e[0], target: e[1] }; }) });

		// AI agents and the pages they read (the value is the count of reads)
		var agents = [{ id: 'gpt', name: 'ChatGPT', group: 'Agents' }, { id: 'claude', name: 'Claude', group: 'Agents' }, { id: 'pplx', name: 'Perplexity', group: 'Agents' }, { id: 'gem', name: 'Gemini', group: 'Agents' }];

		SET('net.agents', { nodes: agents.concat(targets), links: [

			{ source: 'claude', target: 'mcp', value: 800 }, { source: 'claude', target: 'llms', value: 350 }, { source: 'claude', target: 'd1', value: 280 }, { source: 'claude', target: 'api', value: 260 },
			{ source: 'pplx', target: 'home', value: 500 }, { source: 'pplx', target: 'b2', value: 200 }, { source: 'pplx', target: 'llms', value: 120 },
			{ source: 'gem', target: 'home', value: 260 }, { source: 'gem', target: 'd1', value: 140 }
		] });

		// 500 nodes: the limit of the component
		var big = { nodes: [], links: [] };
		for (var i = 0; i < 500; i++)
			big.nodes.push({ id: 'n' + i, name: 'Page ' + (i + 1), group: 'Section ' + (i % 6 + 1) });
		for (var j = 1; j < 500; j++) {
			big.links.push({ source: 'n' + j, target: 'n' + Math.floor(Math.sqrt(j) * 3) % j });
			j % 7 === 0 && big.links.push({ source: 'n' + j, target: 'n' + (j * 13) % 500 });
		}
		SET('net.big', big);

		function onnodeclick(node, component) {
			// e.g. open the page: node.id, node.name, node.neighbours
		}

	</script>
