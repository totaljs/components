<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-empty-table { display: table; width: 100%; height: 100%; color: #777; font-size: 13px; }
		.ui-empty-cell { display: table-cell; width: 100%; height: 100%; text-align: center; vertical-align: middle; }
		.ui-empty-cell > i { font-size: 40px; width: 100px; height: 100px; line-height: 100px; text-align: center; background-color: #F0F0F0; border-radius: 100px; color: #D0D0D0; transform: scale(1); }
		.ui-empty-cell > div { margin-top: 15px; }

		.ui-dark .ui-empty-table { color: #999; }
		.ui-dark .ui-empty-cell > i { background-color: #303030; color: #404040; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('empty', 'icon:ti ti-database;parent:parent;margin:0;wait:1', function(self, config, cls) {

			var visible = false;
			var special = false;
			var table;

			self.readonly();

			self.make = function() {

				self.aclass(cls);

				var scr = self.find('> scri' + 'pt,> template');
				var text = scr.length ? scr.html() : self.html();
				var html = '<div class="{0}-table hidden"><div class="{0}-cell"><i class="{1}"></i><div>{2}</div></div></div>'.format(cls, config.icon, text);

				if (scr.length) {
					special = true;
					scr.remove();
					self.element.prepend(html);
				} else
					self.html(html);

				table = self.find('> .' + cls + '-table');

				self.on('resize2 + resize', function() {
					if (!visible)
						self.resize();
				});

				self.rclass('hidden invisible');
			};

			self.resize = function() {
				setTimeout2(self.ID, self.resizeforce, 300);
			};

			self.resizeforce = function() {

				if (visible)
					return;

				if (config.height) {
					table.css('height', config.height);
					table.tclass('hidden', visible);
					return;
				}

				var parent = self.parent(config.parent);
				var wh = parent.height() - 10;

				if (config.topoffset)
					wh -= self.element.offset().top;

				if (config.topposition)
					wh -= self.element.position().top;

				table.css('height', wh < 100 ? 'auto' : wh - config.margin);
				table.rclass('hidden');
			};

			self.setter = function(value, path, flags) {

				if (!value && config.wait && (flags === 0 || flags.init))
					return;

				visible = false;

				if (value instanceof Array)
					visible = !!value.length;
				else if (value)
					visible = value.items && !!value.items.length;

				if (visible)
					table.aclass('hidden');
				else
					self.resize();

				if (special) {
					for (var i = 1; i < self.dom.children.length; i++)
						$(self.dom.children[i]).tclass('hidden', !visible);
				}

			};

		});

	</script>

	<!-- Example -->
	<ui-component name="empty" path="datasource" config="parent:window;wait:false" class="hidden">The datasource is empty.</ui-component>

	<script>

		var datasource = [];

		// Empty component will be hidden after 5 seconds
		PUSH('datasource', { item: 1 }, 5000);

	</script>

</body>
</html>
