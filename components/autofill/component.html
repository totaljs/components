<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-autofill {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('autofill', function(self) {
			self.readonly();
			self.blind();
			self.make = function() {
				var form = document.createElement('FORM');
				while (self.dom.children.length)
					form.appendChild(self.dom.children[0]);
				self.dom.appendChild(form);
				$(form).attr('action', '#').attr('method', 'POST').on('submit', function(e) {
					e.preventDefault();
					e.stopPropagation();
					return false;
				});
			};
		});

	</script>

	<!-- Example -->
	<ui-plugin path="form">
		<ui-component name="autofill">
			<ui-component name="input" path="?.name" config="autofill:1">Name</ui-component>
		</ui-component>
	</ui-plugin>

</body>
</html>
