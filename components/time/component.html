<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-time i { margin: 0 6px 0 0; }
		.ui-time span { vertical-align: middle; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('time', 'icon:ti ti-clock', function(self, config, cls) {

			var is = true;
			var fn;

			self.make = function() {

				self.aclass(cls);
				self.append((config.icon ? '<i class="{0}"></i>'.format(config.icon) : '') + '<span></span>');

				var span = self.find('span');
				var format = (config.format || DEF.timeformat || 'HH:mm');
				var t12 = format.indexOf('a') !== -1;

				if (t12)
					format = format.replace(/a/).trim();

				format += ':ss' + (t12 ? ' a' : '');

				fn = function() {
					if (is) {
						NOW = new Date();
						var newformat = format;
						if (NOW.getSeconds() % 2 === 0)
							newformat = format.replace(/:/g, ' ');
						span.html(NOW.format(newformat));
					}
				};

				setInterval(fn, 1000);
				fn();
			};

			self.setter = function(value) {
				is = value === config.if;
				is && fn();
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="time"></ui-component>

</body>
</html>
