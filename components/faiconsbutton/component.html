<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-disabled .ui-faiconsbutton-button { cursor: not-allowed !important; opacity: 0.6; border-color: #E0E0E0 !important; }
		.ui-faiconsbutton-button { border: 1px solid #E0E0E0; height: 32px; border-radius: var(--radius); cursor: pointer; background-color: #FFF; color: #000000; }
		.ui-faiconsbutton-label { margin-bottom: 3px; font-size: 12px; }
		.ui-faiconsbutton-label i { margin-right: 4px; }
		.ui-faiconsbutton-icon { height: 24px; margin: 0 32px 0 0; line-height: 32px; font-size: 20px; text-align: center; }
		.ui-faiconsbutton:hover { border-color: #D0D0D0; }
		.ui-faiconsbutton-arrow { width: 32px; float: right; display: block; text-align: center; line-height: 31px; height: 31px; border-left: 1px solid #E0E0E0; }

		.ui-dark .ui-faiconsbutton.ui-disabled { border-color: #404040 !important; }
		.ui-dark .ui-faiconsbutton { border-color: #404040; background-color: #303030; color: #FFF; }
		.ui-dark .ui-faiconsbutton-arrow { border-left-color: #404040; }
		.ui-dark .ui-faiconsbutton:hover { border-color: #505050; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('faiconsbutton', 'default:#FFFFFF;align:left;position:top;empty:1', function(self, config) {

			var cls = 'ui-faiconsbutton';
			var icon;

			self.nocompile();

			self.make = function() {

				self.aclass(cls);

				self.dom.innerHTML && self.element.wrapInner('<div class="{0}-label"></div>'.format(cls));
				self.append('<div class="{0}-button"><span class="{0}-arrow"><i class="fa fa-angle-down"></i></span><div class="{0}-icon"></div></div>'.format(cls));

				icon = self.find('.' + cls + '-icon');

				self.event('click', function() {
					if (config.disabled)
						return;
					var opt = {};
					opt.align = config.align;
					opt.position = config.position;
					opt.offsetX = config.offsetX;
					opt.offsetY = config.offsetY;
					opt.element = self.element;
					opt.empty = config.empty;
					opt.callback = function(icon) {
						self.set(icon);
						self.change(true);
					};
					SETTER('faicons/show', opt);
				});
			};

			self.configure = function(key, value) {
				switch (key) {
					case 'disabled':
						self.tclass('ui-disabled', !!value);
						break;
				}
			};

			self.setter = function(value) {
				icon.html(value ? '<i class="{0}"></i>'.format(value) : '');
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="faicons"></ui-component>

	<div class="row">
		<div class="col-xs-4">
			<ui-component name="faiconsbutton" path="icon"></ui-component>
		</div>
	</div>

	<script>
		var icon = 'fa fa-home';
	</script>

</body>
</html>
