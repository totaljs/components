<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
	<link href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-wiper-button-next.swiper-button-next:after, .ui-wiper-button-prev.swiper-button-prev:after { color: var(--color); }
		.ui-wiper-pagination .swiper-pagination-bullet-active { background: var(--color); }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('swiper', function(self, config, cls) {

			var cls2 = '.' + cls;
			var container, body, pagination, navigation, items, swiper;
			var opt = {};
			var inactivitytimer;
			var resettime = config.reset !== undefined ? config.reset * 60000 : null;

			self.readonly();

			self.make = function() {

				var scr = self.find('script');
				if (scr.length) {
					self.template = Tangular.compile(scr.html());
					scr.remove();
				}

				self.aclass(cls);
				self.element.wrapInner('<div class="swiper {0}-container {0}-{1}"><div class="swiper-wrapper {0}-body"></div></div>'.format(cls, self.id));
				container = self.find(cls2 + '-container');

				body = self.find(cls2 + '-body');
				items = body.find('> figure').toArray();

				self.rclass('hidden invisible', 500);

				if (config.pagination) {
					pagination = '<div class="swiper-pagination {0}-pagination"></div>'.format(cls);
					container.append(pagination);
					opt.pagination = {
						el: '.swiper-pagination',
						clickable: true
					};
				}

				if (config.navigation) {
					navigation = '<div class="swiper-button-next {0}-button-next"></div><div class="swiper-button-prev {0}-button-prev"></div>'.format(cls);
					container.append(navigation);
					opt.navigation = {
						nextEl: '.swiper-button-next',
						prevEl: '.swiper-button-prev'
					};
				}

				if (config.autoplay) {
					opt.autoplay = {
						delay: config.delay || 2500,
						disableOnInteraction: false
					};
				}

				opt.slidesPerView = 1;
				opt.loopAddBlankSlides = true;
				opt.spaceBetween = config.spacebetween || 0;
				opt.loop = config.loop && true;
				opt.freeMode = config.freemode && true;
				opt.lazy = true;

				opt.breakpoints = {
					640: {
						slidesPerView: 2,
						spaceBetween: 20
					},
					768: {
						slidesPerView: config.slidesperview || 1,
						spaceBetween: config.spacebetween || 0
					}
				};

				setTimeout(() => {
				 	swiper = new Swiper(cls2 + '-' + self.id, opt);
				 	if (resettime !== null) 
				 		resettimer();
				}, 500);

				if (resettime !== null) {
					document.addEventListener('pointerdown', resettimer);
					document.addEventListener('wheel', resettimer);
					document.addEventListener('keydown', resettimer);
					document.addEventListener("visibilitychange", () => {
						if (document.visibilityState === "visible") 
							resettimer();
					});
				}

				function resettimer() {
					clearTimeout(inactivitytimer);
					inactivitytimer = setTimeout(() => {
						if (swiper) 
							swiper.slideTo(0);
					}, resettime);
				}
			};

			self.setter = function(value) {

				if (!value || !(value instanceof Array)) {
					if (self.template) {
						body.html('');
						self.aclass('hidden');
					}
					return;
				}

				var builder = [];
				for (var i = 0; i < value.length; i++) {
					var item = value[i];
					builder.push('<figure class="swiper-slide">' + self.template(item) + '</figure>');
				}

				body.html(builder.join(''));
				self.rclass('hidden');
				items = body.find('> figure').toArray();
			};

		}, [function(next) {
			let cdn = (DEF.cdn || 'https://cdn.componentator.com');
			IMPORT(cdn + '/swiper.min@11.js', () => IMPORT(cdn + '/swiper.min@11.css', next));
		}]);

	</script>

	<!-- Example -->
	<div style="margin-bottom:30px">
		<ui-component name="swiper" path="datasource" config="slidesperview:3;spacebetween:30;pagination:1;navigation:1" class="hidden invisible">
			<script type="text/html">
				<div style="background-color:#E0E0E0;height:150px;color:#000">{{ name }}</div>
			</script>
		</ui-component>
	</div>

	<div>
		<ui-component name="swiper" config="slidesperview:3;autoplay:1" class="hidden invisible">
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">A</div></figure>
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">B</div></figure>
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">C</div></figure>
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">D</div></figure>
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">E</div></figure>
			<figure class="swiper-slide"><div style="background-color:#E0E0E0;height:150px;color:#000">F</div></figure>
		</ui-component>
	</div>
	<script>
		var datasource = [{ name: 'A' }, { name: 'B' }, { name: 'C' }, { name: 'D' }, { name: 'E' }, { name: 'F' }, { name: 'G' }, { name: 'H' }, { name: 'I' }, { name: 'J' }]
	</script>

</body>
</html>
