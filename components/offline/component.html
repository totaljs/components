<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-offline { position: fixed; width: 100%; height: 100%; background-color: rgba(255,255,255,0.8); left: 0; top: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; }
		.ui-offline-message { padding: 20px; background: #FFF; border-radius: var(--radius); box-shadow: 0 5px 20px rgba(0,0,0,0.1); max-width: 260px; text-align: center; }
		.ui-dark .ui-offline { background-color: rgba(0,0,0,0.8); }
		.ui-dark .ui-offline-message { background: #333; }
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('offline', function(self, config, cls) {

			self.singleton();
			self.make = function() {
				self.aclass(cls);
				self.element.wrapInner('<div class="{0}-message"></div>'.format(cls));
				self.tclass('hidden', navigator.onLine);
				$(W).on('online', function() {
					self.aclass('hidden');
				}).on('offline', function() {
					self.rclass('hidden');
				});
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="offline" class="hidden">
		<div style="font-size:60px"><i class="ti ti-globe red"></i></div>
		<b>No internet connection</b>
		<div style="font-size:12px">Please check your network connection and try again.</div>
	</ui-component>

	<div class="padding">Use the Web Developer Tools to turn off the internet via the Network tab.</div>

</body>
</html>
