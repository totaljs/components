<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-serviceworker {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('serviceworker', 'debug:false;expire:1 day', function(self, config) {

			var messenger;
			var datasource;

			self.singleton();
			self.nocompile();
			self.novalidate && self.novalidate();

			self.configure = function(key, value) {

				switch (key) {
					case 'datasource':
						self.datasource(value, self.bind_value);
						break;
				}

			};

			self.init = function() {
				if ('serviceWorker' in navigator) {
					$(function() {
						navigator.serviceWorker.register('/sw-jcomponent.js').then(function(registration) {
							messenger = registration.installing || navigator.serviceWorker.controller || registration.active;
						}).catch(console.log);
					});
				}
			};

			self.bind_value = function(path, value) {
				if (M.is20)
					value = path;

				datasource = value;

				var version = (value.version || '1') + HASH(value.assets.toString());
				if (!value || (version === CACHE('jc-sw-version') && !config.debug))
					return;

				self.updatecache();
			};

			self.setter = function(value, path, type) {
				if (!type)
					return;
				datasource.version = value;
				self.updatecache();
			};

			self.updatecache = function() {

				if (!messenger) {
					setTimeout(self.updatecache, 200);
					return;
				}

				var obj = {};
				obj.action = 'jc-sw';
				obj.data = datasource;
				obj.data.version = config.debug ? (new Date().getTime()) : (datasource.version || '1');
				CACHE('jc-sw-version', obj.data.version + HASH(datasource.assets.toString()), config.expire);
				messenger.postMessage(obj);
			};
		});

	</script>

	<!-- Example -->
	<h3 class="center">Please read the documentation</h3>

</body>
</html>
