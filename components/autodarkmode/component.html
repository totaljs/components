<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@20.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@20.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-autodarkmode {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('autodarkmode', function(self, config) {

			self.readonly();
			self.singleton();
			self.blind();

			self.make = function() {

				var body = $('body');
				var match = W.matchMedia('(prefers-color-scheme: dark)');

				match.addEventListener('change', function(e) {
					body.tclass('ui-dark', e.matches);
					config.exec && self.SEEX(config.exec, match.matches);
				});

				body.tclass('ui-dark', match.matches);
				config.exec && self.SEEX(config.exec, match.matches);
			};

		});

	</script>

	<!-- Example -->
	<ui-component name="autodarkmode"></ui-component>

</body>
</html>
