<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-modificator {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('modificator', function(self) {

			var reg_search = /\+|\s/;
			var keys, keys_unique;
			var db = {};

			self.readonly();
			self.blind();

			self.make = function() {

				self.watch('*', self.autobind);
				self.scan();

				var fn = function() {
					setTimeout2(self.id, self.scan, 200);
				};

				self.on('import', fn);
				self.on('component', fn);
				self.on('destroy', fn);

				$(document).on('click', '.modify', function() {
					var el = $(this);
					self.click(el.attrd('m'), el.attrd('m-schema'));
				});

			};

			self.autobind = function(path, value, type) {

				var mapper = keys[path];
				if (!mapper)
					return;

				for (var i = 0, length = mapper.length; i < length; i++) {
					var item = mapper[i];
					var schema = db[item.schema];
					item.event.type = 'bind';
					item.event.bindtype = type;
					schema && schema(GET(item.path), item.selector ? item.element.find(item.selector) : item.element, item.event);
				}
			};

			self.click = function(path, schema) {

				if (path.substring(0, 1) === '%')
					path = 'jctmp.' + path.substring(1);

				var fn = db[schema];
				if (fn) {
					var arr = keys[path];
					if (arr) {
						var val = GET(path);
						for (var i = 0, length = arr.length; i < length; i++) {
							var obj = arr[i];
							if (obj.schema === schema) {
								obj.event.type = 'click';
								obj.event.bindtype = -1;
								fn(val, obj.selector ? obj.element.find(obj.selector) : obj.element, obj.event);
							}
						}
					}
				}
				return self;
			};

			self.reinit = function(path) {
				var arr = keys[path];
				for (var i = 0, length = arr.length; i < length; i++) {
					var obj = arr[i];
					obj.event.type = 'init';
					obj.event.bindtype = -1;
					var schema = db[obj.schema];
					schema && schema(GET(obj.path), obj.selector ? obj.element.find(obj.selector) : obj.element, obj.event);
				}
				return self;
			};

			self.register = function(name, fn) {
				db[name] = fn;
				var paths = Object.keys(keys);
				for (var i = 0, length = paths.length; i < length; i++) {
					var arr = keys[paths[i]];
					for (var j = 0, jl = arr.length; j < jl; j++) {
						var obj = arr[j];
						if (obj.init || obj.schema !== name)
							continue;
						obj.init = true;
						obj.event.type = 'init';
						obj.event.bindtype = -1;
						fn(GET(obj.path), obj.selector ? obj.element.find(obj.selector) : obj.element, obj.event);
					}
				}
				return self;
			};

			self.scan = function() {
				keys = {};
				keys_unique = {};

				var keys_news = {};

				self.find('[data-m]').each(function() {

					var el = $(this);
					var path = (el.attrd('m') || '').replace('%', 'jctmp.');
					var p = '';
					var schema = '';

					if (reg_search.test(path)) {
						var arr = path.replace(/\s+\+\s+/, '+').split(reg_search);
						path = arr[0];
						schema = arr[1];
					}

					if (path.indexOf('?') !== -1) {
						var scope = el.closest('[data-jc-scope]');
						if (scope) {
							var data = scope[0].$scopedata;
							if (data == null)
								return;
							path = path.replace(/\?/g, data.path);
						} else
							return;
					}

					arr = path.split('.');

					var obj = el.data('data-m');
					keys_unique[path] = true;

					if (!obj) {
						obj = {};
						obj.path = path;
						obj.schema = schema || el.attrd('m-schema');
						obj.selector = el.attrd('m-selector');
						obj.element = el;
						obj.event = { type: 'init' };
						obj.init = false;
						el.data('data-m', obj);
						keys_news[path] = true;
						if (db[obj.schema]) {
							obj.init = true;
							db[obj.schema](GET(obj.path), obj.selector ? obj.element.find(obj.selector) : obj.element, obj.event);
						}
					}

					for (var i = 0, length = arr.length; i < length; i++) {
						p += (p ? '.' : '') + arr[i];
						if (keys[p])
							keys[p].push(obj);
						else
							keys[p] = [obj];
					}
				});

				var nk = Object.keys(keys_news);
				for (var i = 0; i < nk.length; i++)
					self.autobind(nk[i]);

				return self;
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="modificator">
		<div><a href="javascript:void(0)" class="modify" data-m="obj.a" data-m-schema="link">Click 1</a> second: <a href="javascript:void(0)" class="modify" data-m="obj.a" data-m-schema="link">Click 2</a></div>
		<br />
		<div><button class="modify" data-m="obj.b" data-m-schema="button"><i></i><b>Submit</b></button></div>
	</ui-component>

	<script>

		// v20 STYLE(), v19 CSS()
		(W.STYLE?W.STYLE:W.CSS)('.sending{color:black;font-weight:bold;cursor:not-allowed}.done{color:green;font-weight:bold;}button .ti{margin-right:5px;}');

		// Register modificator schemas

		SETTER(true, 'modificator', 'register', 'link', function(value, element, e) {
			switch (e.type) {
				case 'init':
					break;
				case 'click':
					element.aclass('sending').html('Sending...');
					break;
				default:
					if (value != null)
						element.rclass().aclass('done').html(value);
					break;
			}

		});

		SETTER(true, 'modificator', 'register', 'button', function(value, element, e) {
			switch (e.type) {
				case 'init':
					e.icon = element.find('i');
					e.html = element.html();
					break;
				case 'click':
					e.icon.rclass().aclass('ti ti-spinner ti-refresh');
					element.prop('disabled', true).find('b').html('Sending...');
					break;
				default:
					e.icon.rclass();
					element.prop('disabled', false);
					element.find('b').html(e.html);
					if (value != null)
						e.icon.aclass('ti ' + (value ? 'ti-check-circle' : 'ti-times-circle'));
					break;
			}
		});

		var obj = {};

		obj.a = null;
		obj.b = null;

		// Only for test
		$(document).on('click', '.modify', function(e) {
			var path = $(this).attr('data-m');
			if (path === 'obj.a') {
				SET(path, 'Success', 3000);
			} else {
				SET(path, true, 3000);
				SET(path, null, 5000);
			}
		});


	</script>

</body>
</html>
