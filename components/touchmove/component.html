<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=11" />
	<meta name="format-detection" content="telephone=no" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta name="robots" content="all,follow" />
	<link href="https://cdn.componentator.com/spa.min@19.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.componentator.com/spa.min@19.js"></script>
</head>
<body>

	<!-- Style -->
	<style component>
		.ui-touchmove {}
	</style>

	<!-- Source-code -->
	<script component>

		COMPONENT('touchmove', 'diff:110', function(self, config) {

			var begX, begY;

			self.readonly();
			self.make = function() {
				self.event('touchstart touchmove', function(e) {

					var x = e.originalEvent.touches[0].pageX;
					var y = e.originalEvent.touches[0].pageY;

					if (e.type === 'touchstart') {
						begX = x;
						begY = y;
						return;
					}

					var diffX = begX - x;
					var diffY = begY - y;
					var path;

					if (diffX > config.diff) {
						// prev
						path = config.next;
					} else if (diffX < -config.diff) {
						// prev
						path = config.prev;
					} else if (diffY > config.diff) {
						// down
						path = config.down;
					} else if (diffY < -config.diff) {
						// up
						path = config.up;
					}

					if (path) {
						self.get(path)();
						e.preventDefault();
						e.stopPropagation();
					}
				});
			};
		});

	</script>

	<!-- Example -->
	<ui-component name="touchmove" config="prev:goPrev;next:goNext;up:goUp;down:goDown">
		<br />
		<br />
		<br />
		TRY TO TAP
		<br />
		<br />
		<br />
	</ui-component>

	<script>
		function goPrev() {
			alert('Prev');
		}
		function goNext() {
			alert('Next');
		}
		function goUp() {
			alert('Up');
		}
		function goDown() {
			alert('Down');
		}
	</script>

</body>
</html>
