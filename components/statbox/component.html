						}
						break;
				}
			};

			self.setter = function(value) {
				render(value);
			};

			self.destroy = function() {
				raf && cancelAnimationFrame(raf);
			};

		});

	</script>

	<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:12px;max-width:1100px">

		<div style="grid-column:1/-1">
			<ui-component name="statbox" path="stats.visitors" config="icon:ti ti-users;size:large;period:vs yesterday;live:Live;click:onstatclick">Visitors</ui-component>
		</div>

		<ui-component name="statbox" path="stats.pageviews" config="icon:ti ti-eye;style:accent;period:vs yesterday">Page views</ui-component>

		<ui-component name="statbox" path="stats.bounce" config="icon:ti ti-door-open;style:soft;format:percent;decimals:1;goodup:false;period:vs yesterday">Bounce rate</ui-component>

		<ui-component name="statbox" path="stats.duration" config="icon:ti ti-stopwatch;format:duration;period:vs yesterday">Average time</ui-component>

		<ui-component name="statbox" path="stats.revenue" config="icon:ti ti-shopping-cart;style:solid;format:currency;currency:EUR;period:of the monthly goal">Sales</ui-component>

		<ui-component name="statbox" path="stats.agents" config="icon:ti ti-robot;style:accent;color:#6250D6;period:vs last week">AI agent visits</ui-component>

		<ui-component name="statbox" path="stats.lcp" config="icon:ti ti-bolt;size:small;unit:ms;goodup:false;period:Largest Contentful Paint">Load time</ui-component>

		<ui-component name="statbox" path="stats.empty" config="icon:ti ti-globe;size:small">Countries</ui-component>

		<div style="grid-column:1/-1">
			<ui-component name="statbox" path="stats.total" config="style:minimal;size:large;period:in the last 30 days">Total visits</ui-component>
		</div>

	</div>

		setInterval(function() {

			SET('stats.visitors', { value: value, previous: model.previous, trend: trend });

		}

	</script>
